<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAMERA OPTOM QARSHI — Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--acc:#2fe0b6;--bg:#0a0c0d;--card:#14181a;--bar:#0d1112;--fg:#eef2f1;--fg2:#c8d3d1;--dim:#8a9694;--dim2:#7f8c8a;--dim3:#9fb0ad;--dim4:#6d7a78;--dim5:#5c6a68;--tile:#0f1416;--panel2:#101618;--thead:#101416;--hatchA:#181e20;--hatchB:#151b1d;--hatchC:#1b2224;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.07);--line3:rgba(255,255,255,.12);--line4:rgba(255,255,255,.15);--fill:rgba(255,255,255,.06)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-thumb{background:var(--line4);border-radius:4px}
#root{height:100%}
input,textarea{font-family:inherit}
@media (max-width:900px){ #side{display:none} }
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ═══ KAMERA OPTOM QARSHI — admin panel (Claude Design "1b" prototipi) ═══ */
const A='var(--acc)', RED='#ff4d3d', AMB='#ffb020';
const M=n=>n.toLocaleString('ru-RU').replace(/,/g,' ');
const fmt=n=>M(n)+" so'm";
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

let _token = '';
let _tab = 'orders';
try {
  _token = localStorage.getItem('ko_admin_token') || '';
  _tab = localStorage.getItem('ko_admin_tab') || 'orders';
} catch(e){}

async function api(url, opt={}){
  const headers = { ...(opt.headers || {}) };
  if (S.token) headers['Authorization'] = 'Bearer ' + S.token;
  let r;
  try {
    r = await fetch(url, { ...opt, headers });
  } catch (err) {
    throw new Error('Server bilan aloqa yo\'q');
  }
  if (r.status === 401) {
    logout();
    throw new Error('Sessiya tugadi — qayta kiring');
  }
  if (!r.ok) {
    const errData = await r.json().catch(() => ({}));
    throw new Error(errData.error || ('Server xatosi: HTTP ' + r.status));
  }
  return r.status === 204 ? null : r.json();
}

async function doLogin(){
  if (!S.loginUser.trim() || !S.loginPass) {
    set({ loginErr: 'Login va parolni kiriting' });
    return;
  }
  set({ loginLoading: true, loginErr: '' });
  try {
    const r = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: S.loginUser.trim(), password: S.loginPass })
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      throw new Error(data.error || 'Login yoki parol noto’g’ri');
    }
    try { localStorage.setItem('ko_admin_token', data.token); } catch(e){}
    set({ token: data.token, adminUser: data.admin, loginPass: '', loginLoading: false, loginErr: '' });
    flash('Xush kelibsiz, ' + (data.admin.name || data.admin.username));
  } catch (err) {
    set({ loginLoading: false, loginErr: err.message });
  }
}

function logout(){
  try { localStorage.removeItem('ko_admin_token'); } catch(e){}
  set({ token: '', adminUser: null, loginPass: '', loginErr: '' });
}

const PRODUCTS=[
  {sku:'IPC-2410', name:'IPC-2410 Bullet 4MP', cat:'Tashqi', price:690000},
  {sku:'PTZ-5X', name:'PTZ-5X Dome 5MP', cat:'Aylanuvchi', price:1890000},
  {sku:'NVR-8CH', name:'NVR-8CH 4K registrator', cat:'Yozuvchi', price:1450000},
  {sku:'WIFI-MINI', name:'WiFi Mini 3MP ichki', cat:'Ichki', price:390000},
  {sku:'DOMO-IP2', name:'IP Domofon 2MP', cat:'Domofon', price:1240000},
  {sku:'SD-64', name:'microSD 64GB Endurance', cat:'Xotira', price:150000},
  {sku:'SD-256', name:'microSD 256GB Endurance', cat:'Xotira', price:420000},
  {sku:'HDD-2T', name:'HDD 2TB Surveillance', cat:'Xotira', price:620000},
  {sku:'NVR-16CH', name:'NVR-16CH 4K registrator', cat:'Yozuvchi', price:2380000},
  {sku:'DVR-4CH', name:'DVR-4CH analog registrator', cat:'Yozuvchi', price:790000},
  {sku:'KIT-UY4', name:'Komplekt "Uy 4"', cat:'Komplekt', price:4350000}
];

const S={
  token: _token, adminUser: null, loginUser: 'admin', loginPass: '', loginErr: '', loginLoading: false,
  adminTab: _tab, toast:null,
  orders: [], kpiData: null, stockProducts: [],
  promo:{'IPC-2410':'HIT','KIT-UY4':'CHEGIRMA','PTZ-5X':'YANGI'},
  labelOn:{HIT:true,CHEGIRMA:true,YANGI:true},
  mod:{banners:true,stories:true,gps:true,memory:true,cable:true,install:true,cloud:true},
  rates:{3:0,6:8,12:14,24:26}, rateOn:{3:true,6:true,12:true,24:true}, down:{3:0,6:10,12:20,24:30},
  creditService:true, expertService:true,
  provOn:{'Uzum Nasiya':true,'Alif Nasiya':true,'Hamkor Nasiya':true},
  qty:{},
  orderStatus:{}, notes:{}, noteDraft:null, noteText:'',
  video:true,
  cId:null, cTitle:'', cCams:'', cDate:'', cText:'', cTags:[], cLive:true, cFile:'',
  storyList:[],
  callbacks:[],
  loading:false, loaded:false
};

let H=[];
const h=fn=>`_h(${H.push(fn)-1},event)`;
window._h=(i,e)=>{ const f=H[i]; if(f) f(e); };
let _t=null;
function set(o){
  Object.assign(S, typeof o==='function'?o(S):o);
  try {
    if (S.token) localStorage.setItem('ko_admin_token', S.token);
    if (S.adminTab) localStorage.setItem('ko_admin_tab', S.adminTab);
  } catch(e){}
  render();
}
function flash(t){ S.toast=t; clearTimeout(_t); _t=setTimeout(()=>{S.toast=null;render();},2200); render(); }
function promoStyle(k){ return ({HIT:{fg:'#2a1a00',bg:'#ffb020',border:'#ffb020'},CHEGIRMA:{fg:'#ffffff',bg:'#ff4d3d',border:'#ff4d3d'},YANGI:{fg:'#06231d',bg:'#2fe0b6',border:'#2fe0b6'}})[k]||{fg:'var(--dim2)',bg:'var(--fill)',border:'var(--line3)'}; }
function moveStory(i,d){ const l=[...S.storyList], j=i+d; if(j<0||j>=l.length) return; [l[i],l[j]]=[l[j],l[i]]; set({storyList:l}); }
function exportCSV(rows){
  const csv=['ID;MIJOZ;TELEFON;MAHSULOT;SUMMA;O\'RNATISH;STATUS',...rows.map(o=>[o.id,o.client,o.phone,o.item,o.sum,o.install,o.status].join(';'))].join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent('\uFEFF'+csv);
  a.download='buyurtmalar.csv'; a.click();
  flash('CSV fayl yuklandi');
}

async function bootstrap(){
  if (!S.token) return;
  set({ loading: true });
  try {
    const [orders, kpis, stock, settings, stories, callbacks] = await Promise.all([
      api('/api/admin/orders'),
      api('/api/admin/kpis'),
      api('/api/admin/stock'),
      api('/api/admin/settings'),
      api('/api/stories'),
      api('/api/admin/callbacks').catch(()=>[])
    ]);
    const promoMap = {};
    const qtyMap = {};
    for (const p of (stock || [])) {
      if (p.promo) promoMap[p.sku] = p.promo;
      qtyMap[p.sku] = p.qty;
    }
    set({
      orders: orders || [],
      kpiData: kpis,
      stockProducts: stock || [],
      promo: promoMap,
      qty: qtyMap,
      mod: (settings && settings.modules) || S.mod,
      rates: (settings && settings.credit && settings.credit.rates) || S.rates,
      down: (settings && settings.credit && settings.credit.down) || S.down,
      storyList: stories || [],
      callbacks: callbacks || [],
      loading: false,
      loaded: true
    });
  } catch (err) {
    set({ loading: false });
    flash(err.message);
  }
}

function vals(){
  const s=S;
  const chip=on=>({border:on?A:'var(--line3)', bg:on?'rgba(47,224,182,.12)':'var(--card)', fg:on?A:'var(--dim3)'});
  const ST={Yangi:{fg:AMB,bg:'rgba(255,176,32,.12)',border:'rgba(255,176,32,.35)'},Tasdiqlandi:{fg:'#7fb4ff',bg:'rgba(127,180,255,.12)',border:'rgba(127,180,255,.35)'},"O'rnatishda":{fg:A,bg:'rgba(47,224,182,.12)',border:'rgba(47,224,182,.35)'},Yopildi:{fg:'var(--dim)',bg:'var(--fill)',border:'var(--line3)'},Bekor:{fg:RED,bg:'rgba(255,77,61,.12)',border:'rgba(255,77,61,.35)'}};
  const FLOW=['Yangi','Tasdiqlandi',"O'rnatishda",'Yopildi'];
  const NOTE_DEF={'Yangi':'','Tasdiqlandi':'Buyurtmangiz tasdiqlandi. O’lchovchi mutaxassis bugun aloqaga chiqadi.',
    "O'rnatishda":'Usta yo’lda — bugun 10:00 dan 12:00 gacha yetib boradi.',
    'Yopildi':'O’rnatish tugadi. Kafolat taloni ilovada saqlanadi, savollar bo’lsa yozing.'};

  const orders = s.orders.map(o=>{
    const st = s.orderStatus[o.id] || o.status || 'Yangi';
    const nt = s.notes[o.id] || (o.note ? { text: o.note, time: '' } : null);
    const itemStr = (Array.isArray(o.items) && o.items.length)
      ? o.items.map(it => (it.name || it.sku) + (it.qty > 1 ? ' × ' + it.qty : '')).join(', ')
      : (o.region || 'Buyurtma');
    const rawPh = String(o.phone || '').replace(/[^0-9]/g, '');
    const phoneStr = rawPh.length === 9 ? ('+998 ' + rawPh.replace(/(\d{2})(\d{3})(\d{2})(\d{2})/, '$1 $2 $3 $4')) : (o.phone || '—');
    const installStr = o.install ? (o.install_at || (o.created_at ? o.created_at.slice(5,10) + ' · 10:00' : 'Rejalashtirilgan')) : 'Kerak emas';
    return {
      id: o.id,
      client: o.client_name || 'Mijoz',
      phone: phoneStr,
      rawPhone: o.phone,
      item: itemStr,
      sum: fmt(o.total || o.goods_sum || 0),
      install: installStr,
      status: st,
      ...(ST[st] || ST.Yangi),
      noteOn: !!nt,
      note: nt ? nt.text : '',
      next: async ()=>{
        const ns = FLOW[(FLOW.indexOf(st)+1)%4];
        try {
          const updated = await api('/api/admin/orders/'+o.id.replace('#','')+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:ns})});
          set(stt=>({
            orders: stt.orders.map(x=>x.id===o.id?updated:x),
            orderStatus:{...stt.orderStatus,[o.id]:ns},
            noteDraft:{id:o.id,client:o.client_name||'Mijoz',phone:phoneStr,status:ns},
            noteText:NOTE_DEF[ns]||''
          }));
          api('/api/admin/kpis').then(kd=>set({kpiData:kd})).catch(err=>flash(err.message));
        } catch(err) { flash(err.message); }
      }
    };
  });

  const LBL=['HIT','CHEGIRMA','YANGI'];
  const stock = s.stockProducts.map(p=>{
    const q = p.qty ?? 0;
    const state = q===0?'Tugadi':q<10?'Kam qoldi':'Yetarli';
    return {
      name: p.name, sku: p.sku, price: fmt(p.price), qty: q, state,
      fg: q===0?RED:q<10?AMB:A, bg: q===0?'rgba(255,77,61,.12)':q<10?'rgba(255,176,32,.12)':'rgba(47,224,182,.12)',
      labels: LBL.map(n=>{
        const on = (s.promo[p.sku]===n) || (p.promo===n);
        const st = promoStyle(n);
        return {
          name: n, short: n==='CHEGIRMA'?'CHEG':n==='YANGI'?'YANGI':'HIT',
          fg: on?st.fg:'var(--dim2)', bg: on?st.bg:'var(--fill)', border: on?st.border:'var(--line3)',
          go: async ()=>{
            const nextPromo = on ? null : n;
            try {
              await api('/api/admin/products/'+p.sku,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({promo:nextPromo})});
              set(pr=>({
                promo: { ...pr.promo, [p.sku]: nextPromo },
                stockProducts: pr.stockProducts.map(x=>x.sku===p.sku?{...x,promo:nextPromo}:x)
              }));
            } catch(err) { flash(err.message); }
          }
        };
      }),
      plus: async ()=>{
        const q2 = (p.qty || 0) + 1;
        try {
          await api('/api/admin/products/'+p.sku,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({qty:q2})});
          set(pr=>({
            qty:{...pr.qty,[p.sku]:q2},
            stockProducts: pr.stockProducts.map(x=>x.sku===p.sku?{...x,qty:q2}:x)
          }));
          api('/api/admin/kpis').then(kd=>set({kpiData:kd})).catch(err=>flash(err.message));
        } catch(err) { flash(err.message); }
      },
      minus: async ()=>{
        const q2 = Math.max(0,(p.qty || 0)-1);
        try {
          await api('/api/admin/products/'+p.sku,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({qty:q2})});
          set(pr=>({
            qty:{...pr.qty,[p.sku]:q2},
            stockProducts: pr.stockProducts.map(x=>x.sku===p.sku?{...x,qty:q2}:x)
          }));
          api('/api/admin/kpis').then(kd=>set({kpiData:kd})).catch(err=>flash(err.message));
        } catch(err) { flash(err.message); }
      }
    };
  });

  const openOrdersCount = String(s.orders.length || 0);
  const stockCount = String(s.stockProducts.length || 0);
  const storiesCount = String(s.storyList.length || 0);
  const installCount = String(s.orders.filter(o=>o.install && !['Yopildi','Bekor'].includes(o.status)).length || 0);
  const creditCount = String(Object.keys(s.rates||{}).length || 0);

  const aNav=[
    ['orders','Buyurtmalar',openOrdersCount],
    ['products','Mahsulotlar',stockCount],
    ['credit',"Muddatli to'lov",creditCount],
    ['stories','Ishlarimiz video',storiesCount],
    ['settings','Sozlamalar',''],
    ['stats','Statistika',''],
    ['install',"O'rnatish jadvali",installCount],
    ['clients','Mijozlar','']
  ];
  const adminNav=aNav.map(([k,name,badge])=>({name,badge,go:()=>set({adminTab:k==='install'||k==='clients'?'orders':k}),
    bg:s.adminTab===k?'rgba(47,224,182,.12)':'transparent', fg:s.adminTab===k?A:'var(--dim3)', badgeFg:s.adminTab===k?A:'var(--dim5)'}));

  const T={
    orders:['Buyurtmalar',s.orders.length ? `Jami ${s.orders.length} buyurtma · ${installCount} o’rnatish rejalashtirilgan` : 'Buyurtmalar ro’yxati'],
    products:['Mahsulotlar va ombor',s.stockProducts.length ? `${s.stockProducts.length} pozitsiya · ${s.stockProducts.filter(p=>(p.qty??0)<10).length} tasi kam qoldi` : 'Ombordagi tovarlar'],
    credit:["Muddatli to'lov shartlari",'Foizlar mijoz ilovasida darhol ko’rinadi'],
    stories:['Ishlarimiz · video lenta','Mijoz ilovasidagi bosh sahifada ko’rinadi'],
    settings:['Sozlamalar · ilova modullari','Har bir tugma mijoz ilovasiga darhol ta’sir qiladi'],
    stats:['Statistika','Barcha savdo va ko’rsatkichlar']
  }[s.adminTab] || ['Boshqaruv',''];

  const ALLPROV=[{name:'Uzum Nasiya',note:'12 oygacha · ilova ichida ariza'},{name:'Alif Nasiya',note:'Pasport + selfi · 10 daqiqada javob'},{name:'Hamkor Nasiya',note:'24 oygacha · bank kartasi bilan'}];
  const RT=[3,6,12,24];
  const monthlyFor=(m,b)=>Math.round(b*(1+(s.rates[m]||0)/100)/m/1000)*1000;
  const rateRows=RT.map(m=>{const on=s.rateOn[m]; return {months:m+' oy',rate:(s.rates[m]||0)+' %',w:Math.min(100,(s.rates[m]||0)/30*100)+'%',
    monthly:fmt(monthlyFor(m,4350000))+'/oy', down:s.down[m]?s.down[m]+' % ('+fmt(4350000*s.down[m]/100)+')':'Yo’q',
    trackBg:on?A:'var(--line4)', knob:on?'flex-end':'flex-start', knobBg:on?'#06231d':'var(--dim)',
    plus:async ()=>{
      const nextRate = Math.min(60,(pRate=>pRate+1)(s.rates[m]||0));
      const nextRates = {...s.rates,[m]:nextRate};
      try {
        await api('/api/admin/settings/credit',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({rates:nextRates})});
        set({rates:nextRates});
      } catch(err){ flash(err.message); }
    },
    minus:async ()=>{
      const nextRate = Math.max(0,(pRate=>pRate-1)(s.rates[m]||0));
      const nextRates = {...s.rates,[m]:nextRate};
      try {
        await api('/api/admin/settings/credit',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({rates:nextRates})});
        set({rates:nextRates});
      } catch(err){ flash(err.message); }
    },
    toggle:()=>set(p=>({rateOn:{...p.rateOn,[m]:!p.rateOn[m]}}))};});

  const barVals=[38,44,41,52,49,61,58];
  const bars=barVals.map((v,i)=>({value:v,label:['Fev','Mar','Apr','May','Iyn','Iyl','Avg'][i],h:Math.round(v/61*100)+'%',fill:i===6?A:'rgba(47,224,182,.28)'}));

  const kd = s.kpiData || {};
  const todayRev = kd.todayRevenue || 0;
  const revText = todayRev >= 1000000 ? ((todayRev/1000000).toFixed(1) + ' mln') : fmt(todayRev);
  const lowStockNames = s.stockProducts.filter(p=>(p.qty??0)<10).map(p=>p.sku).slice(0,3).join(' · ') || 'Yetarli';

  const selP = s.stockProducts.find(p=>p.sku==='IPC-2410') || s.stockProducts[0] || {name:'IPC-2410 Bullet 4MP',cat:'Tashqi',price:690000,spec:'4MP · IR 30m · PoE · IP67',qty:0};
  const formFields=[
    {label:'NOMI',value:selP.name},
    {label:'TURKUM',value:selP.cat+' kameralar'},
    {label:'NARX',value:fmt(selP.price)},
    {label:'XARAKTERISTIKA',value:selP.spec || (selP.tags ? selP.tags.join(' · ') : '4MP · IR 30m')},
    {label:'OMBORDA',value:(selP.qty || 0)+' dona'}
  ];

  return {
    adminNav, adminTitle:T[0], adminSub:T[1],
    goProducts:()=>set({adminTab:'products'}),
    exportCsv:()=>exportCSV(orders),
    aOrders:s.adminTab==='orders', aProducts:s.adminTab==='products', aStats:s.adminTab==='stats',
    aCredit:s.adminTab==='credit', aStories:s.adminTab==='stories', aSettings:s.adminTab==='settings',
    kpis:[
      {label:'BUGUNGI SAVDO',value:s.kpiData?revText:'—',delta:s.kpiData?((kd.todayOrders||0)+' ta buyurtma'):'Yuklanmoqda…',dFg:A},
      {label:'OCHIQ BUYURTMALAR',value:s.kpiData?String(kd.openOrders||0):'—',delta:s.kpiData?(kd.newCallbacks?kd.newCallbacks+' ta yangi ariza':'Javob kutmoqda'):'Yuklanmoqda…',dFg:AMB},
      {label:"O'RNATISH REJASI",value:s.kpiData?String(kd.installing||0):'—',delta:s.kpiData?'Jarayondagi montaj':'Yuklanmoqda…',dFg:'var(--dim3)'},
      {label:'KAM QOLGAN TOVAR',value:s.kpiData?String(kd.lowStock||0):'—',delta:s.kpiData?lowStockNames:'Yuklanmoqda…',dFg:RED}
    ],
    orders, stock, formFields,
    videoOn:s.video, videoMeta:'1:24 · 46 MB · asosiy video',
    addVideo:()=>set({video:true}), delVideo:()=>set({video:false}),
    saveProduct:()=>flash('Mahsulot kartochkasi saqlandi va nashr qilindi'),

    provRows:ALLPROV.map(p=>{const on=s.provOn[p.name]; return {name:p.name,note:p.note,
      state:on?'ULANGAN':"O'CHIRILGAN", fg:on?A:'var(--dim2)', chipBg:on?'rgba(47,224,182,.12)':'var(--fill)',
      border:on?'rgba(47,224,182,.3)':'var(--line)', trackBg:on?A:'var(--line4)',
      knob:on?'flex-end':'flex-start', knobBg:on?'#06231d':'var(--dim)',
      toggle:()=>set(pr=>({provOn:{...pr.provOn,[p.name]:!pr.provOn[p.name]}}))};}),
    services:[
      {name:"Muddatli to'lov servisi",note:'Mijoz ilovasida muddatli to’lov kartasi va foizlar',on:s.creditService,toggle:()=>set({creditService:!s.creditService})},
      {name:'Mutaxassis yordami',note:'Bepul hisoblash · bosh sahifa banneri va navigatsiya tugmasi',on:s.expertService,toggle:()=>set({expertService:!s.expertService})}
    ].map(sv=>({...sv, state:sv.on?'YONIQ':"O'CHIRILGAN", fg:sv.on?A:'var(--dim2)',
      chipBg:sv.on?'rgba(47,224,182,.12)':'var(--fill)', border:sv.on?'rgba(47,224,182,.3)':'var(--line)',
      bg:sv.on?'rgba(47,224,182,.05)':'var(--card)', trackBg:sv.on?A:'var(--line4)',
      knob:sv.on?'flex-end':'flex-start', knobBg:sv.on?'#06231d':'var(--dim)'})),
    rateRows, rateOpacity:s.creditService?'1':'.4',
    rateFootnote:s.creditService?"Foizni o'zgartirsangiz mijoz ilovasidagi hisob-kitob darhol yangilanadi":"Servis o'chirilgan — muddatli to'lov mijozga ko'rinmaydi",
    creditSettings:[{label:'Servis komissiyasi',note:'Har bir shartnomadan',value:'2.5 %'},{label:'Minimal summa',note:'Muddatli to’lov ochiladi',value:fmt(1000000)},{label:'Kechiktirish jarimasi',note:'Kunlik',value:'0.2 %'},{label:'Hujjatlar',note:'Ariza uchun majburiy',value:'Pasport + ish joyi'}],

            set(p=>({mod:{...p.mod,[k]:!on}}));

    storyLiveLabel:s.storyList.filter(x=>x.live!==false).length+' ta nashrda · '+s.storyList.length+' ta jami',
    storyRows:s.storyList.map((st,i)=>({title:st.title,meta:st.meta,dur:st.dur,label:st.label,views:st.views,
      live:st.live===false?'QORALAMA':'NASHRDA', fg:st.live===false?'var(--dim2)':A,
      bg:st.live===false?'var(--fill)':'rgba(47,224,182,.12)',
      ring:st.live===false?'var(--line4)':'linear-gradient(140deg,#2fe0b6,#ffb020)',
      playFg:st.live===false?'var(--dim4)':'var(--fg)', labelFg:st.live===false?'var(--dim2)':'var(--fg2)',
      toggle:async ()=>{
        const nextLive = st.live === false;

          await api('/api/admin/stories/'+st.id, {method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({live:nextLive?1:0})});

      edit:()=>set({cId:st.id,cTitle:st.title,cCams:String(parseInt(st.meta)||''),cDate:(st.meta.split('· ')[1]||''),cText:st.text,cTags:st.tags,cLive:st.live!==false,cFile:st.file})})),
    composerTitle:s.cId?'Story tahrirlash':'Yangi story',
    composerFile:s.cFile||'video tanlanmagan',

    cTitle:s.cTitle, cCams:s.cCams, cDate:s.cDate, cText:s.cText,
    setCTitle:e=>{S.cTitle=e.target.value;}, setCCams:e=>{S.cCams=String(e.target.value).replace(/[^0-9]/g,'');},
    setCDate:e=>{S.cDate=e.target.value;}, setCText:e=>{S.cText=e.target.value;},
    cTagOpts:['4MP kamera','PTZ','NVR 2TB','NVR 4TB','Domofon','PoE','IP67','Bulut arxiv','Ovozli'].map(n=>{const on=s.cTags.includes(n);

    cLiveTrack:s.cLive?A:'var(--line4)', cLiveKnob:s.cLive?'flex-end':'flex-start', cLiveKnobBg:s.cLive?'#06231d':'var(--dim)',

    saveStory:async ()=>{
      if(!S.cTitle.trim()){flash('Obyekt nomini kiriting'); return;}
      if(!S.cFile){flash('Avval video tanlang'); return;}
      const meta=(S.cCams||'—')+' kamera · '+(S.cDate||'bugun');
      const label=S.cTitle.replace(/["'·]/g,'').split(' ').slice(0,2).join(' ').trim();
      if(S.cId){
        try {
          const updated = await api('/api/admin/stories/'+S.cId,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:S.cTitle,meta,label,text:S.cText,tags:S.cTags,live:S.cLive?1:0,file:S.cFile})});
          set(p=>({storyList:p.storyList.map(x=>x.id===S.cId?updated:x), cId:null, cTitle:'', cCams:'', cDate:'', cText:'', cTags:[], cLive:true, cFile:''}));
          flash('Story yangilandi');
        } catch(err){ flash(err.message); }
        return;
      }
      const st={id:'s'+Date.now(),label,title:S.cTitle,meta,dur:'0:'+(28+Math.floor(Math.random()*30)),views:0,live:S.cLive?1:0,file:S.cFile,tags:S.cTags,text:S.cText};
      try {
        const created = await api('/api/admin/stories',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(st)});
        set(p=>({storyList:[created,...p.storyList], cId:null, cTitle:'', cCams:'', cDate:'', cText:'', cTags:[], cLive:true, cFile:''}));
        flash(st.live?'Story nashr qilindi — mijoz ilovasida ko’rinadi':'Story qoralama sifatida saqlandi');
      } catch(err){ flash(err.message); }
    },

    bars,
    topList:[{name:'IPC-2410 Bullet',qty:'128 dona',w:'92%'},{name:'Komplekt "Uy 4"',qty:'41 dona',w:'64%'},{name:'NVR-8CH 4K',qty:'37 dona',w:'55%'},{name:'WiFi Mini 3MP',qty:'29 dona',w:'43%'}],

    noteOn:!!s.noteDraft,
    noteHead:s.noteDraft?s.noteDraft.id+' · status "'+s.noteDraft.status+'" ga o’tdi':'',
    noteStatus:s.noteDraft?s.noteDraft.status:'', noteStFg:s.noteDraft?(ST[s.noteDraft.status]||{}).fg:A,
    noteStBg:s.noteDraft?(ST[s.noteDraft.status]||{}).bg:'var(--fill)',
    noteClient:s.noteDraft?s.noteDraft.client+' · '+s.noteDraft.phone:'',

      .map(t=>({name:t.length>28?t.slice(0,28)+'…':t, go:()=>set({noteText:t})})),
    noteSkip:()=>set({noteDraft:null,noteText:''}),
    noteSend:async ()=>{const d=S.noteDraft; if(!d) return;
      if(!S.noteText.trim()){flash('Xabar matnini kiriting'); return;}
      try {
        await api('/api/admin/orders/'+d.id.replace('#',''),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({note:S.noteText.trim()})});
        S.notes={...S.notes,[d.id]:{text:S.noteText.trim(),time:'Bugun · '+d.status}}; S.noteDraft=null; S.noteText='';
        flash(d.client+' ga xabar yuborildi');
      } catch(err) { flash(err.message); }
    },
    toastOn:!!s.toast, toast:s.toast,
    isLoggedIn: !!s.token,
    adminName: (s.adminUser && s.adminUser.name) ? (s.adminUser.name + ' · ' + (s.adminUser.role || 'menejer')) : 'Dilshod · menejer',
    logout: () => logout(),
    loginUser: s.loginUser,
    loginPass: s.loginPass,
    loginErr: s.loginErr,
    loginLoading: s.loginLoading,
    setLoginUser: e => { S.loginUser = e.target.value; },
    setLoginPass: e => { S.loginPass = e.target.value; },
    submitLogin: e => { if (e && e.preventDefault) e.preventDefault(); doLogin(); }
  };
}

    <div style="font:600 13px 'Space Grotesk',sans-serif">Oylik savdo · mln so'm</div>
    <div style="display:flex;align-items:flex-end;gap:14px;height:210px;margin-top:20px">
      ${v.bars.map(b=>`
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;justify-content:flex-end;height:100%">
          <div style="font:600 10px 'IBM Plex Mono',monospace;color:var(--dim3)">${b.value}</div>
          <div style="width:100%;border-radius:6px 6px 0 0;background:${b.fill};height:${b.h}"></div>
          <div style="font:500 10px 'IBM Plex Mono',monospace;color:var(--dim2)">${b.label}</div>
        </div>`).join('')}
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:12px">
    ${v.topList.map(t=>`
      <div style="border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:var(--card)">
        <div style="display:flex;justify-content:space-between;font:600 12px 'Space Grotesk',sans-serif">
          <span>${t.name}</span><span style="font-family:'IBM Plex Mono',monospace">${t.qty}</span>
        </div>
        <div style="height:5px;border-radius:3px;background:var(--line);margin-top:9px;overflow:hidden"><div style="height:100%;background:var(--acc);width:${t.w}"></div></div>
      </div>`).join('')}
  </div>
</div>`;}

function mNote(v){return `
<div style="position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:24px">
  <div style="width:100%;max-width:460px;background:var(--bar);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 24px 60px rgba(0,0,0,.5)">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
      <div>
        <div style="font:600 15px 'Space Grotesk',sans-serif">Mijozga xabar</div>
        <div style="font:400 10.5px 'IBM Plex Mono',monospace;color:var(--dim2);margin-top:4px">${v.noteHead}</div>
      </div>
      <div onclick="${h(v.noteSkip)}" style="flex:none;width:30px;height:30px;border-radius:9px;border:1px solid var(--line3);display:flex;align-items:center;justify-content:center;font:600 12px 'IBM Plex Mono',monospace;color:var(--dim);cursor:pointer">✕</div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:14px">
      ${v.noteTemplates.map(nt=>`<div onclick="${h(nt.go)}" style="font:500 10.5px 'IBM Plex Mono',monospace;color:var(--fg2);background:var(--fill);border:1px solid var(--line);padding:7px 9px;border-radius:7px;cursor:pointer">${nt.name}</div>`).join('')}
    </div>
    <div style="margin-top:11px;border:1px solid var(--line3);border-radius:11px;padding:12px;background:var(--tile)">
      <textarea data-k="noteText" oninput="${h(v.setNoteText)}" placeholder="Masalan: Usta ertaga 10:00 da yetib boradi" style="width:100%;min-height:76px;resize:none;border:none;outline:none;background:transparent;color:var(--fg);font:400 12.5px/1.5 'Space Grotesk',sans-serif">${esc(v.noteText)}</textarea>
    </div>
    <div style="display:flex;align-items:center;gap:11px;margin-top:12px;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--card)">
      <div style="flex:none;font:600 10px 'IBM Plex Mono',monospace;color:${v.noteStFg};background:${v.noteStBg};padding:5px 8px;border-radius:5px">${v.noteStatus}</div>
      <div style="flex:1;min-width:0;font:400 10.5px 'IBM Plex Mono',monospace;color:var(--dim2)">${v.noteClient}</div>
    </div>
    <div style="display:flex;gap:9px;margin-top:14px">
      <div onclick="${h(v.noteSkip)}" style="flex:none;padding:13px 15px;border-radius:11px;border:1px solid var(--line3);color:var(--fg2);font:600 12px 'Space Grotesk',sans-serif;cursor:pointer">Xabarsiz saqlash</div>
      <div onclick="${h(v.noteSend)}" style="flex:1;text-align:center;padding:13px;border-radius:11px;background:var(--acc);color:#06231d;font:600 12.5px 'Space Grotesk',sans-serif;cursor:pointer">Yuborish</div>
    </div>
  </div>
</div>`;}

/* ═══ RENDER ═══ */
const ROOT=document.getElementById('root');
let _scroll=0;
function render(){
  const act=document.activeElement, fk=act&&act.dataset?act.dataset.k:null;
  const fs=fk?act.selectionStart:null, fe=fk?act.selectionEnd:null;
  H=[];
  const v=vals();
  if(!v.isLoggedIn){
    ROOT.innerHTML = mLogin(v) + (v.toastOn?`<div style="position:fixed;right:24px;bottom:24px;z-index:50;background:var(--fg);color:var(--bg);border-radius:12px;padding:13px 16px;font:600 12.5px 'Space Grotesk',sans-serif;box-shadow:0 12px 30px rgba(0,0,0,.5)">${v.toast}</div>`:'');
    if(fk){ const el=ROOT.querySelector('[data-k="'+fk+'"]'); if(el){ el.focus(); try{el.setSelectionRange(fs,fe);}catch(e){} } }
    return;
  }
  ROOT.innerHTML=`
<div style="height:100%;position:relative;display:flex;background:var(--bg);color:var(--fg);font-family:'Space Grotesk',sans-serif">
  ${mSide(v)}
  <div style="flex:1;min-width:0;display:flex;flex-direction:column">
    <div style="flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 24px;border-bottom:1px solid var(--line)">
      <div>
        <div style="font:600 18px 'Space Grotesk',sans-serif">${v.adminTitle}</div>
        <div style="font:400 11.5px 'IBM Plex Mono',monospace;color:var(--dim2);margin-top:4px">${v.adminSub}</div>
      </div>
      <div style="display:flex;gap:9px">
        <div onclick="${h(v.exportCsv)}" style="font:500 11.5px 'IBM Plex Mono',monospace;color:var(--dim);border:1px solid var(--line3);padding:9px 12px;border-radius:9px;cursor:pointer">Eksport CSV</div>
        <div onclick="${h(v.goProducts)}" style="font:600 11.5px 'IBM Plex Mono',monospace;color:#06231d;background:var(--acc);padding:9px 13px;border-radius:9px;cursor:pointer">+ Mahsulot</div>
      </div>
    </div>
    <div style="flex:1;overflow:auto;padding:20px 24px 26px" id="scroller">
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
        ${v.kpis.map(k=>`
          <div style="background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px">
            <div style="font:600 10px 'IBM Plex Mono',monospace;color:var(--dim2);letter-spacing:.05em">${k.label}</div>
            <div style="font:700 22px 'IBM Plex Mono',monospace;margin-top:9px">${k.value}</div>
            <div style="font:500 10.5px 'IBM Plex Mono',monospace;color:${k.dFg};margin-top:5px">${k.delta}</div>
          </div>`).join('')}
      </div>
      ${v.aOrders?mOrders(v):''}
      ${v.aProducts?mProducts(v):''}
      ${v.aCredit?mCredit(v):''}
      ${v.aSettings?mSettings(v):''}
      ${v.aStories?mStories(v):''}
      ${v.aStats?mStats(v):''}
    </div>
  </div>
  ${v.noteOn?mNote(v):''}
  ${v.toastOn?`<div style="position:fixed;right:24px;bottom:24px;z-index:50;background:var(--fg);color:var(--bg);border-radius:12px;padding:13px 16px;font:600 12.5px 'Space Grotesk',sans-serif;box-shadow:0 12px 30px rgba(0,0,0,.5)">${v.toast}</div>`:''}
</div>`;
  const sc=document.getElementById('scroller'); if(sc) sc.scrollTop=_scroll;
  if(fk){ const el=ROOT.querySelector('[data-k="'+fk+'"]'); if(el){ el.focus(); try{el.setSelectionRange(fs,fe);}catch(e){} } }
}
ROOT.addEventListener('scroll',e=>{ if(e.target.id==='scroller') _scroll=e.target.scrollTop; },true);
const _origSet=set;
window.set=function(o){ const t=S.adminTab; _origSet(o); if(S.adminTab!==t){ _scroll=0; const sc=document.getElementById('scroller'); if(sc) sc.scrollTop=0; } };

async function initAdmin(){
  if (S.token) {
    try {
      await bootstrap();
    } catch(e) {
      logout();
      return;
    }
  }
  render();
}
initAdmin();
</script>
</body>
</html>
