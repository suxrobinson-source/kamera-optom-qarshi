<!DOCTYPE html>
<html lang="uz" data-theme="day">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KAMERA OPTOM — Admin 2.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* KAMERA OPTOM · Admin 2.0 "Signal" — mijoz ilovasi v2 bilan bir dizayn tizimi */
    :root {
      --fd: 'Unbounded', 'Onest', system-ui, sans-serif;
      --fb: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --fm: 'Onest', system-ui, sans-serif;
      --acc: #ff4f12; --acc-soft: rgba(255, 79, 18, .1); --acc-line: rgba(255, 79, 18, .35);
      --ok: #12a150; --warn: #c77c00; --red: #e5372a;
      --bg: #f3f1ed; --card: #ffffff; --bar: #ffffff; --tile: #f6f4f0; --panel2: #fbfaf8; --thead: #f6f4f0;
      --fg: #141311; --fg2: #46423c; --dim: #7d786f; --dim2: #857f76; --dim3: #5b574f; --dim4: #aca69c; --dim5: #b5afa5;
      --hatchA: #efece6; --hatchB: #e9e6e0; --hatchC: #ece8e1;
      --line: rgba(20, 19, 17, .08); --line2: rgba(20, 19, 17, .06); --line3: rgba(20, 19, 17, .13); --line4: rgba(20, 19, 17, .18);
      --fill: rgba(20, 19, 17, .045);
      --btn: #141311; --btn-ink: #ffffff; --surface2: #ebe8e2;
      --shadow: 0 1px 2px rgba(20, 19, 17, .04), 0 10px 28px rgba(20, 19, 17, .06);
      --shadow-lg: 0 24px 60px rgba(20, 19, 17, .2);
    }

    [data-theme="night"] {
      --acc: #ff6a33; --acc-soft: rgba(255, 106, 51, .14); --acc-line: rgba(255, 106, 51, .4);
      --ok: #3ccf7e; --warn: #f0b43c; --red: #ff5a4d;
      --bg: #0f0f0e; --card: #1a1918; --bar: #151413; --tile: #211f1d; --panel2: #1d1c1a; --thead: #1f1d1b;
      --fg: #f4f2ee; --fg2: #cbc6bd; --dim: #8f8a81; --dim2: #8a857c; --dim3: #b2ada4; --dim4: #6b665f; --dim5: #5f5b55;
      --hatchA: #221f1d; --hatchB: #1d1b19; --hatchC: #262320;
      --line: rgba(255, 255, 255, .08); --line2: rgba(255, 255, 255, .06); --line3: rgba(255, 255, 255, .13); --line4: rgba(255, 255, 255, .18);
      --fill: rgba(255, 255, 255, .05);
      --btn: #f4f2ee; --btn-ink: #141311; --surface2: #242321;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .35);
      --shadow-lg: 0 24px 60px rgba(0, 0, 0, .6);
    }

    * { box-sizing: border-box }
    button { background: none; border: 0; font: inherit; color: inherit; padding: 0; margin: 0; text-align: inherit; cursor: pointer; -webkit-appearance: none }
    :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px }
    html, body { height: 100% }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--fb); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased }
    ::-webkit-scrollbar { width: 8px; height: 8px }
    ::-webkit-scrollbar-thumb { background: var(--line4); border-radius: 4px }
    #root { height: 100% }
    input, textarea, select { font-family: inherit }
    svg { flex: none; display: block }
    .burger-btn { display: none }
    #side-backdrop { display: none }

    /* qobiq */
    .ad-side { width: 248px; flex: none; display: flex; flex-direction: column; gap: 18px; padding: 20px 14px; background: var(--bar); border-right: 1px solid var(--line) }
    .ad-brand { display: flex; align-items: center; gap: 11px; text-decoration: none; color: inherit; padding: 2px 6px }
    .ad-brand b { display: block; font: 600 14px/1 var(--fd); letter-spacing: -.02em }
    .ad-brand small { display: block; margin-top: 5px; font: 600 10.5px/1 var(--fb); color: var(--acc); letter-spacing: .08em }
    .ad-nav { display: flex; flex-direction: column; gap: 2px }
    .ad-nav button { display: flex; align-items: center; gap: 11px; width: 100%; height: 44px; padding: 0 12px; border-radius: 14px; color: var(--dim3); font: 500 14px var(--fb); transition: background .15s ease, color .15s ease }
    .ad-nav button:hover { background: var(--fill); color: var(--fg) }
    .ad-nav button.on { background: var(--btn); color: var(--btn-ink) }
    .ad-nav button span { flex: 1; text-align: left }
    .ad-nav i { font: 700 11px var(--fb); font-style: normal; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 99px; display: inline-flex; align-items: center; justify-content: center; background: var(--acc-soft); color: var(--acc) }
    .ad-nav button.on i { background: var(--acc); color: #fff }
    .ad-user { margin-top: auto; display: flex; align-items: center; gap: 11px; padding: 12px; border-radius: 18px; background: var(--tile) }
    .ad-ava { flex: none; width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(145deg, #ff7a3d, #ff4f12); color: #fff; display: flex; align-items: center; justify-content: center; font: 600 13px var(--fd) }
    .ad-top { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 28px; border-bottom: 1px solid var(--line); background: var(--bg) }
    .ad-title { margin: 0; font: 600 22px/1.15 var(--fd); letter-spacing: -.03em }
    .ad-sub { margin-top: 5px; font: 400 13px var(--fb); color: var(--dim) }
    .ad-actions { display: flex; align-items: center; gap: 8px }
    .ad-btn { display: inline-flex; align-items: center; gap: 7px; height: 42px; padding: 0 16px; border-radius: 99px; font: 600 13px var(--fb); white-space: nowrap; transition: transform .15s ease }
    .ad-btn:active { transform: scale(.97) }
    .ad-btn.p { background: var(--btn); color: var(--btn-ink) }
    .ad-btn.g { border: 1px solid var(--line3); color: var(--fg2) }
    .ad-icon { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line3); display: flex; align-items: center; justify-content: center; color: var(--fg2) }
    .ad-icon.burger-btn { display: none }
    .ad-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px }
    .ad-kpi { position: relative; padding: 18px; border-radius: 24px; background: var(--card); box-shadow: var(--shadow); overflow: hidden }
    .ad-kpi .ico { width: 40px; height: 40px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: var(--tile); color: var(--fg) }
    .ad-kpi:first-child { background: var(--btn); color: var(--btn-ink) }
    .ad-kpi:first-child .ico { background: var(--acc); color: #fff }
    .ad-kpi:first-child .kl, .ad-kpi:first-child .kd { color: inherit !important; opacity: .65 }
    .ad-kpi .kl { margin-top: 16px; font: 600 11.5px var(--fb); letter-spacing: .06em; color: var(--dim) }
    .ad-kpi .kv { margin-top: 6px; font: 600 28px/1.05 var(--fd); letter-spacing: -.04em }
    .ad-kpi .kd { margin-top: 6px; font: 500 12.5px var(--fb) }
    .ad-toast { position: fixed; right: 24px; bottom: 24px; z-index: 80; display: flex; align-items: center; gap: 11px; padding: 13px 18px 13px 13px; border-radius: 20px; background: var(--btn); color: var(--btn-ink); font: 600 13.5px var(--fb); box-shadow: var(--shadow-lg); animation: adIn .3s cubic-bezier(.2, 1.2, .4, 1) both }
    .ad-toast .dot { width: 26px; height: 26px; border-radius: 50%; background: var(--acc); color: #fff; display: flex; align-items: center; justify-content: center }
    @keyframes adIn { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }

    /* kirish */
    .lg { min-height: 100vh; display: grid; grid-template-columns: 1.05fr 1fr; background: var(--bg) }
    .lg-art { position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 44px; background: #141311; color: #f4f2ee }
    .lg-art::before { content: ""; position: absolute; right: -120px; top: -120px; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 79, 18, .55), transparent 65%) }
    .lg-art h1 { position: relative; margin: 0; font: 600 44px/1.05 var(--fd); letter-spacing: -.04em; max-width: 460px }
    .lg-art h1 em { font-style: normal; color: #ff6a33 }
    .lg-art p { position: relative; margin: 16px 0 0; font: 400 15px/1.6 var(--fb); color: rgba(244, 242, 238, .7); max-width: 420px }
    .lg-lens { position: absolute; right: 60px; bottom: 90px; width: 190px; height: 190px }
    .lg-lens i { position: absolute; border-radius: 50% }
    .lg-lens .r1 { inset: 0; border: 1.5px dashed rgba(255, 255, 255, .25); animation: lgSpin 40s linear infinite }
    .lg-lens .r2 { inset: 16px; background: repeating-conic-gradient(#ff6a33 0 1.4deg, transparent 1.4deg 7deg); -webkit-mask: radial-gradient(closest-side, transparent 84%, #000 85% 98%, transparent 100%); mask: radial-gradient(closest-side, transparent 84%, #000 85% 98%, transparent 100%); animation: lgSpin 18s linear infinite reverse }
    .lg-lens .r3 { inset: 46px; background: radial-gradient(circle at 35% 30%, #46413c, #0d0c0b 72%); box-shadow: inset 0 0 0 4px #26231f }
    .lg-lens .r4 { inset: 78px; background: radial-gradient(circle, #ffb07a 0, #ff5a1f 34%, #8a2200 70%, #1a0904 100%); box-shadow: 0 0 30px 6px rgba(255, 90, 31, .55) }
    @keyframes lgSpin { to { transform: rotate(360deg) } }
    .lg-form { display: flex; align-items: center; justify-content: center; padding: 32px }
    .lg-card { width: 100%; max-width: 380px }
    .lg-card h2 { margin: 0; font: 600 26px var(--fd); letter-spacing: -.03em }
    .lg-field { display: block; margin-top: 16px }
    .lg-field span { display: block; margin-bottom: 7px; font: 600 12px var(--fb); color: var(--dim); letter-spacing: .04em }
    .lg-field input { width: 100%; height: 54px; padding: 0 18px; border-radius: 16px; border: 1.5px solid var(--line3); background: var(--card); color: var(--fg); font: 500 15px var(--fb); outline: none; transition: border-color .15s ease }
    .lg-field input:focus { border-color: var(--fg) }
    .lg-submit { margin-top: 22px; width: 100%; height: 54px; border-radius: 99px; text-align: center; background: var(--btn); color: var(--btn-ink); font: 600 15px var(--fb) }

    @media (max-width: 1100px) { .ad-kpis { grid-template-columns: repeat(2, 1fr) } }
    @media (max-width: 900px) {
      #side { position: fixed; top: 0; bottom: 0; left: 0; z-index: 60; transform: translateX(-100%); transition: transform .24s ease; box-shadow: var(--shadow-lg) }
      #side.open { transform: translateX(0) }
      .burger-btn { display: flex !important }
      #side-backdrop.open { display: block !important }
      .ad-top { padding: 14px 16px }
      #scroller { padding: 16px !important }
      .ad-actions .ad-btn.g { display: none }
      .lg { grid-template-columns: 1fr }
      .lg-art { display: none }
    }

    /* ── Telefon: jadvallar kartochkaga, ikki ustun bittaga, KPI ixcham ── */
    @media (max-width: 640px) {
      .ad-top { gap: 10px; padding: 12px 14px }
      .ad-title { font-size: 18px }
      .ad-sub { font-size: 11.5px; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
      .ad-actions { gap: 6px }
      .ad-actions .ad-btn.p { width: 42px; padding: 0; justify-content: center; font-size: 0 }
      #scroller { padding: 12px 12px 28px !important }
      .ad-kpis { gap: 8px }
      .ad-kpi { padding: 12px 13px; border-radius: 18px }
      .ad-kpi .ico { display: none }
      .ad-kpi .kl { margin-top: 0; font-size: 10px }
      .ad-kpi .kv { font-size: 21px; margin-top: 4px }
      .ad-kpi .kd { font-size: 11px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
      .mg { grid-template-columns: 1fr !important }
      .mt { min-width: 0 !important }
      .mt-h { display: none !important }
      .mt-r { grid-template-columns: 1fr 1fr !important; gap: 6px 12px !important; padding: 12px 14px !important }
      .mt-r > .mt-w { grid-column: 1 / -1 }
      .mt-r > * { min-width: 0; overflow-wrap: anywhere }
      .ad-toast { left: 12px; right: 12px; bottom: 12px }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script src="config.js"></script>
  <script src="kits.js"></script>
  <script>
    /* ═══ KAMERA OPTOM QARSHI — admin panel (Claude Design "1b" prototipi) ═══ */
    const A = 'var(--acc)', RED = 'var(--red)', AMB = 'var(--warn)';
    const M = n => n.toLocaleString('ru-RU').replace(/,/g, ' ');
    const fmt = n => M(n) + " so'm";
    const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    let _token = '';
    let _tab = 'orders';
    try {
      _token = localStorage.getItem('ko_admin_token') || '';
      _tab = localStorage.getItem('ko_admin_tab') || 'orders';
    } catch (e) { }

    async function api(url, opt = {}) {
      const headers = { ...(opt.headers || {}) };
      if (S.token) headers['Authorization'] = 'Bearer ' + S.token;
      let r;
      try {
        r = await fetch(url, { ...opt, headers });
      } catch (err) {
        throw new Error('Server bilan aloqa yo\'q');
      }
      if (r.status === 401) {
        logout();
        throw new Error('Sessiya tugadi — qayta kiring');
      }
      if (!r.ok) {
        const errData = await r.json().catch(() => ({}));
        throw new Error(errData.error || ('Server xatosi: HTTP ' + r.status));
      }
      return r.status === 204 ? null : r.json();
    }

    async function doLogin() {
      if (!S.loginUser.trim() || !S.loginPass) {
        set({ loginErr: 'Login va parolni kiriting' });
        return;
      }
      set({ loginLoading: true, loginErr: '' });
      try {
        const r = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: S.loginUser.trim(), password: S.loginPass })
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) {
          throw new Error(data.error || "Login yoki parol noto'g'ri");
        }
        try { localStorage.setItem('ko_admin_token', data.token); } catch (e) { }
        set({ token: data.token, adminUser: data.admin, loginPass: '', loginLoading: false, loginErr: '' });
        flash('Xush kelibsiz, ' + (data.admin.name || data.admin.username));
      } catch (err) {
        set({ loginLoading: false, loginErr: err.message });
      }
    }

    function logout() {
      try { localStorage.removeItem('ko_admin_token'); } catch (e) { }
      set({ token: '', adminUser: null, loginPass: '', loginErr: '' });
    }

    const S = {
      token: _token, adminUser: null, loginUser: 'admin', loginPass: '', loginErr: '', loginLoading: false,
      isOffline: typeof navigator !== 'undefined' ? !navigator.onLine : false,
      adminTab: _tab, toast: null, sideOpen: false, confirmModal: null,
      orders: [], kpiData: null, stockProducts: [],
      prodForm: {
        isNew: true,
        sku: '',
        name: '',
        cat: 'Tashqi',
        price: '',
        spec: '',
        badge: '',
        qty: 0,
        promo: '',
        images: []
      },
      bannersList: [],
      bannerModal: null, up: null,
      cBlob: null, cPreview: '', cDur: '', cPosterData: '', cPoster: '', cFileName: '',
      creditTerms: { commission: 2.5, minSum: 1000000, penalty: 0.2, docs: 'Pasport + ish joyi ma’lumoti' }, termsDraft: null,
      schedule: [],
      promo: {},
      labelOn: { HIT: true, CHEGIRMA: true, YANGI: true },
      mod: { banners: true, stories: true, gps: true, memory: true, cable: true, install: true, cloud: true },
      rates: { 3: 0, 6: 8, 12: 14, 24: 26 }, rateOn: { 3: true, 6: true, 12: true, 24: true }, down: { 3: 0, 6: 10, 12: 20, 24: 30 },
      creditService: true, expertService: true,
      provOn: { 'Uzum Nasiya': true, 'Alif Nasiya': true, 'Hamkor Nasiya': true },
      qty: {},
      orderStatus: {}, notes: {}, noteDraft: null, noteText: '',
      video: true,
      cId: null, cTitle: '', cCams: '', cDate: '', cText: '', cTags: [], cLive: true, cFile: '',
      storyList: [],
      callbacks: [],
      currency: null, fx: null, ustas: [], storyCmts: [], cmtFilter: 'all',
      cc: { code: '', dev: null, err: '', busy: false, q: '', items: {}, title: '', note: '' }, ccPushes: [],
      sd: { st: null, list: [], cur: null, topic: '', brief: '', secs: '30', elKey: '', voiceName: 'Kamera Optom — egasi', testText: 'Assalomu alaykum! Kamera Optom Qarshi — xavfsizligingiz bizning g‘amxo‘rligimiz.', testAudio: '', voices: null, busy: '', drafts: {}, newText: '', newKind: 'avatar' },
      ai: { st: null, list: [], q: '', sku: '', img: '', title: '', price: '', spec: '', line: '+998 78 120 00 20 · Qarshi', bg: 'light', ovOn: true, prompt: '', dur: '5', frame: '', ov: '', busy: false, falKey: '', igToken: '', caps: {}, err: '' },
      loading: false, loaded: false
    };

    let H = [];
    const h = fn => `_h(${H.push(fn) - 1},event)`;
    window._h = (i, e) => { const f = H[i]; if (f) f(e); };
    let _t = null;
    function set(o) {
      Object.assign(S, typeof o === 'function' ? o(S) : o);
      try {
        if (S.token) localStorage.setItem('ko_admin_token', S.token);
        if (S.adminTab) localStorage.setItem('ko_admin_tab', S.adminTab);
      } catch (e) { }
      render();
    }
    function flash(t) { S.toast = t; clearTimeout(_t); _t = setTimeout(() => { S.toast = null; render(); }, 2200); render(); }
    function promoStyle(k) { return ({ HIT: { fg: '#2a1a00', bg: '#ffb020', border: '#ffb020' }, CHEGIRMA: { fg: '#ffffff', bg: '#ff4d3d', border: '#ff4d3d' }, YANGI: { fg: '#ffffff', bg: '#ff4f12', border: '#ff4f12' } })[k] || { fg: 'var(--dim2)', bg: 'var(--fill)', border: 'var(--line3)' }; }
    /* Video bo'laklab yuklanadi (1 MB), har bo'lak 3 marta qayta urinadi; progress pastki chiziqda ko'rinadi */
    const VIDEO_MAX = 60 * 1024 * 1024;
    async function uploadVideo(folder, file, label) {
      if (!file) throw new Error('Video tanlanmagan');
      if (file.size > VIDEO_MAX) throw new Error('Video 60 MB dan oshmasligi kerak — qisqaroq yoki siqilgan video tanlang');
      const init = await api('/api/admin/media', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ folder, name: file.name, mime: file.type, size: file.size }) });
      try {
        for (let i = 0; i < init.chunks; i++) {
          const part = await file.slice(i * init.chunk, Math.min(file.size, (i + 1) * init.chunk)).arrayBuffer();
          for (let t = 1; ; t++) {
            try { await api('/api/admin/media/chunk?path=' + encodeURIComponent(init.path) + '&idx=' + i, { method: 'PUT', headers: { 'Content-Type': 'application/octet-stream' }, body: part }); break; }
            catch (err) { if (t >= 3) throw err; await new Promise(r => setTimeout(r, 900 * t)); }
          }
          set({ up: { label, pct: Math.round((i + 1) / init.chunks * 100) } });
        }
        await api('/api/admin/media/done', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: init.path }) });
        return init.path;
      } catch (err) {
        api('/api/admin/media?path=' + encodeURIComponent(init.path), { method: 'DELETE' }).catch(() => { });
        throw err;
      } finally { set({ up: null }); }
    }
    const fmtDur = sec => { sec = Math.max(1, Math.round(+sec || 0)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); };
    /* video davomiyligi va muqova kadri (1-soniya yoki uchdan biri) — brauzerning o'zida */
    function probeVideo(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file), vd = document.createElement('video');
        let done = false;
        const fin = (ok, val) => { if (done) return; done = true; vd.removeAttribute('src'); vd.load(); URL.revokeObjectURL(url); ok ? resolve(val) : reject(val); };
        vd.muted = true; vd.playsInline = true; vd.preload = 'auto';
        vd.onerror = () => fin(false, new Error('Bu videoni brauzer ocha olmadi — MP4 (H.264) formatida yuklang'));
        /* ba'zi WebM fayllarda davomiylik "Infinity" — oxiriga sakrab haqiqiy davomiylik olinadi */
        let dur = 0, phase = 'meta';
        const toPoster = () => { phase = 'poster'; vd.currentTime = Math.min(1, (dur || 2) / 3); };
        vd.onloadedmetadata = () => { if (isFinite(vd.duration) && vd.duration > 0) { dur = vd.duration; toPoster(); } else { phase = 'probe'; vd.currentTime = 1e7; } };
        vd.ondurationchange = () => { if (phase === 'probe' && isFinite(vd.duration) && vd.duration > 0) { dur = vd.duration; toPoster(); } };
        vd.onseeked = () => {
          if (phase === 'probe') { if (isFinite(vd.duration) && vd.duration > 0) { dur = vd.duration; toPoster(); } return; }
          let poster = '';
          try {
            const k = Math.min(1, 720 / Math.max(vd.videoWidth, vd.videoHeight, 1));
            const c = document.createElement('canvas'); c.width = Math.round(vd.videoWidth * k); c.height = Math.round(vd.videoHeight * k);
            c.getContext('2d').drawImage(vd, 0, 0, c.width, c.height);
            poster = c.toDataURL('image/jpeg', 0.82);
          } catch (e) { }
          fin(true, { duration: dur || (isFinite(vd.duration) ? vd.duration : 0), poster, w: vd.videoWidth, h: vd.videoHeight });
        };
        setTimeout(() => fin(false, new Error('Video ochilmadi — boshqa fayl tanlang')), 20000);
        vd.src = url;
      });
    }
    /* rasm → kichraytirilgan JPEG dataURL (banner uchun 1600px gacha) */
    function imageData(file, max = 1600) {
      return new Promise((resolve, reject) => {
        if (!file || !/^image\//.test(file.type)) { reject(new Error('Rasm faylini tanlang')); return; }
        const url = URL.createObjectURL(file), img = new Image();
        img.onload = () => {
          const k = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.86));
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Rasm ochilmadi')); };
        img.src = url;
      });
    }

      const m = S.bannerModal;

      if (m.act === 'product' && !(S.stockProducts || []).some(p => p.sku === m.sku.trim())) { flash('Bunday SKU li mahsulot yo‘q'); return; }
      if (!m.image && !m.imageData) { flash('Banner rasmini yuklang'); return; }
      try {
        const video = m.videoFile ? await uploadVideo('banners', m.videoFile, m.title + ' · banner video') : m.video;

        if (m.id) {
          const upd = await api('/api/admin/banners/' + m.id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

    /* ═══ Narxlar: dollar kursi + marja ═══
       Sotuv narxi = tannarx ($) × kurs × (1 + marja %). Kurs yoki marja qo'llanganda
       server barcha narxlarni qayta yozadi — mijoz ilovasi va buyurtmalar darhol yangi narxda. */
    const cleanNum = v => String(v ?? '').replace(/\s/g, '').replace(',', '.');
    const fmtUsd = n => '$' + (Math.round((+n || 0) * 100) / 100).toFixed(2);
    function fxInit(cur) {
      return {
        rate: cur && cur.usdRate ? String(cur.usdRate) : '', rounding: cur ? cur.rounding : 1000,
        mDef: cur ? String(cur.margins.default) : '15', mUsta: cur ? String(cur.margins.usta) : '12',
        preview: null, busy: false, cbu: null, cbuBusy: false
      };
    }
    const fxSet = patch => set(p => ({ fx: { ...(p.fx || fxInit(p.currency)), ...patch } }));
    function fxBody() {
      const f = S.fx || fxInit(S.currency), body = { margins: { default: cleanNum(f.mDef), usta: cleanNum(f.mUsta) } };
      if (cleanNum(f.rate)) body.usdRate = cleanNum(f.rate);
      if (f.rounding) body.rounding = f.rounding;
      return body;
    }
    async function fxPreview() {
      fxSet({ busy: true });
      try {
        const pv = await api('/api/admin/currency/preview', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(fxBody()) });
        fxSet({ preview: pv, busy: false });
        return pv;
      } catch (e) { fxSet({ busy: false }); flash(e.message); return null; }
    }
    async function fxApply() {
      const pv = (S.fx && S.fx.preview) || await fxPreview();
      if (!pv) return;
      set({
        confirmModal: {
          title: 'Narxlarni qayta hisoblash',
          text: `1 $ = ${M(pv.newRate)} so'm · marja ${pv.margins.default}% (usta ${pv.margins.usta}%). ${pv.changed} ta mahsulot narxi o'zgaradi, o'rtacha ${pv.avgPct > 0 ? '+' : ''}${pv.avgPct}%. Mijoz ilovasi va yangi buyurtmalar darhol yangi narxda bo'ladi.`,
          actionLabel: 'Qo‘llash', cancelLabel: 'Bekor',
          action: async () => {
            set({ confirmModal: null });
            fxSet({ busy: true });
            try {
              const r = await api('/api/admin/currency', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(fxBody()) });
              const [stock, cur] = await Promise.all([api('/api/admin/stock'), api('/api/admin/currency')]);
              set({ stockProducts: stock, currency: cur, fx: fxInit(cur) });
              flash(`1 $ = ${M(r.newRate)} so'm · ${r.changed} ta narx yangilandi`);
            } catch (e) { fxSet({ busy: false }); flash(e.message); }
          }
        }
      });
    }
    async function fxCbu() {
      fxSet({ cbuBusy: true });
      try {
        const c = await api('/api/admin/currency/cbu');
        fxSet({ rate: String(c.rate), cbu: c, cbuBusy: false, preview: null });
        flash(`Markaziy bank kursi: ${M(c.rate)} so'm · ${c.date || 'bugun'}`);
      } catch (e) { fxSet({ cbuBusy: false }); flash(e.message); }
    }

    function mFx() {
      const cur = S.currency;
      if (!cur) return `<div style="margin-top:20px;border:1px dashed var(--line4);border-radius:20px;padding:16px;font:400 11.5px var(--fm);color:var(--dim2)">Narx sozlamalari yuklanmoqda…</div>`;
      const f = S.fx || fxInit(cur), pv = f.preview;
      const pending = !cur.marginsApplied || cur.tracked < cur.products;
      const upd = cur.updatedAt ? new Date(cur.updatedAt).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'hali o‘zgartirilmagan';
      const field = (k, label, val, suffix, ph) => `
        <div style="flex:1;min-width:130px">
          <div style="font:600 9.5px var(--fm);color:var(--dim2);letter-spacing:.05em">${label}</div>
          <div style="margin-top:5px;display:flex;align-items:center;gap:6px;border:1px solid var(--line3);border-radius:14px;padding:9px 11px;background:var(--tile)">
            <input data-k="fx_${k}" value="${esc(val)}" inputmode="decimal" placeholder="${esc(ph)}" oninput="${h(e => fxSet({ [k]: e.target.value, preview: null }))}" style="flex:1;min-width:0;border:none;outline:none;background:transparent;color:var(--fg);font:600 14px var(--fm)">
            <span style="font:500 11px var(--fm);color:var(--dim2)">${suffix}</span>
          </div>
        </div>`;

    /* ═══ Call-markaz: mijoz qurilma ID si bo‘yicha komplekt yig‘ib, uning savatiga yuborish ═══ */
    function ccSet(o) { set({ cc: { ...S.cc, ...o } }); }

    const DATA = { products: [], config: {} };
    let _ccKitsAt = 0;
    async function ccKitsLoad() {
      if (Date.now() - _ccKitsAt < 60000) return;
      try {
        const [products, config] = await Promise.all([api('/api/products'), api('/api/config')]);
        DATA.products = Array.isArray(products) ? products : [];
        DATA.config = config || {};
        _ccKitsAt = Date.now();
        render();
      } catch (e) { flash('Tayyor komplektlar yuklanmadi: ' + e.message); }
    }
    async function ccRefresh() {
      ccKitsLoad();
      try { set({ ccPushes: await api('/api/admin/device-pushes') }); } catch (e) { flash(e.message); }
    }
    function ccAddKit(r) {
      const items = { ...S.cc.items };
      kbKitItems(r).forEach(it => { items[it.sku] = Math.min(999, (items[it.sku] || 0) + it.qty); });
      ccSet({ items, title: S.cc.title || (r.alias + ' · ' + kbKitName(r)) });
      flash(r.alias + ' komplekti qo‘shildi');
    }
    async function ccFind() {
      const code = String(S.cc.code || '').replace(/[^0-9]/g, '');
      if (code.length !== 6) { ccSet({ err: 'ID 6 ta raqamdan iborat', dev: null }); return; }
      ccSet({ busy: true, err: '' });
      try { ccSet({ dev: await api('/api/admin/devices/' + code), busy: false }); }
      catch (e) { ccSet({ dev: null, err: e.message, busy: false }); }
    }
    function ccQty(sku, d) {
      const items = { ...S.cc.items };
      items[sku] = Math.max(0, Math.min(999, (items[sku] || 0) + d));
      if (!items[sku]) delete items[sku];
      ccSet({ items });
    }
    async function ccSend() {
      const c = S.cc;
      if (c.busy) return;
      if (!c.dev) { ccSet({ err: 'Avval mijoz ID sini toping' }); return; }
      const items = Object.keys(c.items).map(sku => ({ sku, qty: c.items[sku] }));
      if (!items.length) { flash('Komplektga mahsulot qo‘shing'); return; }
      ccSet({ busy: true, err: '' });
      try {
        await api('/api/admin/devices/' + c.dev.code + '/push', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: c.title, note: c.note, items })
        });
        const dev = await api('/api/admin/devices/' + c.dev.code).catch(() => c.dev);
        set({ cc: { ...S.cc, busy: false, items: {}, title: '', note: '', dev } });
        flash('Komplekt yuborildi — mijoz ilovasi ochiq bo‘lsa, 20 soniyada savatga tushadi');
        ccRefresh();
      } catch (e) { ccSet({ busy: false, err: e.message }); }
    }
    async function ccCancel(p) {
      try {
        await api('/api/admin/device-pushes/' + p.id, { method: 'DELETE' });
        flash('Komplekt bekor qilindi');
        if (S.cc.dev) ccFind();
        ccRefresh();
      } catch (e) { flash(e.message); }
    }
    const ccAgo = ts => {
      const t = Date.parse(String(ts || '').replace(' ', 'T') + 'Z');
      if (!t) return '—';
      const m = Math.max(0, Math.floor((Date.now() - t) / 60000));
      return m < 1 ? 'hozir onlayn' : m < 60 ? m + ' daqiqa oldin' : m < 1440 ? Math.floor(m / 60) + ' soat oldin' : Math.floor(m / 1440) + ' kun oldin';
    };
    const ccPh = p => { const d = String(p || '').replace(/[^0-9]/g, ''); return d.length === 9 ? '+998 ' + d.replace(/(\d{2})(\d{3})(\d{2})(\d{2})/, '$1 $2 $3 $4') : ''; };

    /* ═══ AI video → Instagram ═══
       Brauzer 1080×1920 boshlang'ich kadr (mahsulot rasmi) va shaffof yozuv qatlami (nomi, narxi, telefon) chizadi;
       server kadrni fal.ai ga yuboradi, tayyor klipga qatlamni ffmpeg bilan qo'yadi va Instagram'ga Reels/Story qilib joylaydi. */
    const AI_FONT = "'Onest', 'Segoe UI', system-ui, sans-serif";
    const AI_PHONE = '+998 78 120 00 20';
    const AI_BG = { light: ['#f7f5f2', '#e0dbd3', 'rgba(255,79,18,.10)'], dark: ['#27231f', '#0b0a09', 'rgba(255,79,18,.30)'], orange: ['#ff7a3d', '#c43706', 'rgba(255,255,255,.20)'] };
    function aiSet(o) { set({ ai: { ...S.ai, ...o } }); }
    let _aiPoll = null, _aiSig = '', _aiSeq = 0, _aiDeb = null;
    const aiPending = x => ['generating', 'processing'].includes(x.status) || x.ig_status === 'uploading';
    async function aiRefresh(quiet) {
      clearTimeout(_aiPoll);
      try {
        const [st, list] = await Promise.all([quiet && S.ai.st ? S.ai.st : api('/api/admin/ai/status'), api('/api/admin/ai/videos')]);
        const sig = JSON.stringify(list);
        if (sig !== _aiSig || st !== S.ai.st) {
          const old = new Map((S.ai.list || []).map(x => [x.id, x]));
          if (quiet) for (const x of list) {
            const o = old.get(x.id); if (!o) continue;
            if (o.status !== 'ready' && x.status === 'ready') flash('AI video tayyor: ' + (x.title || '#' + x.id));
            if (o.ig_status !== 'published' && x.ig_status === 'published') flash('Instagram’ga joylandi ✓');
            if (o.status !== 'failed' && x.status === 'failed' || o.ig_status !== 'failed' && x.ig_status === 'failed') flash(x.error || 'Xato');
          }
          _aiSig = sig; aiSet({ st, list });
        }
      } catch (e) { if (!quiet) flash(e.message); }
      if (S.adminTab === 'ai' && S.token && (S.ai.list || []).some(aiPending)) _aiPoll = setTimeout(() => aiRefresh(true), 8000);
    }
    function aiImg(src) {
      return new Promise((resolve, reject) => {
        const im = new Image();
        if (!/^data:/.test(src)) im.crossOrigin = 'anonymous';
        im.onload = () => resolve(im);
        im.onerror = () => reject(new Error('Rasm ochilmadi'));
        im.src = src;
      });
    }
    function aiRRect(g, x, y, w, hh, r) {
      g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + hh, r); g.arcTo(x + w, y + hh, x, y + hh, r);
      g.arcTo(x, y + hh, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
    }
    function aiWrap(g, text, maxW, maxLines) {
      const lines = []; let cur = '';
      for (const w of String(text || '').split(/\s+/).filter(Boolean)) {
        const t = cur ? cur + ' ' + w : w;
        if (!cur || g.measureText(t).width <= maxW) cur = t; else { lines.push(cur); cur = w; }
      }
      if (cur) lines.push(cur);
      if (lines.length > maxLines) {
        lines.length = maxLines;
        let l = lines[maxLines - 1];
        while (l.length > 1 && g.measureText(l + '…').width > maxW) l = l.slice(0, -1);
        lines[maxLines - 1] = l + '…';
      }
      return lines;
    }
    /* Kadr (JPEG) va qatlam (PNG). Reels/Story xavfsiz hududi: tepada ~220px, pastda ~350px, o'ngda ~140px Instagram tugmalari */
    async function aiCompose() {
      const a = S.ai, seq = ++_aiSeq;
      if (!a.img) { aiSet({ frame: '', ov: '' }); return; }
      let im;
      try { im = await aiImg(a.img); } catch (e) { if (seq === _aiSeq) aiSet({ err: 'Rasm ochilmadi — boshqa rasm tanlang', frame: '', ov: '' }); return; }
      if (seq !== _aiSeq) return;
      try { if (document.fonts) await document.fonts.ready; } catch (e) { }
      const W = 1080, H = 1920;
      const c = document.createElement('canvas'); c.width = W; c.height = H;
      const g = c.getContext('2d');
      const [c1, c2, glow] = AI_BG[a.bg] || AI_BG.light;
      let gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, c1); gr.addColorStop(1, c2);
      g.fillStyle = gr; g.fillRect(0, 0, W, H);
      gr = g.createRadialGradient(W / 2, 700, 40, W / 2, 700, 760); gr.addColorStop(0, glow); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.fillRect(0, 0, W, H);
      const k = Math.min(880 / im.width, 860 / im.height), w = im.width * k, ih = im.height * k, x = (W - w) / 2, y = 700 - ih / 2;
      if (a.bg === 'dark') {
        aiRRect(g, x - 28, y - 28, w + 56, ih + 56, 44); g.fillStyle = '#ffffff'; g.fill();
        g.drawImage(im, x, y, w, ih);
      } else {
        g.fillStyle = 'rgba(0,0,0,.10)'; g.beginPath(); g.ellipse(W / 2, y + ih + 18, w * 0.38, 26, 0, 0, Math.PI * 2); g.fill();
        g.globalCompositeOperation = 'multiply'; g.drawImage(im, x, y, w, ih); g.globalCompositeOperation = 'source-over';   // oq fon yo'qoladi
      }
      const frame = c.toDataURL('image/jpeg', 0.9);

      const o = document.createElement('canvas'); o.width = W; o.height = H;
      const q = o.getContext('2d');
      const brand = 'KAMERA OPTOM · QARSHI';
      q.font = `700 34px ${AI_FONT}`; q.textBaseline = 'middle';
      aiRRect(q, 60, 230, q.measureText(brand).width + 96, 80, 40); q.fillStyle = 'rgba(20,19,17,.80)'; q.fill();
      q.fillStyle = '#ff4f12'; q.beginPath(); q.arc(104, 270, 12, 0, Math.PI * 2); q.fill();
      q.fillStyle = '#ffffff'; q.fillText(brand, 132, 272);
      q.textBaseline = 'alphabetic';
      q.font = `700 56px ${AI_FONT}`;
      const tl = aiWrap(q, a.title, 780, 2);
      const priceTxt = +String(a.price).replace(/\s/g, '') > 0 ? M(+String(a.price).replace(/\s/g, '')) + ' so‘m' : '';
      const ph = 56 + tl.length * 70 + (priceTxt ? 104 : 0) + (a.line ? 60 : 0) + 36;
      const py = 1560 - ph;
      aiRRect(q, 60, py, 880, ph, 40); q.fillStyle = 'rgba(20,19,17,.86)'; q.fill();
      q.fillStyle = '#ff4f12'; aiRRect(q, 60, py + 40, 10, ph - 80, 5); q.fill();
      let yy = py + 56;
      q.fillStyle = '#ffffff';
      tl.forEach(l => { q.fillText(l, 108, yy + 48); yy += 70; });
      if (priceTxt) { q.font = `800 84px ${AI_FONT}`; q.fillStyle = '#ff4f12'; q.fillText(priceTxt, 106, yy + 86); yy += 104; }
      if (a.line) { q.font = `500 36px ${AI_FONT}`; q.fillStyle = 'rgba(255,255,255,.80)'; q.fillText(aiWrap(q, a.line, 780, 1)[0] || '', 108, yy + 44); }
      const ov = o.toDataURL('image/png');
      if (seq !== _aiSeq) return;
      aiSet({ frame, ov, err: '' });
    }
    function aiRecompose() { clearTimeout(_aiDeb); _aiDeb = setTimeout(aiCompose, 300); }
    const aiDefPrompt = name => `Premium commercial product video of a CCTV security camera${name ? ' (' + name + ')' : ''}. Slow, smooth cinematic camera push-in with a gentle orbit around the product, soft studio lighting, subtle light sweeps and reflections gliding over the housing, shallow depth of field, clean background. The product stays sharp, unchanged and centered. No text, no people, no added logos.`;
    function aiDefCaption(a) {
      const price = +String(a.price).replace(/\s/g, '');
      return [
        a.title || 'Kuzatuv kamerasi',
        a.spec ? '✅ ' + a.spec : '',

        '📞 ' + AI_PHONE,

        '',
        '#kuzatuvkamerasi #videokuzatuv #kamera #qarshi #kameraoptom #xavfsizlik'
      ].filter((s, i, arr) => s || (i > 0 && arr[i - 1])).join('\n');
    }
    function aiPick(p) {
      const img = (Array.isArray(p.images) && p.images[0]) || '';
      if (!img) flash('Bu mahsulotda rasm yo‘q — o‘zingiz rasm yuklang');
      S.ai = { ...S.ai, sku: p.sku, title: p.name, price: String(p.price || ''), spec: p.spec || '', img, prompt: aiDefPrompt(p.name), q: '', frame: '', ov: '', err: '' };

    async function aiFile(e) {
      const f = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!f) return;
      try {
        const d = await imageData(f, 1600);

    function sdSet(o) { set({ sd: { ...S.sd, ...o } }); }
    let _sdPoll = null, _sdSig = '';

    const sdJSON = (url, method, body) => api(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
    async function sdRefresh(quiet) {
      clearTimeout(_sdPoll);

            const o = old.get(p.id);

            if (o === 'producing' && p.status === 'ready') flash('Video tayyor ✓ ' + (p.title || ''));
            if (o && o !== 'failed' && p.status === 'failed') flash(p.error || 'Xato');
          }
          _sdSig = sig; sdSet({ st, list });
        }
      } catch (e) { if (!quiet) flash(e.message); }
      if (S.adminTab === 'studio' && S.token && (S.sd.list || []).some(p => SD_BUSY.includes(p.status))) _sdPoll = setTimeout(() => sdRefresh(true), 6000);
    }
    const sdCur = () => (S.sd.list || []).find(p => p.id === S.sd.cur) || null;
    function sdPut(p) { sdSet({ list: (S.sd.list || []).some(x => x.id === p.id) ? S.sd.list.map(x => x.id === p.id ? p : x) : [p, ...(S.sd.list || [])] }); }
    async function sdDo(label, fn) {
      if (S.sd.busy) return;
      sdSet({ busy: label });
      try { await fn(); } catch (e) { flash(e.message); }
      sdSet({ busy: '' });
      sdRefresh();
    }
    const fileData = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => no(new Error('Fayl o‘qilmadi')); r.readAsDataURL(f); });
    function sdSaveKey() {
      const k = String(S.sd.elKey || '').trim();
      if (!k) { flash('ElevenLabs API kalitini kiriting'); return; }
      sdDo('key', async () => { sdSet({ st: await sdJSON('/api/admin/studio/eleven', 'PUT', { apiKey: k }), elKey: '' }); flash('ElevenLabs ulandi'); });
    }
    function sdVoiceFile(e) {
      const f = e.target.files && e.target.files[0]; e.target.value = '';
      if (!f) return;
      if (f.size > 7 * 1024 * 1024) { flash('Ovoz fayli 7 MB dan oshmasin — 1–2 daqiqalik MP3 yetarli'); return; }
      sdDo('voice', async () => {
        const audio = await fileData(f);
        sdSet({ st: await sdJSON('/api/admin/studio/voice', 'POST', { audio, name: S.sd.voiceName }) });
        flash('Ovozingiz klonlandi ✓ — sinab eshiting');
      });
    }
    function sdLoadVoices() {
      sdDo('voices', async () => { sdSet({ voices: await api('/api/admin/studio/voices') }); });
    }
    function sdPickVoice(id) {
      sdDo('pick', async () => { sdSet({ st: await sdJSON('/api/admin/studio/voice', 'PUT', { voiceId: id }), testAudio: '' }); flash('Ovoz tanlandi — sinab eshiting'); });

    }
    function sdFaceFile(e) {
      const f = e.target.files && e.target.files[0]; e.target.value = '';

    function sdCreate() {
      const t = String(S.sd.topic || '').trim();

        const p = await sdJSON('/api/admin/studio/projects', 'POST', { topic: t, brief: S.sd.brief, seconds: S.sd.secs });
        sdPut(p); sdSet({ cur: p.id, topic: '', brief: '' });
        flash(S.sd.st && S.sd.st.worker.online ? 'Ssenariy yozilmoqda — odatda 1 daqiqa' : 'Mavzu navbatga qo‘yildi — kompyuteringizda ssenariy ishchisini yoqing');

    const sdRescript = p => sdDo('rescript', async () => { sdPut(await sdJSON(`/api/admin/studio/projects/${p.id}/rescript`, 'POST', {})); flash('Yangi variantlar so‘raldi'); });

                  <div style="${box};flex:2;min-width:180px"><input data-k="sd_vis_${s.id}" value="${esc(d.visual)}" placeholder="Kamera harakati (inglizcha, ixtiyoriy)" oninput="${h(e => sdDraftSet(s, { visual: e.target.value }))}" style="${inp}"></div></div>
                  ${prod ? `<div style="font:400 10.5px var(--fb);color:var(--dim2);margin-top:4px">${esc(prod.name)} · ${fmt(prod.price || 0)}</div>` : d.sku ? `<div style="font:500 10.5px var(--fb);color:var(--red);margin-top:4px">Bunday SKU topilmadi</div>` : ''}` : ''}
                ${s.error ? `<div style="margin-top:7px;padding:8px 10px;border-radius:10px;background:rgba(229,55,42,.1);color:var(--red);font:500 11px/1.45 var(--fb)">${esc(s.error)}</div>` : ''}

                  ${dirty ? `<button onclick="${h(() => { const dr = { ...S.sd.drafts }; delete dr[s.id]; sdSet({ drafts: dr }); })}" class="ad-btn g">Bekor</button><button onclick="${h(() => sdSaveScene(p, s))}" class="ad-btn p">Saqlash va qayta yasash</button>` : ''}
                </div>
              </div>`;
            }).join('')}
            <div style="border:1px dashed var(--line4);border-radius:16px;padding:11px 12px">
              ${lbl('YANGI SAHNA (AVATAR) — OXIRIGA QO‘SHILADI')}

              <button onclick="${h(() => sdAddScene(p))}" class="ad-btn g" style="margin-top:8px">+ Sahna qo‘shish</button>
            </div></div>
            <datalist id="sd_skus">${(S.stockProducts || []).filter(x => Array.isArray(x.images) && x.images.length).slice(0, 1500).map(x => `<option value="${esc(x.sku)}">${esc(x.name)}</option>`).join('')}</datalist>

            </div>`;

        detail = `<div style="${card}">${head}${body}</div>`;

    <div style="display:flex;gap:9px;margin-top:14px">
      <div onclick="${h(v.noteSkip)}" style="flex:none;padding:13px 15px;border-radius:17px;border:1px solid var(--line3);color:var(--fg2);font:600 12px var(--fb);cursor:pointer">Xabarsiz saqlash</div>
      <div onclick="${h(v.noteSend)}" style="flex:1;text-align:center;padding:13px;border-radius:17px;background:var(--acc);color:#ffffff;font:600 12.5px var(--fb);cursor:pointer">Yuborish</div>
    </div>
  </div>
</div>`;
    }

    /* ═══ RENDER ═══ */
    const ROOT = document.getElementById('root');
    let _scroll = 0;
    function render() {
      const act = document.activeElement, fk = act && act.dataset ? act.dataset.k : null;
      const fs = fk ? act.selectionStart : null, fe = fk ? act.selectionEnd : null;
      H = [];
      if (document.documentElement) document.documentElement.setAttribute('data-theme', adTheme());
      const v = vals();
      const toast = v.toastOn ? `<div class="ad-toast" role="status"><span class="dot">${aic('check', 14, 3)}</span><span>${esc(v.toast)}</span></div>` : '';
      if (!v.isLoggedIn) {
        ROOT.innerHTML = mLogin(v) + toast;
        if (fk) { const el = ROOT.querySelector('[data-k="' + fk + '"]'); if (el) { el.focus(); try { el.setSelectionRange(fs, fe); } catch (e) { } } }
        return;
      }
      const night = adTheme() === 'night';
      ROOT.innerHTML = `
<div style="height:100%;position:relative;display:flex;background:var(--bg);color:var(--fg)">
  <div id="side-backdrop" class="${v.sideOpen ? 'open' : ''}" onclick="${h(v.closeSide)}" style="position:fixed;inset:0;background:rgba(20,19,17,.45);backdrop-filter:blur(3px);z-index:55"></div>
  ${mSide(v)}
  <div style="flex:1;min-width:0;display:flex;flex-direction:column">
    ${v.isOffline ? `<div style="background:var(--red);color:#fff;text-align:center;padding:8px 12px;font:600 12.5px var(--fb);position:sticky;top:0;z-index:99">Internet aloqasi yo'q — oflayn rejim</div>` : ''}
    <header class="ad-top">
      <div style="display:flex;align-items:center;gap:12px;min-width:0">
        <button onclick="${h(v.toggleSide)}" class="burger-btn ad-icon" aria-label="Menyu">${aic('menu', 18, 2)}</button>
        <div style="min-width:0"><h1 class="ad-title">${esc(v.adminTitle)}</h1><div class="ad-sub">${esc(v.adminSub)}</div></div>
      </div>
      <div class="ad-actions">
        <a href="app.html" target="_blank" rel="noopener" class="ad-btn g" style="text-decoration:none">Mijoz ilovasi ${aic('ext', 15, 2)}</a>
        <button onclick="${h(v.exportCsv)}" class="ad-btn g">${aic('download', 16, 2)} CSV</button>
        <button onclick="${h(adToggleTheme)}" class="ad-icon" aria-label="Mavzu" title="${night ? 'Kunduzgi' : 'Tungi'} mavzu">${aic(night ? 'sun' : 'moon', 18, 2)}</button>
        <button onclick="${h(v.goProducts)}" class="ad-btn p">${aic('plus', 16, 2.4)} Mahsulot</button>
      </div>
    </header>
    <div style="flex:1;overflow:auto;padding:24px 28px 32px" id="scroller">
      <div class="ad-kpis">
        ${v.kpis.map((k, i) => `
          <div class="ad-kpi">
            <span class="ico">${aic(KPI_IC[i] || 'chart', 19)}</span>
            <div class="kl">${esc(k.label)}</div>
            <div class="kv">${k.value}</div>
            <div class="kd" style="color:${k.dFg}">${k.delta}</div>
          </div>`).join('')}
      </div>
      ${v.aOrders ? mOrders(v) : ''}
      ${v.aCallbacks ? mCallbacks(v) : ''}
      ${v.aProducts ? mProducts(v) : ''}
      ${v.aCredit ? mCredit(v) : ''}
      ${v.aSettings ? mSettings(v) : ''}
      ${v.aStories ? mStories(v) : ''}
      ${v.aStats ? mStats(v) : ''}
      ${v.aInstall ? mInstall(v) : ''}
      ${v.aClients ? mClients(v) : ''}
      ${v.aUstas ? mUstas() : ''}
      ${v.aCall ? mCallCenter() : ''}
      ${v.aAi ? mAi() : ''}
      ${v.aSd ? mStudio() : ''}
    </div>
  </div>
  ${v.noteOn ? mNote(v) : ''}
  ${S.bannerModal ? mBannerModal() : ''}
  ${S.up ? `<div style="position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:90;width:min(420px,calc(100% - 24px));padding:12px 14px;border-radius:16px;background:var(--btn);color:var(--btn-ink);box-shadow:var(--shadow-lg)">
    <div style="display:flex;justify-content:space-between;font:600 12px var(--fb)"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Yuklanmoqda · ${esc(S.up.label)}</span><span>${S.up.pct}%</span></div>
    <div style="height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin-top:8px;overflow:hidden"><div style="height:100%;width:${S.up.pct}%;background:var(--acc);transition:width .2s ease"></div></div>
  </div>` : ''}
  ${v.confirmOn ? mConfirm(v) : ''}
  ${toast}
</div>`;
      const sc = document.getElementById('scroller'); if (sc) sc.scrollTop = _scroll;
      if (fk) { const el = ROOT.querySelector('[data-k="' + fk + '"]'); if (el) { el.focus(); try { el.setSelectionRange(fs, fe); } catch (e) { } } }
    }
    ROOT.addEventListener('scroll', e => { if (e.target.id === 'scroller') _scroll = e.target.scrollTop; }, true);
    const _origSet = set;
    window.set = function (o) { const t = S.adminTab; _origSet(o); if (S.adminTab !== t) { _scroll = 0; const sc = document.getElementById('scroller'); if (sc) sc.scrollTop = 0; } };

    async function initAdmin() {
      if (S.token) {
        try {
          await bootstrap();
          if (S.adminTab === 'callcenter') ccKitsLoad();
          if (S.adminTab === 'ai') aiRefresh();
          if (S.adminTab === 'studio') sdRefresh();
        } catch (e) {
          logout();
          return;
        }
      }
      render();
    }
    initAdmin();
  </script>
</body>

</html>
