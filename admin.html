<!DOCTYPE html>
<html lang="uz" data-theme="day">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KAMERA OPTOM — Admin 2.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* KAMERA OPTOM · Admin 2.0 "Signal" — mijoz ilovasi v2 bilan bir dizayn tizimi */
    :root {
      --fd: 'Unbounded', 'Onest', system-ui, sans-serif;
      --fb: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --fm: 'Onest', system-ui, sans-serif;
      --acc: #ff4f12; --acc-soft: rgba(255, 79, 18, .1); --acc-line: rgba(255, 79, 18, .35);
      --ok: #12a150; --warn: #c77c00; --red: #e5372a;
      --bg: #f3f1ed; --card: #ffffff; --bar: #ffffff; --tile: #f6f4f0; --panel2: #fbfaf8; --thead: #f6f4f0;
      --fg: #141311; --fg2: #46423c; --dim: #7d786f; --dim2: #857f76; --dim3: #5b574f; --dim4: #aca69c; --dim5: #b5afa5;
      --hatchA: #efece6; --hatchB: #e9e6e0; --hatchC: #ece8e1;
      --line: rgba(20, 19, 17, .08); --line2: rgba(20, 19, 17, .06); --line3: rgba(20, 19, 17, .13); --line4: rgba(20, 19, 17, .18);
      --fill: rgba(20, 19, 17, .045);
      --btn: #141311; --btn-ink: #ffffff; --surface2: #ebe8e2;
      --shadow: 0 1px 2px rgba(20, 19, 17, .04), 0 10px 28px rgba(20, 19, 17, .06);
      --shadow-lg: 0 24px 60px rgba(20, 19, 17, .2);
    }

    [data-theme="night"] {
      --acc: #ff6a33; --acc-soft: rgba(255, 106, 51, .14); --acc-line: rgba(255, 106, 51, .4);
      --ok: #3ccf7e; --warn: #f0b43c; --red: #ff5a4d;
      --bg: #0f0f0e; --card: #1a1918; --bar: #151413; --tile: #211f1d; --panel2: #1d1c1a; --thead: #1f1d1b;
      --fg: #f4f2ee; --fg2: #cbc6bd; --dim: #8f8a81; --dim2: #8a857c; --dim3: #b2ada4; --dim4: #6b665f; --dim5: #5f5b55;
      --hatchA: #221f1d; --hatchB: #1d1b19; --hatchC: #262320;
      --line: rgba(255, 255, 255, .08); --line2: rgba(255, 255, 255, .06); --line3: rgba(255, 255, 255, .13); --line4: rgba(255, 255, 255, .18);
      --fill: rgba(255, 255, 255, .05);
      --btn: #f4f2ee; --btn-ink: #141311; --surface2: #242321;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .35);
      --shadow-lg: 0 24px 60px rgba(0, 0, 0, .6);
    }

    * { box-sizing: border-box }
    button { background: none; border: 0; font: inherit; color: inherit; padding: 0; margin: 0; text-align: inherit; cursor: pointer; -webkit-appearance: none }
    :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px }
    html, body { height: 100% }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--fb); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased }
    ::-webkit-scrollbar { width: 8px; height: 8px }
    ::-webkit-scrollbar-thumb { background: var(--line4); border-radius: 4px }
    #root { height: 100% }
    input, textarea, select { font-family: inherit }
    svg { flex: none; display: block }
    .burger-btn { display: none }
    #side-backdrop { display: none }

    /* qobiq */
    .ad-side { width: 248px; flex: none; display: flex; flex-direction: column; gap: 18px; padding: 20px 14px; background: var(--bar); border-right: 1px solid var(--line) }
    .ad-brand { display: flex; align-items: center; gap: 11px; text-decoration: none; color: inherit; padding: 2px 6px }
    .ad-brand b { display: block; font: 600 14px/1 var(--fd); letter-spacing: -.02em }
    .ad-brand small { display: block; margin-top: 5px; font: 600 10.5px/1 var(--fb); color: var(--acc); letter-spacing: .08em }
    .ad-nav { display: flex; flex-direction: column; gap: 2px }
    .ad-nav button { display: flex; align-items: center; gap: 11px; width: 100%; height: 44px; padding: 0 12px; border-radius: 14px; color: var(--dim3); font: 500 14px var(--fb); transition: background .15s ease, color .15s ease }
    .ad-nav button:hover { background: var(--fill); color: var(--fg) }
    .ad-nav button.on { background: var(--btn); color: var(--btn-ink) }
    .ad-nav button span { flex: 1; text-align: left }
    .ad-nav i { font: 700 11px var(--fb); font-style: normal; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 99px; display: inline-flex; align-items: center; justify-content: center; background: var(--acc-soft); color: var(--acc) }
    .ad-nav button.on i { background: var(--acc); color: #fff }
    .ad-user { margin-top: auto; display: flex; align-items: center; gap: 11px; padding: 12px; border-radius: 18px; background: var(--tile) }
    .ad-ava { flex: none; width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(145deg, #ff7a3d, #ff4f12); color: #fff; display: flex; align-items: center; justify-content: center; font: 600 13px var(--fd) }
    .ad-top { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 28px; border-bottom: 1px solid var(--line); background: var(--bg) }
    .ad-title { margin: 0; font: 600 22px/1.15 var(--fd); letter-spacing: -.03em }
    .ad-sub { margin-top: 5px; font: 400 13px var(--fb); color: var(--dim) }
    .ad-actions { display: flex; align-items: center; gap: 8px }
    .ad-btn { display: inline-flex; align-items: center; gap: 7px; height: 42px; padding: 0 16px; border-radius: 99px; font: 600 13px var(--fb); white-space: nowrap; transition: transform .15s ease }
    .ad-btn:active { transform: scale(.97) }
    .ad-btn.p { background: var(--btn); color: var(--btn-ink) }
    .ad-btn.g { border: 1px solid var(--line3); color: var(--fg2) }
    .ad-icon { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line3); display: flex; align-items: center; justify-content: center; color: var(--fg2) }
    .ad-icon.burger-btn { display: none }
    .ad-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px }
    .ad-kpi { position: relative; padding: 18px; border-radius: 24px; background: var(--card); box-shadow: var(--shadow); overflow: hidden }
    .ad-kpi .ico { width: 40px; height: 40px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: var(--tile); color: var(--fg) }
    .ad-kpi:first-child { background: var(--btn); color: var(--btn-ink) }
    .ad-kpi:first-child .ico { background: var(--acc); color: #fff }
    .ad-kpi:first-child .kl, .ad-kpi:first-child .kd { color: inherit !important; opacity: .65 }
    .ad-kpi .kl { margin-top: 16px; font: 600 11.5px var(--fb); letter-spacing: .06em; color: var(--dim) }
    .ad-kpi .kv { margin-top: 6px; font: 600 28px/1.05 var(--fd); letter-spacing: -.04em }
    .ad-kpi .kd { margin-top: 6px; font: 500 12.5px var(--fb) }
    .ad-toast { position: fixed; right: 24px; bottom: 24px; z-index: 80; display: flex; align-items: center; gap: 11px; padding: 13px 18px 13px 13px; border-radius: 20px; background: var(--btn); color: var(--btn-ink); font: 600 13.5px var(--fb); box-shadow: var(--shadow-lg); animation: adIn .3s cubic-bezier(.2, 1.2, .4, 1) both }
    .ad-toast .dot { width: 26px; height: 26px; border-radius: 50%; background: var(--acc); color: #fff; display: flex; align-items: center; justify-content: center }
    @keyframes adIn { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }

    /* kirish */
    .lg { min-height: 100vh; display: grid; grid-template-columns: 1.05fr 1fr; background: var(--bg) }
    .lg-art { position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 44px; background: #141311; color: #f4f2ee }
    .lg-art::before { content: ""; position: absolute; right: -120px; top: -120px; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 79, 18, .55), transparent 65%) }
    .lg-art h1 { position: relative; margin: 0; font: 600 44px/1.05 var(--fd); letter-spacing: -.04em; max-width: 460px }
    .lg-art h1 em { font-style: normal; color: #ff6a33 }
    .lg-art p { position: relative; margin: 16px 0 0; font: 400 15px/1.6 var(--fb); color: rgba(244, 242, 238, .7); max-width: 420px }
    .lg-lens { position: absolute; right: 60px; bottom: 90px; width: 190px; height: 190px }
    .lg-lens i { position: absolute; border-radius: 50% }
    .lg-lens .r1 { inset: 0; border: 1.5px dashed rgba(255, 255, 255, .25); animation: lgSpin 40s linear infinite }
    .lg-lens .r2 { inset: 16px; background: repeating-conic-gradient(#ff6a33 0 1.4deg, transparent 1.4deg 7deg); -webkit-mask: radial-gradient(closest-side, transparent 84%, #000 85% 98%, transparent 100%); mask: radial-gradient(closest-side, transparent 84%, #000 85% 98%, transparent 100%); animation: lgSpin 18s linear infinite reverse }
    .lg-lens .r3 { inset: 46px; background: radial-gradient(circle at 35% 30%, #46413c, #0d0c0b 72%); box-shadow: inset 0 0 0 4px #26231f }
    .lg-lens .r4 { inset: 78px; background: radial-gradient(circle, #ffb07a 0, #ff5a1f 34%, #8a2200 70%, #1a0904 100%); box-shadow: 0 0 30px 6px rgba(255, 90, 31, .55) }
    @keyframes lgSpin { to { transform: rotate(360deg) } }
    .lg-form { display: flex; align-items: center; justify-content: center; padding: 32px }
    .lg-card { width: 100%; max-width: 380px }
    .lg-card h2 { margin: 0; font: 600 26px var(--fd); letter-spacing: -.03em }
    .lg-field { display: block; margin-top: 16px }
    .lg-field span { display: block; margin-bottom: 7px; font: 600 12px var(--fb); color: var(--dim); letter-spacing: .04em }
    .lg-field input { width: 100%; height: 54px; padding: 0 18px; border-radius: 16px; border: 1.5px solid var(--line3); background: var(--card); color: var(--fg); font: 500 15px var(--fb); outline: none; transition: border-color .15s ease }
    .lg-field input:focus { border-color: var(--fg) }
    .lg-submit { margin-top: 22px; width: 100%; height: 54px; border-radius: 99px; text-align: center; background: var(--btn); color: var(--btn-ink); font: 600 15px var(--fb) }

    @media (max-width: 1100px) { .ad-kpis { grid-template-columns: repeat(2, 1fr) } }
    @media (max-width: 900px) {
      #side { position: fixed; top: 0; bottom: 0; left: 0; z-index: 60; transform: translateX(-100%); transition: transform .24s ease; box-shadow: var(--shadow-lg) }
      #side.open { transform: translateX(0) }
      .burger-btn { display: flex !important }
      #side-backdrop.open { display: block !important }
      .ad-top { padding: 14px 16px }
      #scroller { padding: 16px !important }
      .ad-actions .ad-btn.g { display: none }
      .lg { grid-template-columns: 1fr }
      .lg-art { display: none }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script>
    /* ═══ KAMERA OPTOM QARSHI — admin panel (Claude Design "1b" prototipi) ═══ */
    const A = 'var(--acc)', RED = 'var(--red)', AMB = 'var(--warn)';
    const M = n => n.toLocaleString('ru-RU').replace(/,/g, ' ');
    const fmt = n => M(n) + " so'm";
    const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    let _token = '';
    let _tab = 'orders';
    try {
      _token = localStorage.getItem('ko_admin_token') || '';
      _tab = localStorage.getItem('ko_admin_tab') || 'orders';
    } catch (e) { }

    async function api(url, opt = {}) {
      const headers = { ...(opt.headers || {}) };
      if (S.token) headers['Authorization'] = 'Bearer ' + S.token;
      let r;
      try {
        r = await fetch(url, { ...opt, headers });
      } catch (err) {
        throw new Error('Server bilan aloqa yo\'q');
      }
      if (r.status === 401) {
        logout();
        throw new Error('Sessiya tugadi — qayta kiring');
      }
      if (!r.ok) {
        const errData = await r.json().catch(() => ({}));
        throw new Error(errData.error || ('Server xatosi: HTTP ' + r.status));
      }
      return r.status === 204 ? null : r.json();
    }

    async function doLogin() {
      if (!S.loginUser.trim() || !S.loginPass) {
        set({ loginErr: 'Login va parolni kiriting' });
        return;
      }
      set({ loginLoading: true, loginErr: '' });
      try {
        const r = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: S.loginUser.trim(), password: S.loginPass })
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) {
          throw new Error(data.error || "Login yoki parol noto'g'ri");
        }
        try { localStorage.setItem('ko_admin_token', data.token); } catch (e) { }
        set({ token: data.token, adminUser: data.admin, loginPass: '', loginLoading: false, loginErr: '' });
        flash('Xush kelibsiz, ' + (data.admin.name || data.admin.username));
      } catch (err) {
        set({ loginLoading: false, loginErr: err.message });
      }
    }

    function logout() {
      try { localStorage.removeItem('ko_admin_token'); } catch (e) { }
      set({ token: '', adminUser: null, loginPass: '', loginErr: '' });
    }

    const S = {
      token: _token, adminUser: null, loginUser: 'admin', loginPass: '', loginErr: '', loginLoading: false,
      isOffline: typeof navigator !== 'undefined' ? !navigator.onLine : false,
      adminTab: _tab, toast: null, sideOpen: false, confirmModal: null,
      orders: [], kpiData: null, stockProducts: [],
      prodForm: {
        isNew: true,
        sku: '',
        name: '',
        cat: 'Tashqi',
        price: '',
        spec: '',
        badge: '',
        qty: 0,
        promo: '',
        images: []
      },
      bannersList: [],
      bannerModal: null,
      schedule: [],
      promo: {},
      labelOn: { HIT: true, CHEGIRMA: true, YANGI: true },
      mod: { banners: true, stories: true, gps: true, memory: true, cable: true, install: true, cloud: true },
      rates: { 3: 0, 6: 8, 12: 14, 24: 26 }, rateOn: { 3: true, 6: true, 12: true, 24: true }, down: { 3: 0, 6: 10, 12: 20, 24: 30 },
      creditService: true, expertService: true,
      provOn: { 'Uzum Nasiya': true, 'Alif Nasiya': true, 'Hamkor Nasiya': true },
      qty: {},
      orderStatus: {}, notes: {}, noteDraft: null, noteText: '',
      video: true,
      cId: null, cTitle: '', cCams: '', cDate: '', cText: '', cTags: [], cLive: true, cFile: '',
      storyList: [],
      callbacks: [],
      currency: null, fx: null, ustas: [], storyCmts: [], cmtFilter: 'all',
      loading: false, loaded: false
    };

    let H = [];
    const h = fn => `_h(${H.push(fn) - 1},event)`;
    window._h = (i, e) => { const f = H[i]; if (f) f(e); };
    let _t = null;
    function set(o) {
      Object.assign(S, typeof o === 'function' ? o(S) : o);
      try {
        if (S.token) localStorage.setItem('ko_admin_token', S.token);
        if (S.adminTab) localStorage.setItem('ko_admin_tab', S.adminTab);
      } catch (e) { }
      render();
    }
    function flash(t) { S.toast = t; clearTimeout(_t); _t = setTimeout(() => { S.toast = null; render(); }, 2200); render(); }
    function promoStyle(k) { return ({ HIT: { fg: '#2a1a00', bg: '#ffb020', border: '#ffb020' }, CHEGIRMA: { fg: '#ffffff', bg: '#ff4d3d', border: '#ff4d3d' }, YANGI: { fg: '#ffffff', bg: '#ff4f12', border: '#ff4f12' } })[k] || { fg: 'var(--dim2)', bg: 'var(--fill)', border: 'var(--line3)' }; }
    function moveStory(i, d) { const l = [...S.storyList], j = i + d; if (j < 0 || j >= l.length) return;[l[i], l[j]] = [l[j], l[i]]; set({ storyList: l }); }
    function exportCSV(rows) {
      const csv = ['ID;MIJOZ;TELEFON;MAHSULOT;SUMMA;O\'RNATISH;STATUS', ...rows.map(o => [o.id, o.client, o.phone, o.item, o.sum, o.install, o.status].join(';'))].join('\n');
      const a = document.createElement('a');
      a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent('\uFEFF' + csv);
      a.download = 'buyurtmalar.csv'; a.click();
      flash('CSV fayl yuklandi');
    }

    async function bootstrap() {
      if (!S.token) return;
      set({ loading: true });
      try {
        const [orders, kpis, stock, settings, stories, callbacks, banners, schedule, currency, ustas, storyCmts] = await Promise.all([
          api('/api/admin/orders'),
          api('/api/admin/kpis'),
          api('/api/admin/stock'),
          api('/api/admin/settings'),
          api('/api/admin/stories'),
          api('/api/admin/callbacks').catch(() => []),
          api('/api/admin/banners').catch(() => []),
          api('/api/admin/schedule').catch(() => []),
          api('/api/admin/currency').catch(() => null),
          api('/api/admin/ustas').catch(() => []),
          api('/api/admin/story-comments').catch(() => [])
        ]);
        const promoMap = {};
        const qtyMap = {};
        for (const p of (stock || [])) {
          if (p.promo) promoMap[p.sku] = p.promo;
          qtyMap[p.sku] = p.qty;
        }
        const curPf = S.prodForm;
        let newPf;
        if (stock && stock.length) {
          const match = (curPf && curPf.sku) ? (stock.find(p => p.sku === curPf.sku) || stock[0]) : stock[0];
          newPf = {
            isNew: false,
            sku: match.sku,
            name: match.name,
            cat: match.cat,
            price: match.price, price_usd: match.price_usd ?? '', margin: match.margin ?? '', margin_usta: match.margin_usta ?? '',
            spec: match.spec || (match.tags ? match.tags.join(' · ') : ''),
            badge: match.badge || '',
            qty: match.qty || 0,
            promo: match.promo || '',
            images: Array.isArray(match.images) ? match.images : []
          };
        } else {
          newPf = {
            isNew: true,
            sku: '',
            name: '',
            cat: 'Tashqi',
            price: '',
            spec: '',
            badge: '',
            qty: 0,
            promo: '',
            images: []
          };
        }
        set({
          orders: orders || [],
          kpiData: kpis,
          stockProducts: stock || [],
          prodForm: newPf,
          promo: promoMap,
          qty: qtyMap,
          mod: (settings && settings.modules) || S.mod,
          rates: (settings && settings.credit && settings.credit.rates) || S.rates,
          down: (settings && settings.credit && settings.credit.down) || S.down,
          storyList: stories || [],
          callbacks: callbacks || [],
          bannersList: Array.isArray(banners) ? banners : [],
          schedule: Array.isArray(schedule) ? schedule : [],
          currency: currency && currency.margins ? currency : null, fx: currency && currency.margins ? fxInit(currency) : null,
          ustas: Array.isArray(ustas) ? ustas : [],
          storyCmts: Array.isArray(storyCmts) ? storyCmts : [],
          loading: false,
          loaded: true
        });
      } catch (err) {
        set({ loading: false });
        flash(err.message);
      }
    }

    function vals() {
      const s = S;
      const chip = on => ({ border: on ? A : 'var(--line3)', bg: on ? 'rgba(255,79,18,.12)' : 'var(--card)', fg: on ? A : 'var(--dim3)' });
      const ST = { Yangi: { fg: AMB, bg: 'rgba(255,176,32,.12)', border: 'rgba(255,176,32,.35)' }, Tasdiqlandi: { fg: '#7fb4ff', bg: 'rgba(127,180,255,.12)', border: 'rgba(127,180,255,.35)' }, "O'rnatishda": { fg: A, bg: 'rgba(255,79,18,.12)', border: 'rgba(255,79,18,.35)' }, Yopildi: { fg: 'var(--dim)', bg: 'var(--fill)', border: 'var(--line3)' }, Bekor: { fg: RED, bg: 'rgba(255,77,61,.12)', border: 'rgba(255,77,61,.35)' } };
      const FLOW = ['Yangi', 'Tasdiqlandi', "O'rnatishda", 'Yopildi'];
      const NOTE_DEF = {
        'Yangi': '', 'Tasdiqlandi': "Buyurtmangiz tasdiqlandi. O'lchovchi mutaxassis bugun aloqaga chiqadi.",
        "O'rnatishda": "Usta yo'lda — bugun 10:00 dan 12:00 gacha yetib boradi.",
        'Yopildi': "O'rnatish tugadi. Kafolat taloni ilovada saqlanadi, savollar bo'lsa yozing."
      };

      const orders = s.orders.map(o => {
        const st = s.orderStatus[o.id] || o.status || 'Yangi';
        const nt = s.notes[o.id] || (o.note ? { text: o.note, time: '' } : null);
        const itemStr = (Array.isArray(o.items) && o.items.length)
          ? o.items.map(it => (it.name || it.sku) + (it.qty > 1 ? ' × ' + it.qty : '')).join(', ')
          : (o.region || 'Buyurtma');
        const rawPh = String(o.phone || '').replace(/[^0-9]/g, '');
        const phoneStr = rawPh.length === 9 ? ('+998 ' + rawPh.replace(/(\d{2})(\d{3})(\d{2})(\d{2})/, '$1 $2 $3 $4')) : (o.phone || '—');
        const installStr = o.install ? (o.install_at || (o.created_at ? o.created_at.slice(5, 10) + ' · 10:00' : 'Rejalashtirilgan')) : 'Kerak emas';
        return {
          id: o.id,
          client: o.client_name || 'Mijoz',
          phone: phoneStr,
          rawPhone: o.phone,
          item: itemStr,
          sum: fmt(o.total || o.goods_sum || 0),
          install: installStr,
          status: st,
          ...(ST[st] || ST.Yangi),
          noteOn: !!nt,
          note: nt ? nt.text : '',
          next: async () => {
            const ns = FLOW[(FLOW.indexOf(st) + 1) % 4];
            const doChangeStatus = async () => {
              try {
                const updated = await api('/api/admin/orders/' + o.id.replace('#', '') + '/status', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: ns }) });
                set(stt => ({

    /* ═══ Narxlar: dollar kursi + marja ═══
       Sotuv narxi = tannarx ($) × kurs × (1 + marja %). Kurs yoki marja qo'llanganda
       server barcha narxlarni qayta yozadi — mijoz ilovasi va buyurtmalar darhol yangi narxda. */
    const cleanNum = v => String(v ?? '').replace(/\s/g, '').replace(',', '.');
    const fmtUsd = n => '$' + (Math.round((+n || 0) * 100) / 100).toFixed(2);
    function fxInit(cur) {
      return {
        rate: cur && cur.usdRate ? String(cur.usdRate) : '', rounding: cur ? cur.rounding : 1000,
        mDef: cur ? String(cur.margins.default) : '15', mUsta: cur ? String(cur.margins.usta) : '12',
        preview: null, busy: false, cbu: null, cbuBusy: false
      };
    }
    const fxSet = patch => set(p => ({ fx: { ...(p.fx || fxInit(p.currency)), ...patch } }));
    function fxBody() {
      const f = S.fx || fxInit(S.currency), body = { margins: { default: cleanNum(f.mDef), usta: cleanNum(f.mUsta) } };
      if (cleanNum(f.rate)) body.usdRate = cleanNum(f.rate);
      if (f.rounding) body.rounding = f.rounding;
      return body;
    }
    async function fxPreview() {
      fxSet({ busy: true });
      try {
        const pv = await api('/api/admin/currency/preview', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(fxBody()) });
        fxSet({ preview: pv, busy: false });
        return pv;
      } catch (e) { fxSet({ busy: false }); flash(e.message); return null; }
    }
    async function fxApply() {
      const pv = (S.fx && S.fx.preview) || await fxPreview();
      if (!pv) return;
      set({
        confirmModal: {
          title: 'Narxlarni qayta hisoblash',
          text: `1 $ = ${M(pv.newRate)} so'm · marja ${pv.margins.default}% (usta ${pv.margins.usta}%). ${pv.changed} ta mahsulot narxi o'zgaradi, o'rtacha ${pv.avgPct > 0 ? '+' : ''}${pv.avgPct}%. Mijoz ilovasi va yangi buyurtmalar darhol yangi narxda bo'ladi.`,
          actionLabel: 'Qo‘llash', cancelLabel: 'Bekor',
          action: async () => {
            set({ confirmModal: null });
            fxSet({ busy: true });
            try {
              const r = await api('/api/admin/currency', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(fxBody()) });
              const [stock, cur] = await Promise.all([api('/api/admin/stock'), api('/api/admin/currency')]);
              set({ stockProducts: stock, currency: cur, fx: fxInit(cur) });
              flash(`1 $ = ${M(r.newRate)} so'm · ${r.changed} ta narx yangilandi`);
            } catch (e) { fxSet({ busy: false }); flash(e.message); }
          }
        }
      });
    }
    async function fxCbu() {
      fxSet({ cbuBusy: true });
      try {
        const c = await api('/api/admin/currency/cbu');
        fxSet({ rate: String(c.rate), cbu: c, cbuBusy: false, preview: null });
        flash(`Markaziy bank kursi: ${M(c.rate)} so'm · ${c.date || 'bugun'}`);
      } catch (e) { fxSet({ cbuBusy: false }); flash(e.message); }
    }

  </div>` : ''}

  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:flex-end">

    ${field('mDef', 'STANDART MARJA', f.mDef, '%', '15')}
    ${field('mUsta', 'USTA MARJASI', f.mUsta, '%', '12')}

  ${f.cbu ? `<div style="font:400 10px var(--fm);color:var(--dim2);margin-top:7px">Markaziy bank: ${M(f.cbu.rate)} so'm · ${esc(f.cbu.date || '')} · kiritildi, qo'llash uchun tasdiqlang</div>` : ''}

  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px">

      }).join('')}

    /* ═══ Usta arizalari ═══ */
    async function ustaRefresh() {
      try {

        set({ ustas: Array.isArray(ustas) ? ustas : [], kpiData: kpis });
      } catch (e) { flash(e.message); }

    async function ustaSetStatus(u, status) {
      let note = u.admin_note || '';
      if (status === 'Rad etildi') {
        const r = typeof prompt === 'function' ? prompt('Rad etish sababi (mijozga ko‘rinadi):', note) : note;
        if (r === null) return;
        note = r;
      }
      try {
        await api('/api/admin/ustas/' + u.id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status, admin_note: note }) });
        flash(status === 'Tasdiqlangan' ? `${u.name} usta sifatida tasdiqlandi — endi usta narxlarini ko'radi` : `${u.name}: ${status.toLowerCase()}`);
        ustaRefresh();
      } catch (e) { flash(e.message); }
    }

    async function cmtHide(c, hidden) {

    async function cmtRemove(c) {

      try {
        await api('/api/admin/story-comments/' + c.id, { method: 'DELETE' });
        set({
          storyCmts: S.storyCmts.filter(x => x.id !== c.id),
          storyList: S.storyList.map(st => st.id === c.story_id ? { ...st, comments: Math.max(0, (+st.comments || 0) - 1) } : st)
        });
        flash('Izoh o‘chirildi');
      } catch (err) { flash(err.message); }
    }
    function mStoryCmts() {

      const when = ts => { const d = new Date(String(ts || '').replace(' ', 'T') + 'Z'); return isNaN(d) ? '' : d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); };

        <div style="display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--fill);${c.hidden ? 'opacity:.55' : ''}">
          <div style="flex:none;width:32px;height:32px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font:600 13px var(--fm)">${esc(String(c.name || '?').charAt(0).toUpperCase())}</div>

          <div style="flex:1;min-width:0">
            <div style="font:600 9.5px var(--fm);color:var(--dim2);letter-spacing:.05em">SANA</div>
            <div style="margin-top:5px;border:1px solid var(--line3);border-radius:14px;padding:9px 10px;background:var(--tile)">
              <input data-k="cDate" value="${esc(v.cDate)}" oninput="${h(v.setCDate)}" placeholder="12-avgust" style="width:100%;border:none;outline:none;background:transparent;color:var(--fg);font:400 12px var(--fb)">
            </div>
          </div>
        </div>
        <div>
          <div style="font:600 9.5px var(--fm);color:var(--dim2);letter-spacing:.05em">JIHOZ TEGLARI</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">
            ${v.cTagOpts.map(tg => `<div onclick="${h(tg.go)}" style="font:500 10px var(--fm);padding:6px 9px;border-radius:7px;cursor:pointer;border:1px solid ${tg.border};background:${tg.bg};color:${tg.fg}">${tg.name}</div>`).join('')}
          </div>
        </div>
        <div>
          <div style="font:600 9.5px var(--fm);color:var(--dim2);letter-spacing:.05em">IZOH</div>
          <div style="margin-top:5px;border:1px solid var(--line3);border-radius:14px;padding:9px 10px;background:var(--tile)">
            <input data-k="cText" value="${esc(v.cText)}" oninput="${h(v.setCText)}" placeholder="Nima yopildi, arxiv qancha" style="width:100%;border:none;outline:none;background:transparent;color:var(--fg);font:400 12px var(--fb)">
          </div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:15px;padding:10px 11px">
          <div>
            <div style="font:600 11.5px var(--fb)">Darhol nashr qilish</div>
            <div style="font:400 9.5px var(--fm);color:var(--dim2);margin-top:3px">O'chirilsa qoralama bo'lib qoladi</div>
          </div>
          <div onclick="${h(v.toggleCLive)}" style="flex:none;cursor:pointer;width:42px;height:24px;border-radius:20px;background:${v.cLiveTrack};padding:3px;display:flex;justify-content:${v.cLiveKnob};transition:background .18s ease">
            <div style="width:18px;height:18px;border-radius:50%;background:${v.cLiveKnobBg}"></div>
          </div>
        </div>
        <div style="display:flex;gap:8px;margin-top:2px">
          <div onclick="${h(v.saveStory)}" style="flex:1;text-align:center;background:var(--acc);color:#ffffff;border-radius:15px;padding:12px;font:600 12.5px var(--fb);cursor:pointer">${v.saveLabel}</div>
          ${v.editing ? `<div onclick="${h(v.newStory)}" style="flex:none;padding:12px 13px;border-radius:15px;border:1px solid var(--line3);color:var(--dim);font:500 11.5px var(--fb);cursor:pointer">Bekor</div>` : ''}
        </div>
      </div>
    </div>
  </div>
</div>`;
    }

    function mStats(v) {
      return `
<div style="margin-top:20px;display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start">
  <div style="border:1px solid var(--line);border-radius:20px;padding:18px;background:var(--card);box-shadow:var(--shadow);border-color:transparent">
    <div style="font:600 13px var(--fb)">Oylik savdo · mln so'm</div>
    <div style="display:flex;align-items:flex-end;gap:14px;height:210px;margin-top:20px">
      ${v.bars.map(b => `
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;justify-content:flex-end;height:100%">
          <div style="font:600 10px var(--fm);color:var(--dim3)">${b.value}</div>
          <div style="width:100%;border-radius:6px 6px 0 0;background:${b.fill};height:${b.h}"></div>
          <div style="font:500 10px var(--fm);color:var(--dim2)">${b.label}</div>
        </div>`).join('')}
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:12px">
    ${v.topList.map(t => `
      <div style="border:1px solid var(--line);border-radius:18px;padding:13px 14px;background:var(--card);box-shadow:var(--shadow);border-color:transparent">
        <div style="display:flex;justify-content:space-between;font:600 12px var(--fb)">
          <span>${t.name}</span><span style="font-family:var(--fm)">${t.qty}</span>
        </div>
        <div style="height:5px;border-radius:3px;background:var(--line);margin-top:9px;overflow:hidden"><div style="height:100%;background:var(--acc);width:${t.w}"></div></div>
      </div>`).join('')}
  </div>
</div>`;
    }

    function mNote(v) {
      return `
<div role="dialog" aria-modal="true" aria-label="Mijozga xabar" style="position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:24px">
  <div style="width:100%;max-width:460px;background:var(--bar);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 24px 60px rgba(0,0,0,.5)">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
      <div>
        <div style="font:600 15px var(--fb)">Mijozga xabar</div>
        <div style="font:400 10.5px var(--fm);color:var(--dim2);margin-top:4px">${v.noteHead}</div>
      </div>
      <button type="button" aria-label="Yopish" onclick="${h(v.noteSkip)}" style="flex:none;width:30px;height:30px;border-radius:14px;border:1px solid var(--line3);display:flex;align-items:center;justify-content:center;font:600 12px var(--fm);color:var(--dim);cursor:pointer">✕</button>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:14px">
      ${v.noteTemplates.map(nt => `<div onclick="${h(nt.go)}" style="font:500 10.5px var(--fm);color:var(--fg2);background:var(--fill);border:1px solid var(--line);padding:7px 9px;border-radius:7px;cursor:pointer">${nt.name}</div>`).join('')}
    </div>
    <div style="margin-top:11px;border:1px solid var(--line3);border-radius:17px;padding:12px;background:var(--tile)">
      <textarea data-k="noteText" oninput="${h(v.setNoteText)}" placeholder="Masalan: Usta ertaga 10:00 da yetib boradi" style="width:100%;min-height:76px;resize:none;border:none;outline:none;background:transparent;color:var(--fg);font:400 12.5px/1.5 var(--fb)">${esc(v.noteText)}</textarea>
    </div>
    <div style="display:flex;align-items:center;gap:11px;margin-top:12px;padding:11px 12px;border-radius:17px;border:1px solid var(--line);background:var(--card)">
      <div style="flex:none;font:600 10px var(--fm);color:${v.noteStFg};background:${v.noteStBg};padding:5px 8px;border-radius:5px">${v.noteStatus}</div>
      <div style="flex:1;min-width:0;font:400 10.5px var(--fm);color:var(--dim2)">${v.noteClient}</div>
    </div>
    <div style="display:flex;gap:9px;margin-top:14px">
      <div onclick="${h(v.noteSkip)}" style="flex:none;padding:13px 15px;border-radius:17px;border:1px solid var(--line3);color:var(--fg2);font:600 12px var(--fb);cursor:pointer">Xabarsiz saqlash</div>
      <div onclick="${h(v.noteSend)}" style="flex:1;text-align:center;padding:13px;border-radius:17px;background:var(--acc);color:#ffffff;font:600 12.5px var(--fb);cursor:pointer">Yuborish</div>
    </div>
  </div>
</div>`;
    }

    /* ═══ RENDER ═══ */
    const ROOT = document.getElementById('root');
    let _scroll = 0;
    function render() {
      const act = document.activeElement, fk = act && act.dataset ? act.dataset.k : null;
      const fs = fk ? act.selectionStart : null, fe = fk ? act.selectionEnd : null;
      H = [];
      if (document.documentElement) document.documentElement.setAttribute('data-theme', adTheme());
      const v = vals();
      const toast = v.toastOn ? `<div class="ad-toast" role="status"><span class="dot">${aic('check', 14, 3)}</span><span>${esc(v.toast)}</span></div>` : '';
      if (!v.isLoggedIn) {
        ROOT.innerHTML = mLogin(v) + toast;
        if (fk) { const el = ROOT.querySelector('[data-k="' + fk + '"]'); if (el) { el.focus(); try { el.setSelectionRange(fs, fe); } catch (e) { } } }
        return;
      }
      const night = adTheme() === 'night';
      ROOT.innerHTML = `
<div style="height:100%;position:relative;display:flex;background:var(--bg);color:var(--fg)">
  <div id="side-backdrop" class="${v.sideOpen ? 'open' : ''}" onclick="${h(v.closeSide)}" style="position:fixed;inset:0;background:rgba(20,19,17,.45);backdrop-filter:blur(3px);z-index:55"></div>
  ${mSide(v)}
  <div style="flex:1;min-width:0;display:flex;flex-direction:column">
    ${v.isOffline ? `<div style="background:var(--red);color:#fff;text-align:center;padding:8px 12px;font:600 12.5px var(--fb);position:sticky;top:0;z-index:99">Internet aloqasi yo'q — oflayn rejim</div>` : ''}
    <header class="ad-top">
      <div style="display:flex;align-items:center;gap:12px;min-width:0">
        <button onclick="${h(v.toggleSide)}" class="burger-btn ad-icon" aria-label="Menyu">${aic('menu', 18, 2)}</button>
        <div style="min-width:0"><h1 class="ad-title">${esc(v.adminTitle)}</h1><div class="ad-sub">${esc(v.adminSub)}</div></div>
      </div>
      <div class="ad-actions">
        <a href="/app" target="_blank" rel="noopener" class="ad-btn g" style="text-decoration:none">Mijoz ilovasi ${aic('ext', 15, 2)}</a>
        <button onclick="${h(v.exportCsv)}" class="ad-btn g">${aic('download', 16, 2)} CSV</button>
        <button onclick="${h(adToggleTheme)}" class="ad-icon" aria-label="Mavzu" title="${night ? 'Kunduzgi' : 'Tungi'} mavzu">${aic(night ? 'sun' : 'moon', 18, 2)}</button>
        <button onclick="${h(v.goProducts)}" class="ad-btn p">${aic('plus', 16, 2.4)} Mahsulot</button>
      </div>
    </header>
    <div style="flex:1;overflow:auto;padding:24px 28px 32px" id="scroller">
      <div class="ad-kpis">
        ${v.kpis.map((k, i) => `
          <div class="ad-kpi">
            <span class="ico">${aic(KPI_IC[i] || 'chart', 19)}</span>
            <div class="kl">${esc(k.label)}</div>
            <div class="kv">${k.value}</div>
            <div class="kd" style="color:${k.dFg}">${k.delta}</div>
          </div>`).join('')}
      </div>
      ${v.aOrders ? mOrders(v) : ''}
      ${v.aCallbacks ? mCallbacks(v) : ''}
      ${v.aProducts ? mProducts(v) : ''}
      ${v.aCredit ? mCredit(v) : ''}
      ${v.aSettings ? mSettings(v) : ''}
      ${v.aStories ? mStories(v) : ''}
      ${v.aStats ? mStats(v) : ''}
      ${v.aInstall ? mInstall(v) : ''}
      ${v.aClients ? mClients(v) : ''}
      ${v.aUstas ? mUstas() : ''}
    </div>
  </div>
  ${v.noteOn ? mNote(v) : ''}
  ${v.confirmOn ? mConfirm(v) : ''}
  ${toast}
</div>`;
      const sc = document.getElementById('scroller'); if (sc) sc.scrollTop = _scroll;
      if (fk) { const el = ROOT.querySelector('[data-k="' + fk + '"]'); if (el) { el.focus(); try { el.setSelectionRange(fs, fe); } catch (e) { } } }
    }
    ROOT.addEventListener('scroll', e => { if (e.target.id === 'scroller') _scroll = e.target.scrollTop; }, true);
    const _origSet = set;
    window.set = function (o) { const t = S.adminTab; _origSet(o); if (S.adminTab !== t) { _scroll = 0; const sc = document.getElementById('scroller'); if (sc) sc.scrollTop = 0; } };

    async function initAdmin() {
      if (S.token) {
        try {
          await bootstrap();
        } catch (e) {
          logout();
          return;
        }
      }
      render();
    }
    initAdmin();
  </script>
</body>

</html>
