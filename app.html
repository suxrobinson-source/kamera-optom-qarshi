  <script>
    function _showFatalCrash(msg) {
      const el = document.getElementById('app');
      if (el && (!el.children.length || el.querySelector('#app-initial-loader'))) {
        el.innerHTML = '<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;color:var(--fg,#eef2f1);font-family:sans-serif;text-align:center;background:var(--bg,#0e1112)"><div style="width:54px;height:54px;border-radius:18px;background:rgba(255,77,61,.15);color:#ff4d3d;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;margin-bottom:14px">!</div><div style="font-weight:700;font-size:16px">Ilova yuklanishida xatolik</div><div style="font-size:11.5px;color:var(--dim,#8a9694);margin-top:8px;max-width:260px">' + (msg || 'Kutilmagan xatolik yuz berdi') + '</div><button onclick="try{localStorage.clear();}catch(e){}location.reload()" style="margin-top:20px;padding:12px 24px;background:var(--acc,#ff4f12);color:#fff;border:none;border-radius:99px;font-weight:700;font-size:13px;cursor:pointer">Qayta yuklash (Reset)</button></div>';
      }
    }
    window.onerror = function (msg, url, line, col, err) {
      console.error('App runtime error:', msg, err);
      _showFatalCrash(msg);
    };
    window.addEventListener('unhandledrejection', function (e) {
      console.error('Unhandled rejection:', e.reason);
      if (!window.DATA || !window.DATA.ready) {
        _showFatalCrash(e.reason && e.reason.message ? e.reason.message : 'Server bilan aloqa uzildi');
      }
    });
    /* ═══════════════════════════════════════════════════════════
       KAMERA OPTOM QARSHI — mijoz ilovasi
       "Signal" dizayni
       ═══════════════════════════════════════════════════════════ */
    const A = 'var(--acc)', RED = '#ff4d3d', AMB = '#ffb020';
    const M = n => n.toLocaleString('ru-RU').replace(/,/g, ' ');
    // Statik rasmlar: github.io'da API server manzili qo'shiladi (config.js)
    const KA = p => ((typeof window !== 'undefined' && window.KO_API) || '') + p;
    const fmt = n => M(n) + " so'm";
    const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    const DATA = {
      products: [],
      banners: [],
      stories: [],
      regions: [],
      categories: [],
      config: null,
      ready: false,
      error: null
    };

    async function j(url, opt = {}) {
      const r = await fetch(url, opt);
      if (!r.ok) {
        const errData = await r.json().catch(() => ({}));
        throw new Error(errData.error || ('HTTP ' + r.status));
      }
      return r.json();
    }

    async function bootstrap() {
      try {
        const [products, banners, stories, regions, categories, config] = await Promise.all([
          j('/api/products'),
          j('/api/banners'),
          j('/api/stories?cid=' + storyCid()),
          j('/api/regions'),
          j('/api/categories').catch(() => []),
          j('/api/config')
        ]);
        DATA.products = (products || []).map(p => ({
          ...p,
          stock: 'Omborda ' + (p.qty ?? 0)
        }));
        DATA.banners = banners || [];
        DATA.stories = (stories || []).map(s => ({
          ...s,
          views: s.views != null ? (typeof s.views === 'number' ? M(s.views) : s.views) : '0'
        }));
        DATA.regions = regions || [];
        DATA.categories = categories || [];
        DATA.config = config || {};
        const dbPromo = {};
        DATA.products.forEach(p => { if (p.promo) dbPromo[p.sku] = p.promo; });
        if (Object.keys(dbPromo).length) S.promo = dbPromo;
        DATA.ready = true;
        DATA.error = null;

        if (config && config.modules) {
          S.mod = { ...(S.mod || {}), ...config.modules };
        }
        if (config && config.credit && config.credit.rates) {
          S.rates = config.credit.rates;
        }
        if (config && config.credit && config.credit.down) {
          S.down = config.credit.down;
        }
        await syncMyOrders();
        await syncUsta();
      } catch (e) {
        DATA.error = 'Ma\'lumot yuklanmadi — internetni tekshiring';
      }
      render();
    }

    async function syncMyOrders() {
      if (!S.myPhone) return;
      const rawPh = String(S.myPhone).replace(/[^0-9]/g, '');
      if (rawPh.length !== 9) return;
      try {
        const orders = await j('/api/orders/my?phone=' + rawPh);
        if (Array.isArray(orders)) {
          const orderStatus = { ...S.orderStatus };
          const notes = { ...S.notes };
          const myOrders = orders.map(o => {
            orderStatus[o.id] = o.status || 'Yangi';
            if (o.note) {
              notes[o.id] = { text: o.note, time: o.updated_at ? o.updated_at.slice(5, 16) : 'Menejer xabari' };
            }
            const itemStr = (Array.isArray(o.items) && o.items.length)
              ? o.items.map(it => (it.name || it.sku) + (it.qty > 1 ? ' × ' + it.qty : '')).join(', ')
              : (o.region || 'Buyurtma');
            const skus = Array.isArray(o.items) ? o.items.map(it => [it.sku, it.qty]) : [['IPC-2410', 1]];
            const dStr = o.created_at ? o.created_at.slice(0, 10) : 'Bugun';
            return {
              id: o.id,
              name: itemStr,
              date: dStr,
              sum: fmt(o.total || o.goods_sum || 0),
              status: (o.status || 'Yangi').toUpperCase(),
              skus,
              addr: o.address ? `${o.region || ''} · ${o.address}` : (o.region || ''),
              rcp: o.recipient_name ? `${o.recipient_name} · +998 ${o.recipient_phone}` : `+998 ${o.phone}`,
              install: o.install,
              install_at: o.install_at,
              cloud: o.cloud
            };
          });
          set({ myOrders, orderStatus, notes });
        }
      } catch (e) { }
    }

    function _loadStorage(key, def) {
      try {
        const val = localStorage.getItem(key);
        return val ? JSON.parse(val) : def;
      } catch (e) {
        return def;
      }
    }
    function _loadStr(key, def) {
      try {
        const val = localStorage.getItem(key);
        return val != null ? val : def;
      } catch (e) {
        return def;
      }
    }

    const S = {
      tab: 'home', sel: null, cat: '', poe: false, mp: false, night: false,

      mod: { banners: true, stories: true, gps: true, memory: true, cable: true, install: true, cloud: true },
      install: false, cloud: false, toast: null, hdd: '64 GB', creditTerm: 12,
      rates: { 3: 0, 6: 8, 12: 14, 24: 26 }, rateOn: { 3: true, 6: true, 12: true, 24: true }, down: { 3: 0, 6: 10, 12: 20, 24: 30 },
      q: '', sort: 'price-asc', view: 'grid', suggest: false, filters: false, band: null,
      recent: _loadStorage('ko_recent', ['4MP', 'PoE', 'komplekt']), theme: _loadStr('ko2_theme', 'day'), creditService: true, expertService: true,
      cb: 'idle', cbName: '', cbPhone: '', cbNote: '', cbSlot: 'Tezroq', topic: null, channel: 'Telefon', expStep: 1,
      hddUse: false, creditUse: false, bag: _loadStorage('ko_bag', {}), added: null, ok: null, story: null, cmt: null, cname: _loadStr('ko_cname', ''), seen: _loadStorage('ko_seen', {}),
      ph: null, phVal: '', phStep: 'enter', myPhone: _loadStr('ko_my_phone', null),
      storyList: [
        { id: 'st-dokon', label: "Do'kon · Qarshi", mark: '▤', title: "Savdo do'koni · 8 kamera", meta: "Qarshi sh. · Mustaqillik ko'chasi", dur: '0:42', views: 1240, tags: ['8 kamera', 'NVR 4TB', 'Kassa zonasi'], text: "Kassa, ombor va kirish zonasi to'liq yopildi. Egasi telefonidan jonli ko'rib turadi." },
        { id: 'st-hovli', label: 'Hovli · Koson', mark: '▭', title: 'Xususiy hovli · 4 kamera', meta: 'Koson tumani', dur: '0:36', views: 890, tags: ['4 kamera', 'Tungi rejim', 'IP67'], text: "Darvoza, hovli va garaj. Yomg'ir va sovuqqa chidamli tashqi kameralar." },
        { id: 'st-ombor', label: 'Ombor · Shahrisabz', mark: '◉', title: 'Ombor · aylanuvchi kamera', meta: 'Shahrisabz sh.', dur: '0:51', views: 1570, tags: ['PTZ 360°', 'Avto kuzatuv'], text: "Bitta aylanuvchi kamera butun omborni qamrab oladi va harakatni o'zi kuzatadi." },
        { id: 'st-kafe', label: 'Kafe · Qarshi', mark: '◍', title: 'Kafe · ichki nazorat', meta: 'Qarshi sh. · markaz', dur: '0:29', views: 760, tags: ['Ovozli aloqa', '2 qavat'], text: 'Zal va oshxona. Ovozli aloqa orqali xodimlar bilan gaplashish mumkin.' },
        { id: 'st-maktab', label: "Maktab · G'uzor", mark: '⌸', title: 'Maktab · domofon va kamera', meta: "G'uzor tumani", dur: '1:04', views: 2110, tags: ['Domofon', '12 kamera'], text: 'Kirish eshigi domofon bilan, koridorlar va hovli kameralar bilan yopildi.' },
        { id: 'st-turargoh', label: 'Avtoturargoh', mark: '▦', title: "Avtoturargoh · raqam o'qish", meta: 'Qarshi sh.', dur: '0:47', views: 1330, tags: ['ColorVu', 'Tungi rangli'], text: "Tunda ham rangli tasvir. Avtomobil raqamlari aniq o'qiladi." }
      ],
      bagOpen: false, bagInstall: false, bagCloud: false, provider: 'Uzum Nasiya',
      provOn: { 'Uzum Nasiya': true, 'Alif Nasiya': true, 'Hamkor Nasiya': true },
      region: _loadStr('ko_region', 'Qarshi shahri'), regionOpen: false, bannerIdx: 0, rq: '', gpsState: 'idle',
      orderStatus: {}, notes: {}, myOrders: _loadStorage('ko_my_orders', []), openOrd: null, profPage: '', lang: _loadStr('ko2_lang', 'uz'),
      pushOn: true, promoPushOn: false, spinDeg: 0, spinning: false,
      addrList: _loadStorage('ko_addr_list', [{ id: 'a1', label: 'Uy', text: "Qarshi sh., Mustaqillik ko'chasi 12, 4-xonadon", note: 'Kirish eshigi kodi 1204' }]),
      addrSel: _loadStr('ko_addr_sel', 'a1'), addrForm: false, naLabel: 'Uy', naText: '', naNote: '',
      rcpSelf: true, rcpName: '', rcpPhone: '',
      smartTour: false, tourStep: 0,
      usta: null, uf: null
    };
    window.S = S;
    window.DATA = DATA;

    /* ── handler registry ── */

    /* ═══ Bosh sahifa FX dvigateli ═══
       render() #app ichini to'liq qayta yozadi, shuning uchun harakat holati
       doimiy #app elementidagi CSS o'zgaruvchilarida (--now, --sy, --ex, --ey)
       va shu _fx obyektida saqlanadi. */
    const _fx = {
      introKey: '', seen: new Set(), io: null, countAt: 0,
      bnIdx: null, bnAt: Date.now(),
      px: 0, py: 0, pAt: 0, ex: 0, ey: 0, sy: -1,
      tiltEl: null, hover: false, tx: 0, ty: 0, cx: 0, cy: 0,

    _fx.noIO = _fx.reduced || typeof IntersectionObserver === 'undefined';
    const rvc = k => (_fx.noIO || _fx.seen.has(k)) ? 'rv in' : 'rv';

    const TW_PHRASES = ['4MP tashqi kamera', 'PoE komplekt 8 kanal', 'Tungi rangli ColorVu', 'Wi-Fi aylanuvchi kamera', 'Domofon va aqlli qulf'];
    function twText(now) {
      const per = 3400, s = trStr(TW_PHRASES[Math.floor(now / per) % TW_PHRASES.length]), t = now % per;
      const n = t < 1500 ? Math.ceil(s.length * t / 1500) : t < 2800 ? s.length : Math.max(0, Math.ceil(s.length * (1 - (t - 2800) / 600)));
      return s.slice(0, n);
    }

    function fxFrame() {
      requestAnimationFrame(fxFrame);
      if (document.hidden || S.tab !== 'home' || !APP.style || !APP.style.setProperty) return;
      const now = Date.now();
      const sc = document.getElementById('scroller');
      const sy = sc ? sc.scrollTop : 0;
      if (sy !== _fx.sy) { _fx.sy = sy; APP.style.setProperty('--sy', sy); }

      /* linza qorachig'i: kursor/barmoqqa qaraydi, jim tursa hududni "skanerlaydi" */
      let gx = Math.sin(now / 1400) * .75, gy = Math.sin(now / 900) * .35;
      const eye = APP.querySelector('.eye');
      if (eye && now - _fx.pAt < 2500) {
        const r = eye.getBoundingClientRect();
        const dx = _fx.px - (r.left + r.width / 2), dy = _fx.py - (r.top + r.height / 2), d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 160);
        gx = dx / d * k; gy = dy / d * k;
      }
      _fx.ex += (gx - _fx.ex) * .08; _fx.ey += (gy - _fx.ey) * .08;
      APP.style.setProperty('--ex', _fx.ex.toFixed(3));
      APP.style.setProperty('--ey', _fx.ey.toFixed(3));

      const tw = APP.querySelector('.tw');
      if (tw) { const s = twText(now); if (tw.textContent !== s) tw.textContent = s; }

      /* 3D qiyalik — yumshoq inersiya bilan */
      const el = _fx.tiltEl;
      if (el) {
        if (!el.isConnected) { _fx.tiltEl = null; }
        else {
          _fx.cx += (_fx.tx - _fx.cx) * .14; _fx.cy += (_fx.ty - _fx.cy) * .14;
          el.style.setProperty('--tx', _fx.cx.toFixed(3)); el.style.setProperty('--ty', _fx.cy.toFixed(3));
          if (!_fx.hover && Math.abs(_fx.cx) + Math.abs(_fx.cy) < .004) { fxTiltReset(el); _fx.tiltEl = null; }
        }
      }

      if (_fx.countAt) {
        const p = Math.min(1, (now - _fx.countAt) / 1400), e = 1 - Math.pow(1 - p, 3);
        APP.querySelectorAll('[data-count]').forEach(n => { const val = String(Math.round(+n.dataset.count * e)); if (n.textContent !== val) n.textContent = val; });
        if (p >= 1) _fx.countAt = 0;
      }
    }
    function fxTiltReset(el) { el.style.removeProperty('--tx'); el.style.removeProperty('--ty'); el.classList.remove('hov'); }

    function fxAfterRender() {
      if (_fx.noIO || S.tab !== 'home' || !APP.querySelectorAll) return;
      if (_fx.io) _fx.io.disconnect();
      _fx.io = new IntersectionObserver(ents => ents.forEach(en => {
        if (!en.isIntersecting) return;
        const node = en.target;
        node.classList.add('in'); _fx.seen.add(node.dataset.rv);
        if (node.querySelector('[data-count]')) _fx.countAt = Date.now();
        _fx.io.unobserve(node);
      }), { root: document.getElementById('scroller'), threshold: .18, rootMargin: '0px 0px -6% 0px' });
      APP.querySelectorAll('.rv:not(.in)').forEach(n => _fx.io.observe(n));
    }

    if (!_fx.reduced && typeof requestAnimationFrame === 'function' && typeof document !== 'undefined' && document.addEventListener) {
      document.addEventListener('pointermove', e => {
        _fx.px = e.clientX; _fx.py = e.clientY; _fx.pAt = Date.now();
        if (e.pointerType === 'touch') return;
        const el = e.target && e.target.closest ? e.target.closest('.tilt') : null;

        if (el) {

      requestAnimationFrame(fxFrame);
    }

    let _wzLast = null;

    function wzState() {
      return Object.assign({ step: 0, place: null, zones: {}, night: 'color', conn: 'auto', days: 7, budget: 'mid', install: true, alt: {} }, S.wz || {});
    }
    function wzSet(patch) { set({ wz: { ...wzState(), ...patch } }); }

    function wzPlan(w) {
      const PRODUCTS = DATA.products || [];
      const place = WZ_PLACES.find(p => p.id === w.place) || WZ_PLACES[1];
      const counts = { out: 0, in: 0, ptz: 0 }, where = { out: [], in: [], ptz: [] };
      Object.keys(w.zones || {}).forEach(z => {
        const n = +w.zones[z] || 0, Z = WZ_ZONES[z];
        if (n > 0 && Z) { counts[Z.t] += n; where[Z.t].push(Z.n + (n > 1 ? ' ×' + n : '')); }
      });
      const cams = counts.out + counts.in + counts.ptz;
      const wired = w.conn === 'wired' || (w.conn === 'auto' && (cams >= 5 || place.id === 'om'));
      const color = w.night === 'color';
      const txt = p => p.name + ' ' + (p.spec || '') + ' ' + (p.tags || []).join(' ');
      const alt = w.alt || {};
      const pick = (pool, key) => {
        if (!pool.length) return null;
        const base = pool.length <= 1 ? 0 : Math.round((w.budget === 'eco' ? 0 : w.budget === 'pro' ? .85 : .45) * (pool.length - 1));
        const i = Math.max(0, Math.min(pool.length - 1, base + (alt[key] || 0)));
        return { p: pool[i], i, n: pool.length };
      };
      const lines = [];
      ['out', 'in', 'ptz'].forEach(t => {
        if (!counts[t]) return;
        let pool = PRODUCTS.filter(p => p.cat === WZ_TYPE[t].cat && (p.qty ?? 1) > 0);
        if (!pool.length) pool = PRODUCTS.filter(p => ['Tashqi', 'Ichki', 'Aylanuvchi'].includes(p.cat));
        let f = pool.filter(p => wired ? p.poe : !p.poe); if (f.length) pool = f;
        if (color) { f = pool.filter(p => /rangli|color/i.test(txt(p))); if (f.length) pool = f; }
        pool = [...pool].sort((a, b) => a.price - b.price);
        const pk = pick(pool, t);
        if (!pk) return;
        const isColor = /rangli|color/i.test(txt(pk.p));
        lines.push({
          key: t, title: WZ_TYPE[t].n, where: where[t].join(', '), p: pk.p, q: counts[t], sum: pk.p.price * counts[t],
          canDown: pk.i > 0, canUp: pk.i < pk.n - 1,
          why: WZ_TYPE[t].why + (isColor ? ' · tunda ham rangli' : pk.p.night ? ' · tungi IR ko‘rish' : '')
        });
      });
      if (wired && cams) {
        const ch = p => { const m = String(p.sku).match(/NVR-(\d)(\d{2})/); return m ? parseInt(m[2], 10) : 0; };
        let recs = PRODUCTS.filter(p => p.cat === 'Yozuvchi' && ch(p) >= cams);
        if (recs.length) {
          const minCh = Math.min(...recs.map(ch));
          recs = recs.filter(p => ch(p) === minCh).sort((a, b) => a.price - b.price);
          const pk = pick(recs, 'rec');
          lines.push({
            key: 'rec', title: 'Registrator (NVR)', where: minCh + ' kanal · barcha yozuv bir joyda', p: pk.p, q: 1, sum: pk.p.price,
            canDown: pk.i > 0, canUp: pk.i < pk.n - 1, why: 'yozuvni saqlaydi va telefondan ko‘rishni ta’minlaydi'
          });
        }
      }
      const HDD = (DATA.config && DATA.config.pricing && DATA.config.pricing.hddOptions) || [];
      let sd = null;
      if (!wired && cams && HDD.length) {
        const c = HDD[Math.min(HDD.length - 1, w.days >= 14 ? 4 : w.days >= 7 ? 3 : 2)];
        if (c && c.sku) {
          sd = c;
          lines.push({
            key: 'sd', title: 'microSD xotira', where: 'har kameraga bittadan · ' + c.days + ' uzluksiz arxiv',
            p: { sku: c.sku, name: 'microSD ' + c.size, cat: 'Xotira', price: c.price }, q: cams, sum: c.price * cams,
            why: 'yozuv kameraning o‘zida saqlanadi, internet uzilsa ham yo‘qolmaydi'
          });
        }
      }
      const pricing = (DATA.config && DATA.config.pricing) || {};
      const cableM = wired ? cams * place.m : 0;
      const cablePrice = cableM * (pricing.cablePerMeter || 9000);
      const install = w.install && cams ? cams * (pricing.installPerCamera || 250000) : 0;
      const goods = lines.reduce((n, l) => n + l.sum, 0);
      const total = goods + install;
      const rate = (S.rates && S.rates[12]) || 0;
      const monthly = Math.round(total * (1 + rate / 100) / 12 / 1000) * 1000;
      const reasons = [
        wired ? `Simli (PoE) tizim: bitta kabel orqali quvvat va internet — ${cams} ta kamera uzilishlarsiz ishlaydi` : 'Wi-Fi tizim: kabel tortish deyarli shart emas, hammasini telefon ilovasida ko‘rasiz',
        color ? 'Tunda ham rangli tasvir — odam, kiyim va mashina rangini aniq ajratasiz' : 'Tungi IR ko‘rish — tunda oq-qora, lekin aniq tasvir',
        wired ? 'Yozuv registratorda saqlanadi; HDD disk hajmini mutaxassis siz bilan kelishadi' : (sd ? `Har kamerada microSD — ${sd.days} uzluksiz arxiv` : 'Yozuv kamera xotirasida saqlanadi'),
        { eco: 'Tejamkor modellar — narx/sifat eng maqbul', mid: 'Narx va sifat muvozanati — eng ko‘p tanlanadigan variant', pro: 'Premium — yuqori aniqlik va aqlli funksiyalar' }[w.budget] || ''
      ];
      return { place, cams, counts, wired, color, lines, sd, cableM, cablePrice, install, goods, total, monthly, reasons, skus: lines.map(l => [l.p.sku, l.q]) };
    }

    function kitSwitch() {
      const smart = S.kitMode !== 'manual';
      return `<div class="seg"><button class="${smart ? 'on' : ''}" onclick="${h(() => set({ kitMode: 'smart' }))}"><span style="display:inline-flex;align-items:center;gap:6px">${ic('spark', 16, 2)}Aqlli yordamchi</span></button><button class="${smart ? '' : 'on'}" onclick="${h(() => set({ kitMode: 'manual' }))}"><span style="display:inline-flex;align-items:center;gap:6px">${ic('filter', 16, 2)}O‘zim yig‘aman</span></button></div>`;
    }

    function mKitSmart(v) {

      const choose = (k, val) => wzSet({ [k]: val, step: w.step + 1 });
      const opt = (k, o, i) => `
      <button class="opt ${w[k] === o.v ? 'on' : ''}" style="--i:${i}" onclick="${h(() => choose(k, o.v))}">

        <span class="opt-b"><span class="opt-t" style="display:block">${esc(o.n)}${o.rec ? ' <span class="tag soft" style="vertical-align:2px">tavsiya</span>' : ''}</span><span class="opt-s" style="display:block">${esc(o.s)}</span></span>
        <span class="rad ${w[k] === o.v ? 'on' : ''}"></span>
      </button>`;
      const OPTS = {
        night: [{ v: 'color', n: 'Rangli', s: 'Tunda ham rangli, aniq tasvir', ic: 'sun', rec: 1 }, { v: 'ir', n: 'Oq-qora (IR)', s: 'Arzonroq, tunda oq-qora tasvir', ic: 'moon' }],
        conn: [{ v: 'auto', n: 'Siz tanlang', s: 'Obyektingizga qarab eng to‘g‘risini tanlayman', ic: 'spark', rec: 1 }, { v: 'wifi', n: 'Wi-Fi (simsiz)', s: 'Tez o‘rnatiladi · 1–4 kamera uchun qulay', ic: 'radar' }, { v: 'wired', n: 'Simli (PoE)', s: 'Eng ishonchli · ko‘p kamera va katta hudud uchun', ic: 'cable' }],
        days: [{ v: 3, n: '3–4 kun', s: 'Kvartira va kichik obyekt uchun yetarli', ic: 'clock' }, { v: 7, n: '1 hafta', s: 'Ko‘pchilik mijozlar shuni tanlaydi', ic: 'clock', rec: 1 }, { v: 14, n: '2 hafta va ko‘proq', s: 'Do‘kon, ombor va hisobot uchun', ic: 'clock' }],
        budget: [{ v: 'eco', n: 'Tejamkor', s: 'Eng arzon ishonchli modellar', ic: 'cash' }, { v: 'mid', n: 'Muvozanat', s: 'Narx va sifat eng maqbul nisbatda', ic: 'star', rec: 1 }, { v: 'pro', n: 'Premium', s: 'Yuqori aniqlik va aqlli funksiyalar', ic: 'shield' }],
        install: [{ v: true, n: 'Ha, usta o‘rnatsin', s: fmt(pricing.installPerCamera || 250000) + ' / kamera · 1 kun ichida', ic: 'tool', rec: 1 }, { v: false, n: 'Yo‘q, o‘zim o‘rnataman', s: 'Qo‘llanma va video yo‘riqnoma beramiz', ic: 'user' }]
      };

      let body = '';
      if (done && pl) body = mKitResult(v, w, pl);
      else if (key === 'place') {
        body = `<div class="wz-opts">${WZ_PLACES.map((p, i) => `
        <button class="opt ${w.place === p.id ? 'on' : ''}" style="--i:${i}" onclick="${h(() => { const zones = {}; p.def.forEach(z => { zones[z] = 1; }); wzSet({ place: p.id, zones, step: 1, alt: {} }); })}">
          <span class="ico ${w.place === p.id ? 'acc' : ''}">${ic(p.ic, 20)}</span>
          <span class="opt-b"><span class="opt-t" style="display:block">${esc(p.n)}</span><span class="opt-s" style="display:block">${esc(p.s)}</span></span>
          ${ic('chevR', 18, 2)}
        </button>`).join('')}</div>`;
      } else if (key === 'zones') {
        const place = WZ_PLACES.find(p => p.id === w.place) || WZ_PLACES[1];
        const extra = Object.keys(WZ_ZONES).filter(z => !place.zones.includes(z));
        const zoneBtn = (z, i) => {
          const Z = WZ_ZONES[z], n = +w.zones[z] || 0;
          const setN = k => { const zones = { ...w.zones }; if (k > 0) zones[z] = k; else delete zones[z]; wzSet({ zones }); };
          return `
          <div class="wz-z ${n ? 'on' : ''}" style="--i:${i}" onclick="${h(() => setN(n ? 0 : 1))}">
            <span style="display:flex;align-items:center;justify-content:space-between;width:100%"><span class="ico" style="width:38px;height:38px;border-radius:12px">${ic(Z.ic, 19)}</span><span class="chk ${n ? 'on' : ''}">${n ? ic('check', 14, 3) : ''}</span></span>
            <span><span class="opt-t" style="display:block;font-size:14px">${esc(Z.n)}</span><span class="opt-s" style="display:block;margin:2px 0 0">${Z.t === 'out' ? 'Tashqi kamera' : Z.t === 'ptz' ? 'Aylanuvchi kamera' : 'Ichki kamera'}</span></span>
            ${n ? `<div class="ctr sm" onclick="${h(e => stop(e))}"><button onclick="${h(e => { stop(e); setN(n - 1); })}" aria-label="Kamaytirish">${ic('minus', 14, 2.4)}</button><b>${n}</b><button class="pl" onclick="${h(e => { stop(e); setN(Math.min(6, n + 1)); })}" aria-label="Ko'paytirish">${ic('plus', 14, 2.4)}</button></div>` : ''}
          </div>`;
        };
        body = `
        <div class="wz-zones">${place.zones.map(zoneBtn).join('')}</div>
        <div class="lbl" style="margin-top:6px">Boshqa joylar</div>
        <div class="wz-zones">${extra.map((z, i) => zoneBtn(z, i + place.zones.length)).join('')}</div>`;
      } else {
        body = `<div class="wz-opts">${(OPTS[key] || []).map((o, i) => opt(key, o, i)).join('')}</div>`;
      }

      const q = WZ_Q[key] || ['', ''];
      const needNext = key === 'zones';
      return `
<div class="pg" style="gap:18px">
  <div class="ttl"><h1 class="h2">Komplekt</h1><span class="sec-n">${done ? 'Tayyor tavsiya' : (w.step + 1) + ' / ' + WZ_STEPS.length + ' savol'}</span></div>
  ${kitSwitch()}
  ${done ? body : `
  <div class="steps">${WZ_STEPS.map((s, i) => `<div class="step ${i === w.step ? 'on' : ''} ${i < w.step ? 'past' : ''}"><span class="step-bar"></span></div>`).join('')}</div>
  <div class="wz ${fresh ? 'wz-in' : ''}">
    <div class="wz-bot">
      <span class="wz-ava">${ic('spark', 20, 2)}</span>
      <div class="wz-msg"><b>${esc(q[0])}</b><span>${esc(q[1])}</span></div>
    </div>
    ${body}
  </div>
  <div class="btn-row">
    ${w.step > 0 ? `<button class="btn btn-g" onclick="${h(() => wzSet({ step: w.step - 1 }))}" aria-label="Orqaga">${ic('chevL', 20, 2.2)}</button>` : ''}
    ${needNext ? `<button class="btn ${pl && pl.cams ? 'btn-p' : 'btn-off'} f" onclick="${h(() => { if (!pl || !pl.cams) { flash('Kamida bitta joyni belgilang'); return; } wzSet({ step: w.step + 1 }); })}">Davom etish · ${pl ? pl.cams : 0} kamera ${ic('arrowR', 18, 2.2)}</button>`
            : (w.step > 0 ? `<button class="btn btn-o f" onclick="${h(() => wzSet({ step: w.step + 1 }))}">Tavsiyani qoldirish ${ic('arrowR', 16, 2.2)}</button>` : '')}
  </div>
  ${pl && pl.cams && w.step > 0 ? `
  <div class="wz-live">
    <span class="ico" style="width:36px;height:36px;border-radius:12px;background:var(--acc);color:#fff">${ic('receipt', 18, 2)}</span>
    <span style="flex:1;min-width:0"><span style="display:block;font:500 11.5px var(--fb);opacity:.6">Taxminiy narx · ${pl.cams} kamera · ${pl.wired ? 'simli' : 'Wi-Fi'}</span><span style="display:block;font-size:17px;margin-top:2px">${pr(fmt(pl.total))}</span></span>
    <span style="font:500 11.5px var(--fb);opacity:.6;text-align:right">yoki<br>${esc(fmt(pl.monthly))}/oy</span>
  </div>` : ''}`}
</div>`;
    }

    function mKitResult(v, w, pl) {
      const orderNow = () => {
        if (!pl.skus.length) { flash('Mos mahsulot topilmadi — mutaxassisga murojaat qiling'); return; }
        S.install = !!w.install; S.bagInstall = false;
        placeOrder('Aqlli komplekt · ' + pl.cams + ' kamera', fmt(pl.total), pl.skus);
      };
      const toManual = () => {
        const camLines = pl.lines.filter(l => ['out', 'in', 'ptz'].includes(l.key)).sort((a, b) => b.q - a.q);
        const main = camLines[0];
        if (!main) { set({ kitMode: 'manual' }); return; }
        const kitExtra = {};
        pl.lines.forEach(l => { if (l !== main && l.key !== 'sd') kitExtra[l.p.sku] = (kitExtra[l.p.sku] || 0) + l.q; });
        set({ kitMode: 'manual', kStep: 4, camSku: main.p.sku, cams: main.q, kitExtra, hddUse: !!pl.sd, hdd: pl.sd ? pl.sd.size : S.hdd, cableUse: pl.cableM > 0, cable: pl.cableM || 60, install: !!w.install, preset: null });
      };
      const toExpert = () => set({
        tab: 'expert', expStep: 2, cb: 'idle', topic: 'Yangi kamera kerak',
        cbNote: 'Aqlli komplekt: ' + pl.place.n + ', ' + pl.lines.map(l => l.p.name + ' ×' + l.q).join('; ') + ' · ' + fmt(pl.total)
      });
      const swap = (k, d) => wzSet({ alt: { ...(w.alt || {}), [k]: ((w.alt || {})[k] || 0) + d } });
      if (!pl.lines.length) {
        return `

  <button class="btn btn-p sm" onclick="${h(toExpert)}">Mutaxassisga yuborish</button>
</div>`;
      }
      return `

  <div class="sumc-n">${pl.cams} kamera · ${pl.wired ? 'simli (PoE)' : 'Wi-Fi'} · ${esc(pl.place.n)} · yoki ${esc(fmt(pl.monthly))}/oy</div>

  </div>
</section>

<section class="sec" style="gap:10px">
  <div class="sec-h"><span class="lbl">Tarkibi</span><span class="sec-n">Arzonroq yoki yaxshirog‘ini tanlang</span></div>

  <div class="wz-line" style="--i:${i}">
    <div class="pc-img" onclick="${h(() => { if (prodBySku(l.p.sku)) set({ sel: l.p.sku, selImgIdx: 0 }); })}">${prodMedia(l.p, 40, 40)}<span class="q">×${l.q}</span></div>
    <div style="flex:1;min-width:0">
      <div class="lbl" style="letter-spacing:.03em">${esc(l.title)}</div>

</section>

<div style="display:flex;flex-direction:column;gap:10px">

  </div>
  <button class="link" style="align-self:center" onclick="${h(() => wzSet({ step: 0 }))}">Savollarga qaytish</button>
</div>`;
    }

      const cam = prodBySku(S.camSku) || (DATA.products || []).find(p => p.name === v.camName) || null;

      return `

  ${v.kStep1 ? `
  <section class="sec">

    <div class="presets">
      ${v.presets.map(ps => `
      <button class="preset ${ps.on ? 'on' : ''}" onclick="${h(ps.go)}">
        <span class="ico">${ic(presetIc[ps.mark] || 'home', 21)}</span>

      </button>`).join('')}
    </div>

  <section class="card">
    <div class="kitp">

      <div style="flex:1;min-width:0">
        ${v.camBadge ? `<span class="tag ink">${esc(v.camBadge)}</span>` : ''}

        <div style="margin-top:6px;font-size:15px">${pr(v.camPriceLabel)}</div>
      </div>

    /* ═══ Usta dasturi ═══

    const USTA_EXP = ['1 yilgacha', '1–3 yil', '3–5 yil', '5 yildan ko‘p'];

    function applyUstaPrices(prices) {
      (DATA.products || []).forEach(p => {
        if (p.retailPrice == null) p.retailPrice = p.price;
        p.price = prices && prices[p.sku] > 0 ? prices[p.sku] : p.retailPrice;
      });
      const hdd = DATA.config && DATA.config.pricing && DATA.config.pricing.hddOptions;
      if (Array.isArray(hdd)) hdd.forEach(o => {
        if (o.retailPrice == null) o.retailPrice = o.price;
        o.price = prices && o.sku && prices[o.sku] > 0 ? prices[o.sku] : o.retailPrice;
      });
    }
    const isUsta = () => !!(S.myPhone && S.usta && S.usta.status === 'Tasdiqlangan');

    async function syncUsta() {
      const ph = String(S.myPhone || '').replace(/[^0-9]/g, '');
      if (ph.length !== 9) { S.usta = null; applyUstaPrices(null); return; }
      try {
        const r = await fetch('/api/ustas/status?phone=' + ph);
        if (!r.ok) return;
        const u = await r.json();
        S.usta = u && u.status ? u : null;
        applyUstaPrices(isUsta() ? S.usta.prices : null);
        render();
      } catch (e) { }
    }

    function shrinkImage(file, max = 1280) {
      return new Promise((resolve, reject) => {
        const fr = new FileReader();
        fr.onerror = () => reject(new Error('Faylni o‘qib bo‘lmadi'));
        fr.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('Rasmni o‘qib bo‘lmadi'));
          img.onload = () => {
            const k = Math.min(1, max / Math.max(img.width, img.height));
            const c = document.createElement('canvas');
            c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            resolve(c.toDataURL('image/jpeg', .82));
          };
          img.src = fr.result;
        };
        fr.readAsDataURL(file);
      });
    }

    function ufState() {
      return S.uf || { name: '', phone: S.myPhone ? phFmt(S.myPhone) : '', region: S.region || '', exp: '', note: '', photos: [], busy: false, form: false };

    const ufSet = patch => set({ uf: { ...ufState(), ...patch } });
    const ufQuiet = patch => { S.uf = { ...ufState(), ...patch }; };

    async function ufAddPhotos(e) {
      const input = e && e.target;
      const files = Array.from((input && input.files) || []).filter(f => /^image\//.test(f.type));
      if (!files.length) return;
      const room = USTA_MAX_PHOTOS - ufState().photos.length;
      if (room <= 0) { flash(`Ko‘pi bilan ${USTA_MAX_PHOTOS} ta rasm yuklash mumkin`); return; }
      ufSet({ busy: true });
      const out = [];
      for (const f of files.slice(0, room)) {
        try { out.push(await shrinkImage(f)); } catch (err) { flash(err.message); }
      }
      ufSet({ photos: [...ufState().photos, ...out], busy: false });
      if (files.length > room) flash(`Faqat ${room} ta rasm qo‘shildi — ko‘pi bilan ${USTA_MAX_PHOTOS} ta`);
    }

    async function ufSubmit() {
      const f = ufState(), ph = String(f.phone).replace(/[^0-9]/g, '');

      if (!f.photos.length) { flash('Tasdiq uchun kamida 1 ta o‘rnatgan kamerangiz rasmini yuklang'); return; }
      ufSet({ busy: true });
      try {
        const r = await fetch('/api/ustas', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: f.name.trim(), phone: ph, region: f.region, experience: f.exp, note: f.note, photos: f.photos })

        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || 'Ariza yuborilmadi — qayta urinib ko‘ring');
        S.uf = null;
        S.usta = { status: 'Kutilmoqda', name: f.name.trim() };
        set({ myPhone: phFmt(ph) });
        flash(d.message || 'Ariza qabul qilindi');

    /* ═══ Ishlarimiz: layk · izoh · ulashish ═══
       Akkaunt yo'q — qurilma localStorage'dagi tasodifiy id (ko_cid) bilan tanib olinadi. */
    let _cid = null, _likePop = null;
    function storyCid() {
      if (_cid) return _cid;
      try { _cid = localStorage.getItem('ko_cid'); } catch (e) { }
      if (!_cid || !/^[A-Za-z0-9-]{8,64}$/.test(_cid)) {
        _cid = 'c' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12);
        try { localStorage.setItem('ko_cid', _cid); } catch (e) { }
      }
      return _cid;
    }
    const _dbStory = st => !!(st && st.id && DATA.stories && DATA.stories.includes(st));
    const cntFmt = n => { n = +n || 0; return n < 1000 ? String(n) : (n < 10000 ? (n / 1000).toFixed(1).replace(/\.0$/, '') : Math.round(n / 1000)) + 'K'; };
    function agoTxt(ts) {
      const t = Date.parse(String(ts || '').replace(' ', 'T') + (/[zZ]|[+-]\d\d:?\d\d$/.test(ts || '') ? '' : 'Z'));
      if (!t) return '';
      const m = Math.max(0, Math.floor((Date.now() - t) / 60000));
      if (m < 1) return 'hozirgina';
      if (m < 60) return m + ' daqiqa oldin';
      if (m < 1440) return Math.floor(m / 60) + ' soat oldin';
      return Math.floor(m / 1440) + ' kun oldin';
    }

    async function storyLike(st) {
      if (!st) return;
      const was = !!st.liked;
      st.liked = !was; st.likes = Math.max(0, (+st.likes || 0) + (was ? -1 : 1));
      _likePop = st.liked ? st.id : null;
      render();
      if (st.liked) setTimeout(() => { if (_likePop === st.id) { _likePop = null; render(); } }, 850);
      if (!_dbStory(st)) return;
      try {
        const d = await j('/api/stories/' + encodeURIComponent(st.id) + '/like', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cid: storyCid(), like: st.liked })
        });
        if (d && typeof d.likes === 'number') { st.liked = !!d.liked; st.likes = d.likes; render(); }
      } catch (err) {
        st.liked = was; st.likes = Math.max(0, (+st.likes || 0) + (was ? 1 : -1));
        flash(err.message || 'Layk saqlanmadi');
      }
    }

    async function cmtOpen(st) {
      if (!st) return;
      _pauseStoryTimer();
      set({ cmt: { id: st.id, list: _dbStory(st) ? null : [], text: '', name: S.cname || '', editName: !S.cname, busy: false, err: false } });
      if (!_dbStory(st)) return;
      try {
        const list = await j('/api/stories/' + encodeURIComponent(st.id) + '/comments?cid=' + storyCid());
        if (S.cmt && S.cmt.id === st.id) { S.cmt.list = Array.isArray(list) ? list : []; st.comments = S.cmt.list.length; render(); }
      } catch (err) {
        if (S.cmt && S.cmt.id === st.id) { S.cmt.list = []; S.cmt.err = true; render(); }
      }
    }
    function cmtClose() { set({ cmt: null }); _resumeStoryTimer(); }

    async function cmtSend(st) {
      const c = S.cmt;
      if (!c || c.busy || !st) return;
      const name = String(c.name || '').trim(), text = String(c.text || '').trim();
      if (name.length < 2) { c.editName = true; flash('Ismingizni yozing'); return; }
      if (text.length < 2) { flash('Izoh juda qisqa'); return; }
      try { localStorage.setItem('ko_cname', name); } catch (e) { }
      S.cname = name;
      if (!_dbStory(st)) {
        c.list = [{ id: 'l' + Date.now(), name, text, created_at: new Date().toISOString(), mine: true }, ...(c.list || [])];
        st.comments = (+st.comments || 0) + 1; c.text = ''; c.editName = false; flash('Izoh qo‘shildi'); return;
      }
      c.busy = true; render();
      try {
        const d = await j('/api/stories/' + encodeURIComponent(st.id) + '/comments', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cid: storyCid(), name, text })
        });
        if (S.cmt === c) { c.list = [d, ...(c.list || [])]; c.text = ''; c.editName = false; }
        st.comments = (+st.comments || 0) + 1;
        c.busy = false; flash('Izoh qo‘shildi');
      } catch (err) { c.busy = false; flash(err.message || 'Izoh yuborilmadi'); }
    }

    async function cmtDel(st, cm) {
      const c = S.cmt;
      if (!c || !cm) return;
      if (_dbStory(st) && typeof cm.id === 'number') {
        try { await j('/api/stories/comments/' + cm.id + '?cid=' + storyCid(), { method: 'DELETE' }); }
        catch (err) { flash(err.message || 'O‘chirib bo‘lmadi'); return; }
      }
      c.list = (c.list || []).filter(x => x !== cm);
      st.comments = Math.max(0, (+st.comments || 0) - 1);
      flash('Izoh o‘chirildi');
    }

    async function storyShare(st) {
      const url = (location.origin || '') + '/app';
      const title = (st && st.title) || 'Kamera Optom';
      try {
        if (navigator.share) { await navigator.share({ title, text: (st && st.text) || title, url }); return; }
        await navigator.clipboard.writeText(title + ' — ' + url);
        flash('Havola nusxalandi');
      } catch (e) { if (!e || e.name !== 'AbortError') flash('Havola: ' + url); }
    }

          : `<div class="cmt-list">${list.map(cm => `
          <div class="cmt-i">
            <span class="cmt-av nt">${esc(String(cm.name || '?').trim().charAt(0).toUpperCase())}</span>

                ${cm.mine ? `<button class="cmt-del" onclick="${h(() => cmtDel(st, cm))}" aria-label="O‘chirish">${ic('trash', 15, 2)}</button>` : ''}</div>
              <div class="cmt-t nt">${esc(cm.text)}</div>

      </div>
      <div class="cmt-f">
        ${c.editName
          ? `<div class="cmt-row"><input data-k="cmtName" value="${esc(c.name)}" maxlength="40" placeholder="Ismingiz" autocomplete="name" oninput="${h(e => { c.name = e.target.value; })}"></div>`

        <div class="cmt-row">

          <button class="cmt-send" ${c.busy ? 'disabled' : ''} onclick="${h(() => cmtSend(st))}" aria-label="Yuborish">${ic('send', 19, 2)}</button>
        </div>
        <div class="opt-s" style="font-size:11.5px">Hurmat bilan yozing — izohlar moderatsiya qilinadi</div>
      </div>
    </div>
  </div>`;
    }

        const fk = act && act.dataset ? act.dataset.k : null;
        const fs = fk ? act.selectionStart : null, fe = fk ? act.selectionEnd : null;
        /* raqamli maydon qayta formatlanadi ("90 123 45 67") — kursor belgilar emas, raqamlar soni bo'yicha tiklanadi */
        const fdig = fk && act.getAttribute && act.getAttribute('inputmode') === 'numeric' && fs != null
          ? String(act.value).slice(0, fs).replace(/[^0-9]/g, '').length : null;

        H = [];
        if (!DATA.ready && DATA.error) {
          _applyTheme(S.theme === 'day');
          APP.innerHTML = mFatal('Aloqa uzildi', DATA.error, `<button class="btn btn-p" style="margin-top:22px" onclick="${h(bootstrap)}">${ic('rotate', 18, 2)} Qayta urinish</button>`);
          return;
        }

        const v = vals();
        _applyTheme(v.day);
        /* kirish animatsiyalari faqat tabga kirilganda (yoki ma'lumot kelganda) o'ynaydi */
        const ik = S.tab + '|' + (DATA.ready ? 1 : 0), intro = ik !== _fx.introKey;
        if (intro) { _fx.introKey = ik; _fx.seen.clear(); _fx.countAt = 0; }
        if (APP.style && APP.style.setProperty) APP.style.setProperty('--now', -(Date.now() % 360000) + 'ms');
        const keep = {};
        if (APP.querySelectorAll) APP.querySelectorAll('[data-keep]').forEach(n => { keep[n.dataset.keep] = n.scrollLeft; });

        APP.innerHTML = `
<div class="shell${intro ? ' intro' : ''}">
  ${mHeader(v)}
  <div id="scroller">
    ${v.homeOn ? mHome(v) : ''}
    ${v.catOn ? mCatalog(v) : ''}
    ${v.kitOn ? mKit(v) : ''}
    ${v.expOn ? mExpert(v) : ''}
    ${v.profOn ? mProfile(v) : ''}
  </div>
  ${mNav(v)}
  ${v.detailOn ? mDetail(v) : ''}
  ${v.cartOn ? mCart(v) : ''}
  ${v.regionOn ? mRegion(v) : ''}
  ${v.filtersOn ? mFilters(v) : ''}
  ${v.addedOn ? mAdded(v) : ''}
  ${v.storyOn ? mStory(v) : ''}
  ${v.smartTourOn ? mSmartHomeTour(v) : ''}
  ${v.phoneOn ? mPhone(v) : ''}
  ${v.okOn ? mOk(v) : ''}
  ${v.toastOn ? `<div class="toast" role="status"><span class="dot">${ic('check', 14, 3)}</span><span>${esc(v.toast)}</span></div>` : ''}
</div>`;

        i18nApply(APP);
        const sc = document.getElementById('scroller'); if (sc) sc.scrollTop = _scroll;
        if (APP.querySelectorAll) APP.querySelectorAll('[data-keep]').forEach(n => { if (keep[n.dataset.keep]) n.scrollLeft = keep[n.dataset.keep]; });
        /* turkumga endi kirilgan bo'lsa — tanlangan chipni ko'rinadigan joyga surish */
        const cr = APP.querySelector && APP.querySelector('[data-keep="cchips"]');
        if (cr && keep.cchips === undefined) { const on = cr.querySelector('.chip.on'); if (on) cr.scrollLeft = Math.max(0, on.offsetLeft - cr.offsetLeft - 18); }
        fxAfterRender();
        if (fk) {
          const el = APP.querySelector('[data-k="' + fk + '"]');
          if (el) {
            el.focus();
            let a = fs, b = fe;
            if (fdig != null) { a = 0; for (let n = 0; a < el.value.length && n < fdig; a++) if (/[0-9]/.test(el.value[a])) n++; b = a; }
            try { el.setSelectionRange(a, b); } catch (e) { }
          }
        }
      } catch (err) {
        console.error('Render error:', err);
        APP.innerHTML = mFatal('Ilova yuklanishida xatolik', err && err.message ? err.message : String(err),
          `<button class="btn btn-p" style="margin-top:22px" onclick="try{localStorage.clear();}catch(e){}location.reload()">Qayta yuklash (Reset)</button>`);
      }
    }

    let _scroll = 0;
    if (APP && APP.addEventListener) APP.addEventListener('scroll', e => { if (e.target.id === 'scroller') _scroll = e.target.scrollTop; }, true);

    /* tab almashganda tepaga qaytish */
    const _origSet = set;
    window.set = function (o) { const t = S.tab, p = S.profPage, sl = S.sel; _origSet(o); if (S.tab !== t || S.profPage !== p || S.sel !== sl) { _scroll = 0; const sc = document.getElementById('scroller'); if (sc) sc.scrollTop = 0; } };

    /* soat */
    function tick() { const d = new Date(); const clk = document.getElementById('clk'); if (clk) clk.textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); }
    tick(); setInterval(tick, 15000);
    setInterval(() => {
      if (!S.ph && !S.ok && S.story === null) {
        if (Date.now() - _reelTouched < 7000) return;
        S.bannerIdx = (S.bannerIdx + 1) % (window.__banCount || 3);
        if (S.tab === 'home' && !S.sel && !S.bagOpen && !S.smartTour && !S.suggest) renderBanner();
      }
    }, 5000);
    render();
    bootstrap();
  </script>
</body>

</html>
