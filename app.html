<!DOCTYPE html>
<html lang="uz" data-theme="day">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KAMERA OPTOM QARSHI — Mijoz ilovasi</title>
  <meta name="description"
    content="Kuzatuv kameralari, videoregistratorlar va xavfsizlik tizimlari — Qarshi va butun O'zbekiston bo'ylab optom narxlarda.">
  <meta name="theme-color" content="#f3f1ed">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap"
    rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════════════
       KAMERA OPTOM · "Signal" dizayn tizimi
       Yorug' qog'oz fon, siyoh-qora tugmalar, signal-to'q sariq aksent,
       Unbounded (sarlavha/narx) + Onest (matn), SVG ikonkalar.
       ═══════════════════════════════════════════════════════════ */
    :root {
      --fd: 'Unbounded', 'Onest', system-ui, sans-serif;
      --fb: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif;

      --bg: #f3f1ed;
      --surface: #ffffff;
      --surface2: #ebe8e2;
      --surface3: #e0dcd4;
      --ink: #141311;
      --ink2: #46423c;
      --muted: #7d786f;
      --faint: #aca69c;
      --line: rgba(20, 19, 17, .08);
      --line2: rgba(20, 19, 17, .15);

      --acc: #ff4f12;
      --acc-ink: #ffffff;
      --acc-soft: rgba(255, 79, 18, .1);
      --acc-line: rgba(255, 79, 18, .35);
      --blue: #2f5bff;
      --blue-soft: rgba(47, 91, 255, .1);
      --ok: #12a150;
      --ok-soft: rgba(18, 161, 80, .1);
      --warn: #c77c00;
      --warn-soft: rgba(217, 138, 0, .12);

      --btn: #141311;
      --btn-ink: #ffffff;
      --glass: rgba(255, 255, 255, .78);
      --scrim: rgba(20, 19, 17, .38);
      --shadow: 0 1px 2px rgba(20, 19, 17, .04), 0 10px 28px rgba(20, 19, 17, .07);
      --shadow-lg: 0 24px 60px rgba(20, 19, 17, .22);

      /* umumiy yordamchilar (prodSvg va holat ranglari) uchun moslik tokenlari */
      --fg: var(--ink);
      --fg2: var(--ink2);
      --card: var(--surface);
      --tile: var(--surface2);
      --fill: rgba(20, 19, 17, .05);
      --dim: var(--muted);
      --dim2: var(--muted);
      --dim3: var(--ink2);
      --line3: var(--line2);
      --line4: var(--line2);
    }

    [data-theme="night"] {
      --bg: #0f0f0e;
      --surface: #1a1918;
      --surface2: #242321;
      --surface3: #2f2d2a;
      --ink: #f4f2ee;
      --ink2: #cbc6bd;
      --muted: #8f8a81;
      --faint: #5f5b55;
      --line: rgba(255, 255, 255, .08);
      --line2: rgba(255, 255, 255, .15);
      --acc: #ff6a33;
      --acc-soft: rgba(255, 106, 51, .14);
      --acc-line: rgba(255, 106, 51, .4);
      --blue: #7b96ff;
      --blue-soft: rgba(123, 150, 255, .14);
      --ok: #3ccf7e;
      --ok-soft: rgba(60, 207, 126, .12);
      --warn: #f0b43c;
      --warn-soft: rgba(240, 180, 60, .14);
      --btn: #f4f2ee;
      --btn-ink: #141311;
      --glass: rgba(30, 29, 27, .8);
      --scrim: rgba(0, 0, 0, .55);
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .35);
      --shadow-lg: 0 24px 60px rgba(0, 0, 0, .6);
      --fill: rgba(255, 255, 255, .06);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      margin: 0
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 64px;
      padding: 32px 16px;
      font-family: var(--fb);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(900px 520px at 12% 0%, rgba(255, 79, 18, .16), transparent 62%),
        radial-gradient(800px 480px at 100% 100%, rgba(47, 91, 255, .12), transparent 60%),
        #ece9e3;
    }

    html[data-theme="night"] body {
      background:
        radial-gradient(900px 520px at 12% 0%, rgba(255, 106, 51, .16), transparent 62%),
        radial-gradient(800px 480px at 100% 100%, rgba(123, 150, 255, .1), transparent 60%),
        #0a0a09;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      margin: 0;
      cursor: pointer;
      text-align: inherit;
      -webkit-appearance: none;
      appearance: none
    }

    input,
    textarea {
      font: inherit;
      color: inherit
    }

    :focus-visible {
      outline: 2px solid var(--acc);
      outline-offset: 2px
    }

    ::-webkit-scrollbar {
      width: 0;
      height: 0
    }

    svg {
      flex: none;
      display: block
    }

    /* ── Qurilma ramkasi (iPhone uslubi) ── */
    .side {
      width: 300px;
      display: none;
      flex-direction: column;
      gap: 18px
    }

    .side-mark {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .side-v {
      font: 700 11px var(--fd);
      letter-spacing: .08em;
      color: var(--acc);
      background: var(--acc-soft);
      border: 1px solid var(--acc-line);
      padding: 6px 10px;
      border-radius: 99px;
      align-self: flex-start
    }

    .side h2 {
      margin: 0;
      font: 600 30px/1.1 var(--fd);
      letter-spacing: -.02em
    }

    .side p {
      margin: 0;
      font: 400 15px/1.55 var(--fb);
      color: var(--ink2)
    }

    .side a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      align-self: flex-start;
      font: 600 14px var(--fb);
      color: var(--ink);
      text-decoration: none;
      padding: 11px 16px;
      border-radius: 99px;
      border: 1px solid var(--line2);
      background: var(--glass)
    }

    @media (min-width: 900px) {
      .side {
        display: flex
      }
    }

    #device {
      position: relative;
      width: 414px;
      height: 868px;
      flex: none;
      border-radius: 58px;
      border: 12px solid #121212;
      background: var(--bg);
      box-shadow: 0 0 0 1.5px #3a3a3a, 0 50px 120px rgba(20, 19, 17, .35);
      overflow: hidden;
      display: flex;
      flex-direction: column
    }

    .dv-status {
      height: 50px;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 30px 0 36px;
      font: 600 15px var(--fb);
      color: var(--ink);
      background: var(--bg);
      position: relative;
      z-index: 60
    }

    .dv-island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 118px;
      height: 34px;
      border-radius: 20px;
      background: #000
    }

    .dv-icons {
      display: flex;
      align-items: center;
      gap: 6px
    }

    .dv-home {
      position: absolute;
      left: 50%;
      bottom: 7px;
      transform: translateX(-50%);
      width: 134px;
      height: 5px;
      border-radius: 3px;
      background: var(--ink);
      opacity: .85;
      z-index: 80;
      pointer-events: none
    }

    #app {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      position: relative
    }

    @media (max-width: 560px) {
      body {
        padding: 0;
        align-items: stretch;
        gap: 0
      }

      #device {
        width: 100%;
        height: 100dvh;
        border: none;
        border-radius: 0;
        box-shadow: none
      }

      .dv-status,
      .dv-home {
        display: none
      }
    }

    /* ── Animatsiyalar ── */
    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(14px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes sheetIn {
      from {
        transform: translateY(40px);
        opacity: 0
      }

      to {
        transform: none;
        opacity: 1
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .2
      }
    }

    @keyframes ping {
      0% {
        transform: scale(.8);
        opacity: .7
      }

      100% {
        transform: scale(2.2);
        opacity: 0
      }
    }

    @keyframes storyBar {
      from {
        width: 0
      }

      to {
        width: 100%
      }
    }

    @keyframes okPop {
      0% {
        transform: scale(.4);
        opacity: 0
      }

      60% {
        transform: scale(1.1);
        opacity: 1
      }

      100% {
        transform: scale(1)
      }
    }

    @keyframes okTick {
      from {
        stroke-dashoffset: 48
      }

      to {
        stroke-dashoffset: 0
      }
    }

    @keyframes scan {
      0% {
        transform: translateY(-30%);
        opacity: 0
      }

      15%,
      85% {
        opacity: 1
      }

      100% {
        transform: translateY(330%);
        opacity: 0
      }
    }

    @keyframes lock {

      0%,
      35% {
        opacity: 0;
        transform: scale(1.4)
      }

      50%,
      100% {
        opacity: 1;
        transform: scale(1)
      }
    }

    @keyframes glow {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(255, 106, 51, .7)
      }

      50% {
        box-shadow: 0 0 0 9px rgba(255, 106, 51, 0)
      }
    }

    /* ── Asosiy karkas ── */
    .shell {
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--ink);
      position: relative;
      overflow: hidden
    }

    #scroller {
      flex: 1;
      overflow: auto;
      overscroll-behavior: contain
    }

    .pg {
      padding: 4px 18px 118px;
      display: flex;
      flex-direction: column;
      gap: 26px;
      animation: fadeIn .25s ease both
    }

    .hd {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 18px 12px
    }

    .hd-brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0
    }

    .hd-name {
      font: 600 15px/1 var(--fd);
      letter-spacing: -.02em
    }

    .hd-loc {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 5px;
      font: 600 12px/1 var(--fb);
      color: var(--muted)
    }

    .hd-loc b {
      color: var(--ink);
      font-weight: 600
    }

    .ibtn {
      position: relative;
      flex: none;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      color: var(--ink);
      box-shadow: var(--shadow);
      transition: transform .15s ease
    }

    .ibtn:active {
      transform: scale(.94)
    }

    .ibtn.sq {
      border-radius: 16px;
      box-shadow: none;
      border: 1px solid var(--line)
    }

    .ibtn.act {
      background: var(--btn);
      color: var(--btn-ink);
      border-color: transparent
    }

    .ibtn.glass {
      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: none;
      border: 1px solid var(--line)
    }

    .ibtn.sm {
      width: 36px;
      height: 36px;
      box-shadow: none;
      border: 1px solid var(--line);
      background: transparent
    }

    .cnt {
      position: absolute;
      top: -3px;
      right: -3px;
      min-width: 21px;
      height: 21px;
      padding: 0 6px;
      border-radius: 11px;
      background: var(--acc);
      color: var(--acc-ink);
      font: 700 11px/21px var(--fb);
      text-align: center;
      box-shadow: 0 0 0 2.5px var(--bg)
    }

    /* ── Tipografiya ── */
    .h1 {
      margin: 0;
      font: 600 29px/1.08 var(--fd);
      letter-spacing: -.035em
    }

    .h1 em,
    .h2 em {
      font-style: normal;
      color: var(--acc)
    }

    .h2 {
      margin: 0;
      font: 600 24px/1.1 var(--fd);
      letter-spacing: -.03em
    }

    .h3 {
      margin: 0;
      font: 600 17px/1.2 var(--fd);
      letter-spacing: -.02em
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font: 600 12px var(--fb);
      color: var(--muted);
      letter-spacing: .01em
    }

    .rec {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--acc);
      animation: blink 1.4s steps(1, end) infinite
    }

    .muted {
      color: var(--muted)
    }

    .sub {
      font: 400 13px/1.45 var(--fb);
      color: var(--muted)
    }

    .num {
      font-family: var(--fd);
      letter-spacing: -.03em
    }

    .pr {
      white-space: nowrap
    }

    .pr b {
      font: 600 1em var(--fd);
      letter-spacing: -.03em
    }

    .pr small {
      font: 500 .68em var(--fb);
      color: var(--muted);
      margin-left: 3px
    }

    .sec {
      display: flex;
      flex-direction: column;
      gap: 14px
    }

    .sec-h {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px
    }

    .sec-t {
      margin: 0;
      font: 600 17px var(--fd);
      letter-spacing: -.02em
    }

    .sec-a {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font: 600 13px var(--fb);
      color: var(--acc)
    }

    .sec-n {
      font: 500 13px var(--fb);
      color: var(--muted)
    }

    .rail {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      margin: 0 -18px;
      padding: 0 18px 2px;
      scroll-snap-type: x proximity;
      scroll-padding: 0 18px
    }

    .rail>* {
      scroll-snap-align: start
    }

    /* ── Tugmalar ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 54px;
      padding: 0 22px;
      border-radius: 99px;
      font: 600 15px var(--fb);
      letter-spacing: -.01em;
      transition: transform .15s ease, opacity .15s ease;
      white-space: nowrap
    }

    .btn:active {
      transform: scale(.97)
    }

    .btn.f {
      flex: 1
    }

    .btn.w {
      width: 100%
    }

    .btn-p {
      background: var(--btn);
      color: var(--btn-ink)
    }

    .btn-a {
      background: var(--acc);
      color: var(--acc-ink);
      box-shadow: 0 10px 24px -10px var(--acc)
    }

    .btn-g {
      background: var(--surface2);
      color: var(--ink)
    }

    .btn-o {
      border: 1.5px solid var(--line2);
      color: var(--ink)
    }

    .btn-off {
      background: var(--surface2);
      color: var(--faint)
    }

    .btn.sm {
      min-height: 42px;
      padding: 0 16px;
      font-size: 13.5px
    }

    .btn-row {
      display: flex;
      gap: 10px
    }

    .link {
      font: 600 13px var(--fb);
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 3px
    }

    /* ── Kartalar ── */
    .card {
      background: var(--surface);
      border-radius: 24px;
      padding: 18px;
      box-shadow: var(--shadow)
    }

    .card.flat {
      box-shadow: none;
      border: 1px solid var(--line)
    }

    .card.tint {
      background: var(--surface2);
      box-shadow: none
    }

    .card-t {
      font: 600 15px var(--fb)
    }

    .lbl {
      font: 600 11.5px var(--fb);
      color: var(--muted);
      letter-spacing: .06em;
      text-transform: uppercase
    }

    .hr {
      height: 1px;
      background: var(--line);
      margin: 16px 0
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font: 700 10.5px/1 var(--fb);
      padding: 5px 8px;
      border-radius: 99px;
      background: var(--surface);
      color: var(--ink);
      white-space: nowrap
    }

    .tag.ink {
      background: var(--btn);
      color: var(--btn-ink)
    }

    .tag.acc {
      background: var(--acc);
      color: var(--acc-ink)
    }

    .tag.soft {
      background: var(--acc-soft);
      color: var(--acc)
    }

    .tag.warn {
      background: var(--warn-soft);
      color: var(--warn)
    }

    .was {
      display: inline-block;
      margin-left: 7px;
      font: 500 .62em var(--fb);
      color: var(--faint);
      vertical-align: 2px
    }

    .usta-card {
      display: flex;
      align-items: center;
      gap: 13px;
      width: 100%;
      padding: 15px 16px;
      border-radius: 22px;
      background: var(--surface);
      border: 1.5px dashed var(--acc-line);
      text-align: left
    }

    .usta-card.on {
      border: 1.5px solid var(--ok);
      background: var(--ok-soft)
    }

    .uf-photos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px
    }

    .uf-ph {
      position: relative;
      aspect-ratio: 1;
      border-radius: 18px;
      overflow: hidden;
      background: var(--surface2)
    }

    .uf-ph img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .uf-ph .xbtn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0, 0, 0, .55);
      color: #fff
    }

    .uf-ph.add {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1.5px dashed var(--line2);
      background: transparent;
      color: var(--acc);
      cursor: pointer
    }

    .uf-ph.add small {
      font: 600 11.5px var(--fb)
    }

    .tag.ok {
      background: var(--ok-soft);
      color: var(--ok)
    }

    .tag.line {
      background: transparent;
      border: 1px solid var(--line2);
      color: var(--ink2)
    }

    .stk {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font: 600 11.5px var(--fb);
      color: var(--ok)
    }

    .stk::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor
    }

    .stk.low {
      color: var(--warn)
    }

    /* ── Chiplar, segmentlar ── */
    .chip {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 40px;
      padding: 0 16px;
      border-radius: 99px;
      background: var(--surface);
      border: 1px solid var(--line);
      font: 600 13.5px var(--fb);
      color: var(--ink2);
      white-space: nowrap;
      transition: background .15s ease, color .15s ease
    }

    .chip i {
      font: 600 11px var(--fb);
      font-style: normal;
      color: var(--faint)
    }

    .chip.on {
      background: var(--btn);
      color: var(--btn-ink);
      border-color: transparent
    }

    .chip.on i {
      color: inherit;
      opacity: .6
    }

    .chip.sm {
      height: 34px;
      padding: 0 13px;
      font-size: 12.5px
    }

    .chip.acc.on {
      background: var(--acc);
      color: var(--acc-ink)
    }

    .seg {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 4px;
      padding: 4px;
      border-radius: 18px;
      background: var(--surface2)
    }

    .seg>button {
      min-height: 46px;
      padding: 6px 4px;
      border-radius: 14px;
      text-align: center;
      font: 600 13px var(--fb);
      color: var(--ink2);
      transition: background .15s ease
    }

    .seg>button small {
      display: block;
      font: 500 10.5px var(--fb);
      color: var(--muted);
      margin-top: 2px
    }

    .seg>button.on {
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 2px 8px rgba(20, 19, 17, .08)
    }

    .seg>button.on small {
      color: var(--acc)
    }

    .opt {
      display: flex;
      align-items: center;
      gap: 13px;
      width: 100%;
      padding: 15px 16px;
      border-radius: 20px;
      background: var(--surface);
      border: 1.5px solid transparent;
      box-shadow: var(--shadow);
      transition: border-color .15s ease
    }

    .opt.on {
      border-color: var(--acc)
    }

    .opt-b {
      flex: 1;
      min-width: 0
    }

    .opt-t {
      font: 600 14.5px/1.25 var(--fb)
    }

    .opt-s {
      font: 400 12.5px/1.4 var(--fb);
      color: var(--muted);
      margin-top: 3px
    }

    .opt-r {
      flex: none;
      font: 600 13px var(--fb);
      color: var(--ink);
      text-align: right
    }

    .ico {
      flex: none;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface2);
      color: var(--ink)
    }

    .ico.acc {
      background: var(--acc-soft);
      color: var(--acc)
    }

    .ico.blue {
      background: var(--blue-soft);
      color: var(--blue)
    }

    .ico.ok {
      background: var(--ok-soft);
      color: var(--ok)
    }

    .ico.warn {
      background: var(--warn-soft);
      color: var(--warn)
    }

    .ico.inv {
      background: var(--btn);
      color: var(--btn-ink)
    }

    .chk,
    .rad {
      flex: none;
      width: 24px;
      height: 24px;
      border-radius: 8px;
      border: 2px solid var(--line2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--acc-ink);
      transition: all .15s ease
    }

    .rad {
      border-radius: 50%
    }

    .chk.on,
    .rad.on {
      background: var(--acc);
      border-color: var(--acc)
    }

    .rad.on::after {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--acc-ink)
    }

    .sw {
      flex: none;
      width: 52px;
      height: 32px;
      border-radius: 99px;
      background: var(--surface3);
      padding: 3px;
      display: flex;
      transition: background .2s ease
    }

    .sw::after {
      content: "";
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .2);
      transition: transform .2s cubic-bezier(.3, 1.4, .6, 1)
    }

    .sw.on {
      background: var(--acc)
    }

    .sw.on::after {
      transform: translateX(20px)
    }

    .ctr {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border-radius: 99px;
      background: var(--surface2)
    }

    .ctr button {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      color: var(--ink)
    }

    .ctr button.pl {
      background: var(--btn);
      color: var(--btn-ink)
    }

    .ctr b {
      min-width: 34px;
      text-align: center;
      font: 600 16px var(--fd)
    }

    .ctr.sm button {
      width: 30px;
      height: 30px
    }

    .ctr.sm b {
      min-width: 24px;
      font-size: 13.5px
    }

    /* ── Maydonlar ── */
    .field {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 54px;
      padding: 0 18px;
      border-radius: 18px;
      background: var(--surface);
      border: 1.5px solid var(--line);
      color: var(--muted);
      transition: border-color .15s ease
    }

    .field.focus,
    .field:focus-within {
      border-color: var(--ink)
    }

    .field.good {
      border-color: var(--ok)
    }

    .field input,
    .field textarea {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font: 500 15px var(--fb)
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: var(--faint)
    }

    .field .pre {
      flex: none;
      font: 600 15px var(--fb);
      color: var(--muted)
    }

    .field.area {
      align-items: flex-start;
      padding: 14px 18px
    }

    .field.area textarea {
      resize: none;
      min-height: 60px;
      line-height: 1.45
    }

    .field.tint {
      background: var(--surface2);
      border-color: transparent
    }

    .field.tint:focus-within {
      border-color: var(--ink)
    }

    .xbtn {
      flex: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--surface2);
      color: var(--ink2);
      display: flex;
      align-items: center;
      justify-content: center
    }

    /* ── Guruhlangan ro'yxat ── */
    .grp {
      background: var(--surface);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden
    }

    .grp-r {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 14px 16px
    }

    .grp-r+.grp-r {
      border-top: 1px solid var(--line)
    }

    .grp-r .chev {
      color: var(--faint)
    }

    .kv {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding: 7px 0;
      font: 400 14px var(--fb);
      color: var(--muted)
    }

    .kv span:last-child {
      color: var(--ink);
      font-weight: 600;
      text-align: right
    }

    .empty {
      text-align: center;
      padding: 38px 22px;
      border-radius: 24px;
      border: 1.5px dashed var(--line2)
    }

    .empty .ico {
      margin: 0 auto 14px;
      width: 58px;
      height: 58px;
      border-radius: 20px
    }

    .empty .h3 {
      font-size: 16px
    }

    .empty .sub {
      margin-top: 8px
    }

    .empty .btn {
      margin-top: 18px
    }

    /* ── Qadamlar ── */
    .steps {
      display: flex;
      align-items: center;
      gap: 6px
    }

    .step {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      min-width: 0
    }

    .step-bar {
      width: 100%;
      height: 5px;
      border-radius: 3px;
      background: var(--surface3);
      overflow: hidden
    }

    .step.past .step-bar,
    .step.on .step-bar {
      background: var(--acc)
    }

    .step-l {
      display: flex;
      align-items: center;
      gap: 5px;
      font: 600 12px var(--fb);
      color: var(--faint);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%
    }

    .step.on .step-l {
      color: var(--ink)
    }

    .step.past .step-l {
      color: var(--ink2)
    }

    .step-l i {
      font: 700 11px var(--fd);
      font-style: normal
    }

    /* ── Bosh sahifa ── */
    .hero {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-top: 6px
    }

    .search {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      height: 58px;
      padding: 0 8px 0 20px;
      border-radius: 99px;
      background: var(--surface);
      box-shadow: var(--shadow);
      color: var(--muted);
      font: 500 14.5px var(--fb)
    }

    .search span {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .search kbd {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--btn);
      color: var(--btn-ink);
      display: flex;
      align-items: center;
      justify-content: center
    }

    .st {
      flex: none;
      width: 72px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px
    }

    .st-ring {
      width: 72px;
      height: 72px;
      border-radius: 26px;
      padding: 3px;
      background: var(--line2)
    }

    .st.fresh .st-ring {
      background: conic-gradient(from 200deg, var(--acc), #ffb020, var(--acc))
    }

    .st-in {
      width: 100%;
      height: 100%;
      border-radius: 23px;
      border: 3px solid var(--bg);
      background: var(--surface2);
      color: var(--ink2);
      display: flex;
      align-items: center;
      justify-content: center
    }

    .st.fresh .st-in {
      color: var(--acc)
    }

    .st-l {
      max-width: 100%;
      font: 500 11.5px var(--fb);
      color: var(--ink2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .bn {
      position: relative;
      height: 232px;
      border-radius: 30px;
      overflow: hidden;
      background: #16110e;
      color: #fff;
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
      box-shadow: var(--shadow)
    }

    .bn-media {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: center/cover no-repeat
    }

    .bn-shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, .05) 30%, rgba(0, 0, 0, .78))
    }

    .bn-prog {
      position: absolute;
      top: 16px;
      left: 18px;
      right: 18px;
      display: flex;
      gap: 5px;
      z-index: 2
    }

    .bn-prog i {
      flex: 1;
      height: 3.5px;
      border-radius: 2px;
      background: rgba(255, 255, 255, .3);
      cursor: pointer
    }

    .bn-prog i.on {
      background: #fff
    }

    .bn-live {
      position: absolute;
      top: 32px;
      right: 18px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font: 600 10.5px var(--fb);
      letter-spacing: .04em;
      padding: 5px 9px;
      border-radius: 99px;
      background: rgba(0, 0, 0, .45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px)
    }

    .bn-live i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ff3b30;
      animation: blink 1.2s steps(1, end) infinite
    }

    .bn-body {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 18px;
      z-index: 2;
      animation: rise .45s ease both
    }

    .bn-tag {
      display: inline-block;
      font: 700 10.5px var(--fb);
      letter-spacing: .06em;
      padding: 5px 9px;
      border-radius: 99px;
      background: var(--acc);
      color: #fff
    }

    .bn-title {
      margin-top: 10px;
      font: 600 19px/1.15 var(--fd);
      letter-spacing: -.025em;
      max-width: 300px;
      text-wrap: balance
    }

    .bn-sub {
      margin-top: 6px;
      font: 400 12.5px/1.4 var(--fb);
      color: rgba(255, 255, 255, .72);
      max-width: 300px
    }

    .bn-cta {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #fff;
      color: #141311;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .bn-body.has-cta {
      padding-right: 58px
    }

    .bn-art {
      position: absolute;
      inset: 0;
      overflow: hidden
    }

    .bn-art.person,
    .bn-art.car {
      background: radial-gradient(120% 90% at 70% 10%, #3b2014, #16110e 65%)
    }

    .bn-art.grid {
      background: radial-gradient(120% 90% at 80% 10%, #1b2552, #0e1022 70%)
    }

    .bn-art.credit {
      background: radial-gradient(120% 90% at 80% 10%, #ff6a33, #b8360a 55%, #4a1504)
    }

    .vf {
      position: absolute;
      right: 22px;
      top: 64px;
      width: 118px;
      height: 90px
    }

    .bn-art~.bn-body .bn-title {
      max-width: 205px
    }

    .vf i {
      position: absolute;
      width: 18px;
      height: 18px;
      border-color: rgba(255, 255, 255, .8);
      border-style: solid;
      border-width: 0
    }

    .vf i:nth-child(1) {
      left: 0;
      top: 0;
      border-left-width: 2.5px;
      border-top-width: 2.5px;
      border-radius: 6px 0 0 0
    }

    .vf i:nth-child(2) {
      right: 0;
      top: 0;
      border-right-width: 2.5px;
      border-top-width: 2.5px;
      border-radius: 0 6px 0 0
    }

    .vf i:nth-child(3) {
      left: 0;
      bottom: 0;
      border-left-width: 2.5px;
      border-bottom-width: 2.5px;
      border-radius: 0 0 0 6px
    }

    .vf i:nth-child(4) {
      right: 0;
      bottom: 0;
      border-right-width: 2.5px;
      border-bottom-width: 2.5px;
      border-radius: 0 0 6px 0
    }

    .vf-subj {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, .92)
    }

    .vf-box {
      position: absolute;
      inset: 14px 30px;
      border: 1.5px solid var(--acc);
      border-radius: 6px;
      background: rgba(255, 106, 51, .1);
      animation: lock 4.5s ease-out infinite
    }

    .vf-det {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: -8px;
      font: 700 9.5px var(--fb);
      letter-spacing: .04em;
      padding: 3px 6px;
      border-radius: 5px;
      background: var(--acc);
      color: #fff;
      white-space: nowrap
    }

    .vf-scan {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 26px;
      background: linear-gradient(180deg, transparent, rgba(255, 255, 255, .22), transparent);
      animation: scan 3.2s linear infinite
    }

    .bn-grid {
      position: absolute;
      right: 22px;
      top: 60px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      width: 136px
    }

    .bn-grid i {
      height: 48px;
      border-radius: 10px;
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .16);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, .8)
    }

    .bn-zero {
      position: absolute;
      right: 20px;
      top: 26px;
      font: 700 76px/1 var(--fd);
      letter-spacing: -.06em;
      color: rgba(255, 255, 255, .95)
    }

    .bento {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto auto;
      gap: 10px
    }

    .bt {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      min-height: 124px;
      padding: 16px;
      border-radius: 26px;
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: transform .15s ease
    }

    .bt:active {
      transform: scale(.98)
    }

    .bt .ico {
      margin-bottom: auto
    }

    .bt-t {
      margin-top: 14px;
      font: 600 15px/1.2 var(--fb)
    }

    .bt-s {
      font: 400 12px/1.35 var(--fb);
      color: var(--muted)
    }

    .bt-go {
      position: absolute;
      top: 16px;
      right: 16px;
      color: var(--faint)
    }

    .bt.cat {
      grid-row: span 2;
      background: var(--btn);
      color: var(--btn-ink)
    }

    .bt.cat .ico {
      background: rgba(255, 255, 255, .12);
      color: inherit
    }

    [data-theme="night"] .bt.cat .ico {
      background: rgba(0, 0, 0, .08)
    }

    .bt.cat .bt-s {
      color: inherit;
      opacity: .6
    }

    .bt.cat .bt-go {
      color: inherit;
      opacity: .5
    }

    .bt-big {
      margin-top: 18px;
      font: 600 46px/1 var(--fd);
      letter-spacing: -.05em
    }

    .bt.exp {
      background: var(--acc);
      color: #fff
    }

    .bt.exp .ico {
      background: rgba(255, 255, 255, .2);
      color: #fff
    }

    .bt.exp .bt-s,
    .bt.exp .bt-go {
      color: rgba(255, 255, 255, .78)
    }

    .bt.wide {
      grid-column: span 2;
      min-height: 0;
      flex-direction: row;
      align-items: center;
      gap: 13px
    }

    .bt.wide .ico {
      margin: 0
    }

    .bt.wide .bt-t {
      margin: 0
    }

    .bt.wide .bt-go {
      position: static;
      margin-left: auto
    }

    .tour {
      position: relative;
      height: 210px;
      border-radius: 30px;
      overflow: hidden;
      background: #0d1520 center/cover no-repeat;
      color: #fff;
      box-shadow: var(--shadow)
    }

    .tour-shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(8, 10, 14, .92) 0%, rgba(8, 10, 14, .6) 52%, rgba(8, 10, 14, .1))
    }

    .tour-b {
      position: absolute;
      left: 20px;
      top: 18px;
      right: 110px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px
    }

    .tour-t {
      margin-top: 6px;
      font: 600 19px/1.12 var(--fd);
      letter-spacing: -.03em
    }

    .tour-s {
      font: 400 12px/1.4 var(--fb);
      color: rgba(255, 255, 255, .7)
    }

    .tour-go {
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 38px;
      padding: 0 14px;
      border-radius: 99px;
      background: #fff;
      color: #141311;
      font: 600 13px var(--fb)
    }

    .tour-rooms {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 14px;
      margin: 0;
      padding: 0 20px;
      gap: 6px
    }

    .tour-rooms button {
      flex: none;
      height: 30px;
      padding: 0 12px;
      border-radius: 99px;
      background: rgba(255, 255, 255, .14);
      border: 1px solid rgba(255, 255, 255, .2);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font: 600 11.5px var(--fb);
      color: #fff
    }

    .cats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px 8px
    }

    .cat-i {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center
    }

    .cat-i .ico {
      width: 62px;
      height: 62px;
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--shadow)
    }

    .cat-i b {
      font: 600 12px/1.15 var(--fb)
    }

    .cat-i small {
      font: 500 11px var(--fb);
      color: var(--muted);
      margin-top: -5px
    }

    .mini {
      flex: none;
      width: 158px;
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .mini .pc-img {
      height: 158px
    }

    .trust {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px
    }

    .trust>div {
      padding: 14px 12px;
      border-radius: 20px;
      background: var(--surface2)
    }

    .trust b {
      display: block;
      margin-top: 10px;
      font: 600 14px var(--fd);
      letter-spacing: -.02em
    }

    .trust span {
      display: block;
      margin-top: 3px;
      font: 400 11.5px/1.3 var(--fb);
      color: var(--muted)
    }

    .expc {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 20px;
      border-radius: 28px;
      background: var(--acc-soft);
      border: 1px solid var(--acc-line)
    }

    /* ── Mahsulot kartasi ── */
    .pc-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px 12px
    }

    .pc {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0
    }

    .pc-img {
      position: relative;
      height: 172px;
      border-radius: 24px;
      background: var(--surface2);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer
    }

    .k-prod-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 14px;
      display: block;
      transition: transform .3s ease
    }

    .k-prod-img {
      mix-blend-mode: multiply
    }

    /* tungi rejimda mahsulot plitkalari och "qog'oz" bo'lib qoladi — oq fonli rasmlar tabiiy qo'shiladi */
    [data-theme="night"] .pc-img,
    [data-theme="night"] .det-hero,
    [data-theme="night"] .det-img>div {
      background: #e7e3dc;
      color: #141311
    }

    [data-theme="night"] .pc-add,
    [data-theme="night"] .det-dots button.on {
      background: #141311;
      color: #fff
    }

    .pc-360,
    .det-spin .mid {
      color: var(--ink)
    }

    [data-theme="night"] .thumb.add .pc-img {
      background: transparent;
      color: var(--acc)
    }

    .pc-img:hover .k-prod-img {
      transform: scale(1.05)
    }

    .pc-tags {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      gap: 4px;
      flex-wrap: wrap
    }

    .pc-360 {
      position: absolute;
      left: 10px;
      bottom: 10px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font: 700 10px var(--fb);
      padding: 5px 8px;
      border-radius: 99px;
      background: var(--glass);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px)
    }

    .pc-add {
      position: absolute;
      right: 10px;
      bottom: 10px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--btn);
      color: var(--btn-ink);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(20, 19, 17, .2);
      transition: transform .15s ease
    }

    .pc-add:active {
      transform: scale(.9)
    }

    .pc-b {
      padding: 0 4px;
      cursor: pointer
    }

    .pc-n {
      font: 600 14px/1.25 var(--fb);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden
    }

    .pc-s {
      margin-top: 4px;
      font: 400 12px/1.35 var(--fb);
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .pc-p {
      margin-top: 8px;
      font-size: 15px
    }

    .pc-m {
      margin-top: 3px;
      font: 500 11.5px var(--fb);
      color: var(--muted)
    }

    .pl {
      display: flex;
      gap: 14px;
      padding: 10px;
      border-radius: 24px;
      background: var(--surface);
      box-shadow: var(--shadow)
    }

    .pl .pc-img {
      flex: none;
      width: 108px;
      height: 108px;
      border-radius: 18px
    }

    .pl-b {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: 4px 4px 2px 0
    }

    .pl-f {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 8px;
      margin-top: auto
    }

    .pl .pc-add {
      position: static;
      width: 38px;
      height: 38px;
      box-shadow: none
    }

    /* ── Katalog ── */
    .ctop {
      position: sticky;
      top: 0;
      z-index: 4;
      margin: -4px -18px 0;
      padding: 4px 18px 14px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      gap: 14px
    }

    .ttl {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px
    }

    .srow {
      display: flex;
      gap: 8px
    }

    .srow .field {
      flex: 1;
      min-width: 0;
      border-radius: 99px;
      min-height: 50px;
      padding: 0 12px 0 18px
    }

    .srow .ibtn {
      width: 50px;
      height: 50px
    }

    .sugg {
      border-radius: 24px;
      background: var(--surface);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      animation: rise .2s ease both
    }

    .sugg-h {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px 8px
    }

    .sugg-r {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 11px 18px
    }

    .sugg-r:hover {
      background: var(--fill)
    }

    .sugg-r .ico {
      width: 36px;
      height: 36px;
      border-radius: 12px
    }

    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px
    }

    .sortb {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font: 600 13px var(--fb);
      color: var(--ink)
    }

    .popb {
      display: flex;
      align-items: center;
      gap: 13px;
      width: 100%;
      padding: 14px 16px;
      border-radius: 22px;
      background: var(--btn);
      color: var(--btn-ink)
    }

    .popb .ico {
      background: var(--acc);
      color: #fff
    }

    /* ── Komplekt ── */
    .sumc {
      position: relative;
      padding: 20px;
      border-radius: 28px;
      background: var(--btn);
      color: var(--btn-ink);
      overflow: hidden
    }

    .sumc::after {
      content: "";
      position: absolute;
      right: -40px;
      top: -40px;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: var(--acc);
      opacity: .9;
      filter: blur(2px)
    }

    .sumc>* {
      position: relative;
      z-index: 1
    }

    .sumc .lbl {
      color: inherit;
      opacity: .55
    }

    .sumc-v {
      margin-top: 8px;
      font-size: 30px
    }

    .sumc-v small {
      color: inherit;
      opacity: .6
    }

    .sumc-n {
      margin-top: 8px;
      font: 500 12.5px var(--fb);
      opacity: .65
    }

    .presets {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .preset {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      padding: 16px;
      border-radius: 22px;
      background: var(--surface);
      border: 1.5px solid transparent;
      box-shadow: var(--shadow);
      text-align: left
    }

    .preset.on {
      border-color: var(--acc)
    }

    .preset.on .ico {
      background: var(--acc);
      color: #fff
    }

    .kitp {
      display: flex;
      gap: 14px;
      align-items: center
    }

    .kitp .pc-img {
      flex: none;
      width: 86px;
      height: 86px;
      border-radius: 20px
    }

    .mrail {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin: 0 -18px;
      padding: 0 18px
    }

    .mchip {
      flex: none;
      min-width: 86px;
      padding: 10px 12px;
      border-radius: 16px;
      background: var(--surface2);
      border: 1.5px solid transparent;
      text-align: left
    }

    .mchip b {
      display: block;
      font: 600 13px var(--fb)
    }

    .mchip small {
      display: block;
      margin-top: 3px;
      font: 500 11px var(--fb);
      color: var(--muted)
    }

    .mchip.on {
      background: var(--surface);
      border-color: var(--ink)
    }

    .hdds {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-top: 14px
    }

    .hdd {
      padding: 12px 2px;
      border-radius: 16px;
      background: var(--surface2);
      border: 1.5px solid transparent;
      text-align: center
    }

    .hdd b {
      display: block;
      font: 600 15px var(--fd)
    }

    .hdd small {
      display: block;
      font: 500 10px var(--fb);
      color: var(--muted);
      margin-top: 4px
    }

    .hdd.on {
      background: var(--surface);
      border-color: var(--acc)
    }

    .hdd.on small:first-of-type {
      color: var(--acc)
    }

    .thumbs {
      display: flex;
      gap: 10px;
      overflow-x: auto
    }

    .thumb {
      flex: none;
      width: 78px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center
    }

    .thumb .pc-img {
      width: 78px;
      height: 78px;
      border-radius: 18px
    }

    .thumb .q {
      position: absolute;
      right: 6px;
      bottom: 6px;
      font: 700 10px var(--fb);
      padding: 3px 6px;
      border-radius: 99px;
      background: var(--btn);
      color: var(--btn-ink)
    }

    .thumb small {
      font: 500 11px var(--fb);
      color: var(--muted);
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .thumb.add .pc-img {
      background: transparent;
      border: 1.5px dashed var(--line2);
      color: var(--acc)
    }

    .rcpt {
      padding: 20px;
      border-radius: 26px;
      background: var(--surface);
      box-shadow: var(--shadow);
      position: relative
    }

    .rcpt-tot {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding-top: 14px;
      margin-top: 8px;
      border-top: 1.5px dashed var(--line2)
    }

    .rcpt-tot .pr {
      font-size: 24px
    }

    /* ── Mutaxassis ── */
    .xhero {
      position: relative;
      padding: 22px;
      border-radius: 30px;
      color: #fff;
      background: linear-gradient(145deg, #ff7a3d, #ff4f12 45%, #d93a05);
      overflow: hidden
    }

    .xhero::after {
      content: "";
      position: absolute;
      right: -30px;
      bottom: -50px;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      border: 26px solid rgba(255, 255, 255, .12)
    }

    .xhero .ico {
      background: rgba(255, 255, 255, .2);
      color: #fff;
      position: relative
    }

    .xhero .ico::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      animation: glow 2s ease-out infinite
    }

    .xhero .h2 {
      margin-top: 16px;
      font-size: 22px
    }

    .xhero p {
      margin: 8px 0 0;
      font: 400 13px/1.45 var(--fb);
      color: rgba(255, 255, 255, .82);
      max-width: 260px
    }

    .xhero .tag {
      position: absolute;
      top: 22px;
      right: 22px;
      background: rgba(255, 255, 255, .95);
      color: #d93a05
    }

    .chans {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px
    }

    .chan {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      padding: 16px 6px;
      border-radius: 22px;
      background: var(--surface);
      border: 1.5px solid transparent;
      box-shadow: var(--shadow);
      font: 600 13px var(--fb)
    }

    .chan .ico {
      width: 44px;
      height: 44px
    }

    .chan.on {
      border-color: var(--acc)
    }

    .chan.on .ico {
      background: var(--acc);
      color: #fff
    }

    .slots {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px
    }

    .slots .chip {
      justify-content: center;
      height: 48px;
      border-radius: 16px
    }

    .done {
      text-align: center;
      padding: 30px 22px;
      border-radius: 28px;
      background: var(--surface);
      box-shadow: var(--shadow)
    }

    .done .okc {
      margin: 0 auto;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--ok);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: okPop .5s cubic-bezier(.2, 1.5, .5, 1) both
    }

    /* ── Profil ── */
    .pf {
      display: flex;
      align-items: center;
      gap: 14px
    }

    .ava {
      flex: none;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ff7a3d, #ff4f12);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font: 600 20px var(--fd);
      letter-spacing: -.03em
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--surface);
      border-radius: 24px;
      box-shadow: var(--shadow)
    }

    .stats>div {
      padding: 16px 14px
    }

    .stats>div+div {
      border-left: 1px solid var(--line)
    }

    .stats b {
      display: block;
      font: 600 24px/1 var(--fd);
      letter-spacing: -.04em
    }

    .stats span {
      display: block;
      margin-top: 6px;
      font: 500 12px var(--fb);
      color: var(--muted)
    }

    .subh {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .ord {
      background: var(--surface);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1.5px solid transparent
    }

    .ord.open {
      border-color: var(--line2)
    }

    .ord-h {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 16px
    }

    .ord-b {
      padding: 0 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .note {
      display: flex;
      gap: 12px;
      padding: 14px;
      border-radius: 18px;
      background: var(--acc-soft)
    }

    .note .ico {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--acc);
      color: #fff
    }

    .theme-c {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .theme-o {
      padding: 12px;
      border-radius: 22px;
      background: var(--surface);
      border: 1.5px solid transparent;
      box-shadow: var(--shadow);
      text-align: left
    }

    .theme-o.on {
      border-color: var(--acc)
    }

    .theme-pv {
      height: 70px;
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 11px
    }

    .theme-pv i {
      display: block;
      height: 8px;
      border-radius: 4px
    }

    /* ── Navigatsiya (suzuvchi) ── */
    .nav {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 16px;
      z-index: 15;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 7px;
      border-radius: 99px;
      background: var(--glass);
      backdrop-filter: blur(18px) saturate(1.4);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-lg)
    }

    .nav-i {
      position: relative;
      flex: 1;
      height: 52px;
      border-radius: 99px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: var(--muted);
      font: 600 13px var(--fb);
      transition: flex .3s cubic-bezier(.3, 1.2, .5, 1), background .2s ease, color .2s ease
    }

    .nav-i span {
      display: none;
      white-space: nowrap
    }

    .nav-i.on {
      flex: 2.3;
      background: var(--btn);
      color: var(--btn-ink)
    }

    .nav-i.on span {
      display: inline
    }

    .nav-i.ex:not(.on) {
      color: var(--acc)
    }

    .nav-i.ex:not(.on)::after {
      content: "";
      position: absolute;
      top: 11px;
      left: 50%;
      margin-left: 7px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--acc);
      box-shadow: 0 0 0 2px var(--glass);
      animation: glow 2s ease-out infinite
    }

    .toast {
      position: absolute;
      left: 16px;
      right: 16px;
      top: 12px;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 13px 16px;
      border-radius: 20px;
      background: var(--btn);
      color: var(--btn-ink);
      font: 600 13.5px/1.35 var(--fb);
      box-shadow: var(--shadow-lg);
      animation: sheetIn .3s cubic-bezier(.2, 1.2, .4, 1) both
    }

    .toast .dot {
      flex: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--acc);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center
    }

    /* ── Qatlamlar va varaqlar ── */
    .ov {
      position: absolute;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      animation: fadeIn .2s ease both
    }

    .ov-h {
      flex: none;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 18px 12px
    }

    .ov-s {
      flex: 1;
      overflow: auto
    }

    .ov-f {
      flex: none;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px 22px;
      background: var(--bg);
      border-top: 1px solid var(--line)
    }

    .scrim {
      position: absolute;
      inset: 0;
      background: var(--scrim);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      animation: fadeIn .2s ease both
    }

    .sheet {
      max-height: 90%;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      border-radius: 32px 32px 0 0;
      box-shadow: var(--shadow-lg);
      animation: sheetIn .32s cubic-bezier(.2, 1.1, .4, 1) both
    }

    .sheet::before {
      content: "";
      flex: none;
      align-self: center;
      width: 40px;
      height: 5px;
      border-radius: 3px;
      background: var(--line2);
      margin: 10px 0 2px
    }

    .sheet-h {
      flex: none;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 20px 14px
    }

    .sheet-b {
      flex: 1;
      overflow: auto;
      padding: 2px 20px 18px
    }

    .sheet-f {
      flex: none;
      display: flex;
      gap: 10px;
      padding: 12px 20px 22px;
      border-top: 1px solid var(--line)
    }

    /* ── Mahsulot sahifasi ── */
    .det-hero {
      position: relative;
      margin: 0 12px;
      height: 360px;
      border-radius: 34px;
      background: var(--surface2);
      overflow: hidden
    }

    .det-bar {
      position: absolute;
      left: 14px;
      right: 14px;
      top: 14px;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between
    }

    .det-sku {
      font: 600 12px var(--fb);
      letter-spacing: .04em;
      padding: 7px 12px;
      border-radius: 99px;
      background: var(--glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px)
    }

    .det-img {
      position: absolute;
      inset: 64px 26px 76px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 700px
    }

    .det-img>div {
      width: 100%;
      height: 100%;
      background: var(--surface2);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .35s ease
    }

    .det-spin {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .det-spin .mid {
      flex: 1;
      height: 46px;
      border-radius: 99px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font: 600 12.5px var(--fb);
      background: var(--glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--line)
    }

    .det-spin .mid.on {
      background: var(--acc);
      color: #fff;
      border-color: transparent
    }

    .det-dots {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 22px;
      z-index: 3;
      display: flex;
      justify-content: center;
      gap: 6px
    }

    .det-dots button {
      width: 8px;
      height: 8px;
      border-radius: 4px;
      background: var(--line2);
      transition: width .2s ease
    }

    .det-dots button.on {
      width: 22px;
      background: var(--ink)
    }

    .det-body {
      padding: 22px 20px 26px;
      display: flex;
      flex-direction: column;
      gap: 18px
    }

    .det-price {
      font-size: 28px
    }

    .specs {
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden
    }

    .specs>div {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 13px 16px;
      font: 400 13.5px var(--fb);
      color: var(--muted)
    }

    .specs>div+div {
      border-top: 1px solid var(--line)
    }

    .specs>div span:last-child {
      color: var(--ink);
      font-weight: 600;
      text-align: right
    }

    .warr {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 20px;
      background: var(--ok-soft);
      color: var(--ok);
      font: 600 13.5px var(--fb)
    }

    /* ── Story ── */
    .story {
      position: absolute;
      inset: 0;
      z-index: 24;
      background: #0a0908;
      color: #fff;
      display: flex;
      flex-direction: column;
      animation: fadeIn .2s ease both
    }

    .story-bars {
      display: flex;
      gap: 4px;
      padding: 14px 16px 0
    }

    .story-bars>div {
      flex: 1;
      height: 3px;
      border-radius: 2px;
      background: rgba(255, 255, 255, .25);
      overflow: hidden
    }

    .story-bars>div>div {
      height: 100%;
      background: #fff
    }

    .story-view {
      flex: 1;
      position: relative;
      margin: 12px;
      border-radius: 28px;
      overflow: hidden;
      background:
        radial-gradient(120% 80% at 80% 0%, rgba(255, 106, 51, .35), transparent 60%),
        radial-gradient(90% 70% at 0% 100%, rgba(123, 150, 255, .25), transparent 60%),
        #171412;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .story-tap {
      position: absolute;
      inset: 0;
      display: flex;
      z-index: 1
    }

    .story-tap>div {
      flex: 1;
      cursor: pointer
    }

    /* Layk / izoh / ulashish ustuni */
    .st-act {
      position: absolute;
      right: 10px;
      bottom: 16px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 14px
    }

    .st-ab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #fff;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent

    .st-ab .st-ai {

      border-radius: 50%;
      display: flex;
      align-items: center;

      background: rgba(255, 255, 255, .13);

    .st-burst {

    /* ═══════════════════════════════════════════════════════════
       Bosh sahifa FX — illyuziya va harakat
       Doimiy (ambient) animatsiyalar `--now` orqali vaqtga bog'langan:
       render() har safar qayta chizganda ham faza uzilmaydi.
       Kirish animatsiyalari faqat `.intro` (tabga birinchi kirish) paytida.
       Transform bilan to'qnashmaslik uchun kirishlar `translate/scale/rotate`
       alohida xossalarida, 3D qiyalik esa `transform` da.
       ═══════════════════════════════════════════════════════════ */
    @keyframes wordUp {
      from { translate: 0 110%; rotate: 6deg }
      to { translate: 0 0; rotate: 0deg }
    }

    @keyframes riseP {
      from { opacity: 0; translate: 0 24px }
      to { opacity: 1; translate: 0 0 }
    }

    @keyframes popP {
      from { opacity: 0; scale: .55 }
      to { opacity: 1; scale: 1 }
    }

    @keyframes eyeIn {
      from { opacity: 0; scale: .3; rotate: -140deg }
      to { opacity: 1; scale: 1; rotate: 0deg }
    }

    @keyframes shut {
      0%, 90%, 100% { transform: scaleY(1) }
      93% { transform: scaleY(.06) }
      96% { transform: scaleY(1) }
    }

    @keyframes sheen {
      from { background-position: 200% 0 }
      to { background-position: -200% 0 }
    }

    @keyframes caret {
      50% { opacity: 0 }
    }

    @keyframes kb {
      from { transform: scale(1.02) }
      to { transform: scale(1.14) }
    }

    @keyframes kb2 {
      from { transform: scale(1.02) translate(0, 0) }
      to { transform: scale(1.16) translate(-3%, -2%) }
    }

    @keyframes shutter {
      from { clip-path: circle(0% at 88% 84%) }
      to { clip-path: circle(150% at 88% 84%) }
    }

    @keyframes fill {
      from { width: 0 }
      to { width: 100% }
    }

    @keyframes floor {
      to { background-position: 0 24px, 0 24px }
    }

    @keyframes sonar {
      0% { transform: scale(1); opacity: .85 }
      100% { transform: scale(2.5); opacity: 0 }
    }

    @keyframes lay1 {
      0%, 100% { transform: translateY(-4px) scaleY(.55) rotate(45deg) }
      50% { transform: translateY(-11px) scaleY(.55) rotate(45deg) }
    }

    @keyframes lay3 {
      0%, 100% { transform: translateY(4px) scaleY(.55) rotate(45deg) }
      50% { transform: translateY(11px) scaleY(.55) rotate(45deg) }
    }

    @keyframes sweepX {
      0% { background-position: 160% 0 }
      45%, 100% { background-position: -60% 0 }
    }

    /* sahifa faqat kirishda yumshoq paydo bo'ladi (har 5 soniyalik qayta chizishda emas) */
    .pg { animation: none }
    .intro #scroller>.pg { animation: fadeIn .3s ease both }

    /* ── Hero: so'zma-so'z ochilish, yaltiroq urg'u ── */
    .hero { position: relative }
    .hero .h1 { position: relative; z-index: 1 }
    .w { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 .04em .16em 0; margin-bottom: -.16em }
    .w>span { display: inline-block }
    .intro .hero .w>span { animation: wordUp .95s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: calc(var(--i) * 110ms + 140ms) }
    .intro .hero .eyebrow { animation: riseP .6s ease backwards }
    .intro .hero .search { animation: riseP .8s cubic-bezier(.2, .8, .2, 1) .5s backwards }

    .sheen {
      background: linear-gradient(100deg, var(--acc) 0%, var(--acc) 38%, #ffc46b 50%, var(--acc) 62%, var(--acc) 100%);
      background-size: 250% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent !important;
      animation: sheen 5s linear infinite
    }

    /* ── Kuzatuvchi linza: moire halqalar, radar, ko'zni kuzatuvchi qorachiq ── */
    .eye {
      position: absolute;
      right: -4px;
      top: 30px;
      width: 112px;
      height: 112px;
      pointer-events: none;
      transform: translateY(calc(var(--sy, 0) * .22px))
    }

    .intro .eye { animation: eyeIn 1.15s cubic-bezier(.2, .9, .2, 1) .15s backwards }
    .eye i { position: absolute; border-radius: 50% }
    .er1 { inset: 0; border: 1.5px dashed var(--line2); animation: spin 36s linear infinite }

    .er2 {
      inset: 7px;
      background: repeating-conic-gradient(var(--ink) 0 1.6deg, transparent 1.6deg 8deg);
      -webkit-mask: radial-gradient(closest-side, transparent 80%, #000 81% 98%, transparent 100%);
      mask: radial-gradient(closest-side, transparent 80%, #000 81% 98%, transparent 100%);
      opacity: .32;
      animation: spin 24s linear infinite reverse
    }

    .er3 {
      inset: 14px;
      background: repeating-conic-gradient(var(--acc) 0 1.4deg, transparent 1.4deg 7deg);
      -webkit-mask: radial-gradient(closest-side, transparent 83%, #000 84% 98%, transparent 100%);
      mask: radial-gradient(closest-side, transparent 83%, #000 84% 98%, transparent 100%);
      opacity: .85;
      animation: spin 18s linear infinite
    }

    .esweep {
      inset: 14px;
      background: conic-gradient(from 0deg, transparent 0 290deg, rgba(255, 79, 18, .42) 360deg);
      animation: spin 4s linear infinite
    }

    .eye-iris {
      position: absolute;
      inset: 27px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #46413c, #0d0c0b 72%);
      box-shadow: inset 0 0 0 3px #26231f, 0 10px 26px rgba(0, 0, 0, .35);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      animation: shut 6s ease-in-out infinite
    }

    .eye-iris::before {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      background: repeating-conic-gradient(rgba(255, 255, 255, .07) 0 12deg, transparent 12deg 24deg)
    }

    .eye-pupil {
      position: relative;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffb07a 0, #ff5a1f 34%, #8a2200 68%, #1a0904 100%);
      box-shadow: 0 0 16px 3px rgba(255, 90, 31, .6);
      transform: translate(calc(var(--ex, 0) * 12px), calc(var(--ey, 0) * 12px))
    }

    .eye-pupil::after {
      content: "";
      position: absolute;
      left: 5px;
      top: 4px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .85)
    }

    .eye-rec {
      position: absolute;
      left: 50%;
      bottom: -6px;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 7px;
      border-radius: 99px;
      background: var(--btn);
      color: var(--btn-ink);
      font: 700 9px var(--fb);
      letter-spacing: .12em
    }

    .eye-rec::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ff3b30;
      animation: blink 1.2s steps(1, end) infinite
    }

    /* ── Qidiruv: yozuv mashinkasi ── */
    .search em { font-style: normal }
    .tw { color: var(--ink); font-weight: 600 }

    .caret {
      display: inline-block;
      width: 2px;
      height: 1.05em;
      margin-left: 2px;
      vertical-align: -3px;
      background: var(--acc);
      animation: caret 1s steps(1, end) infinite
    }

    /* ── Storylar: aylanuvchi halqa, ketma-ket paydo bo'lish ── */
    .st-ring { position: relative; overflow: hidden }
    .st.fresh .st-ring { background: var(--line2) }

    .st.fresh .st-ring::before {
      content: "";
      position: absolute;
      inset: -40%;
      background: conic-gradient(var(--acc), #ffb020, #ff2d55, var(--acc));
      animation: spin 4s linear infinite;
      animation-delay: var(--now, 0s)
    }

    .st-in { position: relative; z-index: 1; transition: scale .2s ease }
    .st:active .st-in { scale: .92 }
    .intro .st { animation: popP .55s cubic-bezier(.2, 1.3, .4, 1) backwards; animation-delay: calc(var(--i) * 60ms + 420ms) }

    /* ── 3D qiyalik va yaltirash (JS --tx/--ty beradi) ── */
    .tilt,
    .tilt:active {
      transform: perspective(900px) rotateX(calc(var(--ty, 0) * -5deg)) rotateY(calc(var(--tx, 0) * 7deg)) scale(var(--press, 1))
    }

    .bt { transition: none; isolation: isolate }
    .bt:active { --press: .97 }

    .glare {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      border-radius: inherit;
      background: radial-gradient(circle at calc(50% + var(--tx, 0) * 50%) calc(50% + var(--ty, 0) * 50%), rgba(255, 255, 255, .38), transparent 60%);
      opacity: 0;
      transition: opacity .35s ease;
      mix-blend-mode: overlay
    }

    .tilt.hov .glare { opacity: 1 }

    /* ── Banner: Ken Burns, parallaks, diafragma (shutter) almashinuvi, progress ── */
    .bn { isolation: isolate }

    .bn-par {
      position: absolute;
      inset: -12px;
      transform: translate3d(calc(var(--tx, 0) * -8px), calc(var(--ty, 0) * -8px), 0)
    }

    .bn-par>.bn-media,
    .bn-par>.bn-art { animation: kb 9s ease-out both }
    .bn.swap .bn-par { animation: shutter .85s cubic-bezier(.7, 0, .2, 1) both }
    .bn-body { animation: none }
    .bn.swap .bn-body,
    .intro .bn-body { animation: riseP .6s cubic-bezier(.2, .8, .2, 1) .2s backwards }
    .bn-prog i { position: relative; overflow: hidden }
    .bn-prog i.on { background: rgba(255, 255, 255, .3) }

    .bn-prog i.on b {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0;
      background: #fff;
      border-radius: inherit;
      animation: fill 5s linear both
    }

    .intro .bn { animation: riseP .9s cubic-bezier(.2, .8, .2, 1) .55s backwards }

    /* ── Bento: perspektiv pol, sonar, qatlamlar ── */
    .floor {
      position: absolute;
      left: -45%;
      right: -45%;
      bottom: -6px;
      height: 64%;
      z-index: -1;
      pointer-events: none;
      background-image:
        linear-gradient(color-mix(in srgb, currentColor 18%, transparent) 1.5px, transparent 1.5px),
        linear-gradient(90deg, color-mix(in srgb, currentColor 18%, transparent) 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      transform: perspective(140px) rotateX(62deg);
      transform-origin: 50% 100%;
      -webkit-mask: linear-gradient(to top, #000 15%, transparent 92%);
      mask: linear-gradient(to top, #000 15%, transparent 92%);
      animation: floor 1.6s linear infinite
    }

    .bt.cat::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 30%;
      height: 70px;
      z-index: -1;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 100%, rgba(255, 79, 18, .42), transparent 70%)
    }

    .stack {
      position: relative;
      flex: none;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: var(--acc-soft);
      margin-bottom: auto
    }

    .stack i {
      position: absolute;
      left: 11px;
      top: 11px;
      width: 20px;
      height: 20px;
      border-radius: 5px;
      border: 2px solid var(--acc);
      background: var(--surface)
    }

    .stack i:nth-child(1) { z-index: 3; background: var(--acc); animation: lay1 3s ease-in-out infinite; animation-delay: var(--now, 0s) }
    .stack i:nth-child(2) { z-index: 2; transform: scaleY(.55) rotate(45deg) }
    .stack i:nth-child(3) { z-index: 1; animation: lay3 3s ease-in-out infinite; animation-delay: var(--now, 0s) }

    .sonar i {
      position: absolute;
      left: 16px;
      top: 16px;
      width: 42px;
      height: 42px;
      z-index: -1;
      border-radius: 14px;
      border: 2px solid rgba(255, 255, 255, .75);
      pointer-events: none;
      animation: sonar 2.4s cubic-bezier(.2, .6, .3, 1) infinite;

    }

    /* ── 3D tur kartasi: sekin kamera harakati, skaner nuri, jonli nuqtalar ── */

      inset: 0;
      z-index: -1;

    }

      content: "";

    /* ── Scroll bilan ochilish (IntersectionObserver `.in` qo'yadi) ── */

      transition-delay: calc(var(--i, 0) * 70ms)
    }

    .rv .rs.pop { translate: 0 0; scale: .7 }
    .rv.in .rs { opacity: 1; translate: 0 0; scale: 1 }
    .cat-i .ico { transition: transform .35s cubic-bezier(.2, 1.4, .4, 1) }

    /* ── Katalog: asosiy kataloglar sahifasi ── */

    .ccat {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
      min-height: 168px;
      padding: 16px;
      border-radius: 24px;
      background: var(--surface);
      box-shadow: var(--shadow);
      text-align: left;
      overflow: hidden;
      transition: transform .2s ease
    }

    .ccat:active { transform: scale(.97) }
    .ccat-go { position: absolute; top: 16px; right: 16px; color: var(--faint) }

    .ccat-ic {
      flex: none;
      width: 46px;
      height: 46px;
      border-radius: 16px;
      background: var(--surface2);
      color: var(--ink);

      align-items: center;
      justify-content: center;

      transition: transform .35s cubic-bezier(.2, 1.4, .4, 1)
    }

    .ccat-th i {
      width: 30px;
      height: 30px;
      margin-left: -9px;

      align-items: center;

    .ccat.hot { grid-column: span 2; min-height: 150px; background: var(--btn); color: var(--btn-ink) }
    .ccat.hot .ccat-ic { background: var(--acc); color: #fff }

    .wz-ava {

    }

    .wz-msg { flex: 1; min-width: 0; padding: 14px 16px; border-radius: 6px 22px 22px 22px; background: var(--surface); box-shadow: var(--shadow) }
    .wz-msg b { display: block; font: 600 17px/1.25 var(--fd); letter-spacing: -.02em }

    .wz-z {

    }

    }

    .wz-line { display: flex; gap: 12px; padding: 12px; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); animation: riseP .5s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: calc(var(--i, 0) * 70ms) }

    /* vaqtga bog'langan doimiy animatsiyalar */
    .sync { animation-delay: var(--now, 0s) }

    @media (prefers-reduced-motion: reduce) {

      .shell *,

      }

      .rv .rs { opacity: 1; translate: none; scale: none }
    }
  </style>
</head>
