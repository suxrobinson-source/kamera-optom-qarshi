<script>
/* ═══════════════════════════════════════════════════════════
   KAMERA OPTOM QARSHI — mijoz ilovasi
   Claude Design kanvasidagi "1a" prototipining aynan ko'chirmasi
   ═══════════════════════════════════════════════════════════ */
const A='var(--acc)', RED='#ff4d3d', AMB='#ffb020';
const M=n=>n.toLocaleString('ru-RU').replace(/,/g,' ');
const fmt=n=>M(n)+" so'm";
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const DATA = {
  products: [],
  banners: [],
  stories: [],
  regions: [],
  categories: [],
  config: null,
  ready: false,
  error: null
};

async function j(url, opt={}){
  const r = await fetch(url, opt);
  if (!r.ok) {
    const errData = await r.json().catch(()=>({}));
    throw new Error(errData.error || ('HTTP ' + r.status));
  }
  return r.json();
}

async function bootstrap(){
  try {
    const [products, banners, stories, regions, categories, config] = await Promise.all([
      j('/api/products'),
      j('/api/banners'),
      j('/api/stories'),
      j('/api/regions'),
      j('/api/categories').catch(() => []),
      j('/api/config')
    ]);
    DATA.products = (products || []).map(p => ({
      ...p,
      stock: 'Omborda ' + (p.qty ?? 0)
    }));
    DATA.banners = banners || [];
    DATA.stories = (stories || []).map(s => ({
      ...s,
      views: s.views != null ? (typeof s.views === 'number' ? M(s.views) : s.views) : '0'
    }));
    DATA.regions = regions || [];
    DATA.categories = categories || [];
    DATA.config = config || {};
    DATA.ready = true;
    DATA.error = null;

    if (config && config.modules) {
      S.mod = { ...(S.mod || {}), ...config.modules };
    }
    if (config && config.credit && config.credit.rates) {
      S.rates = config.credit.rates;
    }
    if (config && config.credit && config.credit.down) {
      S.down = config.credit.down;
    }
    await syncMyOrders();
  } catch(e) {
    DATA.error = 'Ma\'lumot yuklanmadi — internetni tekshiring';
  }
  render();
}

async function syncMyOrders(){
  if (!S.myPhone) return;
  const rawPh = String(S.myPhone).replace(/[^0-9]/g,'');
  if (rawPh.length !== 9) return;
  try {
    const orders = await j('/api/orders/my?phone=' + rawPh);
    if (Array.isArray(orders)) {
      const orderStatus = { ...S.orderStatus };
      const notes = { ...S.notes };
      const myOrders = orders.map(o => {
        orderStatus[o.id] = o.status || 'Yangi';
        if (o.note) {
          notes[o.id] = { text: o.note, time: o.updated_at ? o.updated_at.slice(5, 16) : 'Menejer xabari' };
        }
        const itemStr = (Array.isArray(o.items) && o.items.length)
          ? o.items.map(it => (it.name || it.sku) + (it.qty > 1 ? ' × ' + it.qty : '')).join(', ')
          : (o.region || 'Buyurtma');
        const skus = Array.isArray(o.items) ? o.items.map(it => [it.sku, it.qty]) : [['IPC-2410', 1]];
        const dStr = o.created_at ? o.created_at.slice(0, 10) : 'Bugun';
        return {
          id: o.id,
          name: itemStr,
          date: dStr,
          sum: fmt(o.total || o.goods_sum || 0),
          status: (o.status || 'Yangi').toUpperCase(),
          skus,
          addr: o.address ? `${o.region || ''} · ${o.address}` : (o.region || ''),
          rcp: o.recipient_name ? `${o.recipient_name} · +998 ${o.recipient_phone}` : `+998 ${o.phone}`,
          install: o.install,
          install_at: o.install_at,
          cloud: o.cloud
        };
      });
      set({ myOrders, orderStatus, notes });
    }
  } catch(e) {}
}

function _loadStorage(key, def) {
  try {
    const val = localStorage.getItem(key);
    return val ? JSON.parse(val) : def;
  } catch(e) {
    return def;
  }
}
function _loadStr(key, def) {
  try {
    const val = localStorage.getItem(key);
    return val != null ? val : def;
  } catch(e) {
    return def;
  }
}

const S={
  tab:'home', sel:null, cat:'Hammasi', poe:false, mp:false, night:false,
  cams:4, cable:60, cableUse:false, kStep:1, preset:null, camSku:'IPC-2410', kitExtra:{},
  promo:{'IPC-2410':'HIT','KIT-UY4':'CHEGIRMA','PTZ-5X':'YANGI'},
  labelOn:{HIT:true,CHEGIRMA:true,YANGI:true},
  mod:{banners:true,stories:true,gps:true,memory:true,cable:true,install:true,cloud:true},
  install:false, cloud:false, toast:null, hdd:'64 GB', creditTerm:12,
  rates:{3:0,6:8,12:14,24:26}, rateOn:{3:true,6:true,12:true,24:true}, down:{3:0,6:10,12:20,24:30},
  q:'', sort:'price-asc', view:'grid', suggest:false, filters:false, band:null,
  recent:_loadStorage('ko_recent',['4MP','PoE','komplekt']), theme:_loadStr('ko_theme','night'), creditService:true, expertService:true,
  cb:'idle', cbName:'', cbPhone:'', cbNote:'', cbSlot:'Tezroq', topic:null, channel:'Telefon', expStep:1,
  hddUse:false, creditUse:false, bag:_loadStorage('ko_bag',{}), added:null, ok:null, story:null, seen:_loadStorage('ko_seen',{}),
  ph:null, phVal:'', phStep:'enter', myPhone:_loadStr('ko_my_phone',null),
  storyList:[],
  bagOpen:false, bagInstall:false, bagCloud:false, provider:'Uzum Nasiya',
  provOn:{'Uzum Nasiya':true,'Alif Nasiya':true,'Hamkor Nasiya':true},
  region:_loadStr('ko_region','Qarshi shahri'), regionOpen:false, bannerIdx:0, rq:'', gpsState:'idle',
  orderStatus:{}, notes:{}, myOrders:_loadStorage('ko_my_orders',[]), openOrd:null, profPage:'', lang:'uz',
  pushOn:true, promoPushOn:false, spinDeg:0, spinning:false,
  addrList:_loadStorage('ko_addr_list',[{id:'a1',label:'Uy',text:"Qarshi sh., Mustaqillik ko'chasi 12, 4-xonadon",note:'Kirish eshigi kodi 1204'}]),
  addrSel:_loadStr('ko_addr_sel','a1'), addrForm:false, naLabel:'Uy', naText:'', naNote:'',
  rcpSelf:true, rcpName:'', rcpPhone:''
};
window.S = S;
window.DATA = DATA;

/* ── handler registry ── */
let H=[];
const h=fn=>`_h(${H.push(fn)-1},event)`;
window._h=(i,e)=>{ const f=H[i]; if(f) f(e); };

let _t=null,_g=null,_sp=null,_pushingState=false;
let _storyTimer=null, _storyStartTime=0, _storyRemaining=6000, _storyPaused=false;

function _clearStoryTimer(){
  if(_storyTimer){ clearTimeout(_storyTimer); _storyTimer=null; }
}
function _startStoryTimer(ms=6000){
  _clearStoryTimer();
  _storyRemaining=ms;
  _storyStartTime=Date.now();
  _storyPaused=false;
  _storyTimer=setTimeout(()=>{
    if(S.story!==null){
      const list=(DATA.stories&&DATA.stories.length)?DATA.stories:(S.storyList||[]);
      const n=S.story+1;
      if(n>=list.length){
        _clearStoryTimer();
        set({story:null});
      } else {
        set(p=>({story:n,seen:{...p.seen,[list[n].id]:true}}));
        _startStoryTimer(6000);
      }
    }
  }, ms);
}
function _pauseStoryTimer(){
  if(_storyTimer && !_storyPaused){
    clearTimeout(_storyTimer);
    _storyTimer=null;
    const elapsed=Date.now()-_storyStartTime;
    _storyRemaining=Math.max(200, _storyRemaining-elapsed);
    _storyPaused=true;
    render();
  }
}
function _resumeStoryTimer(){
  if(_storyPaused && S.story!==null){
    _startStoryTimer(_storyRemaining);
    render();
  }
}

function _hasOverlay(st){
  return !!(st.sel || st.story !== null || st.ph || st.bagOpen || st.regionOpen || st.filters || st.profPage || st.added || st.ok);
}

function set(o){
  const prevOverlay = _hasOverlay(S);
  Object.assign(S, typeof o==='function'?o(S):o);
  const nextOverlay = _hasOverlay(S);

  if (!prevOverlay && nextOverlay && !_pushingState) {
    try {
      if (window.history && window.history.pushState) {
        window.history.pushState({ koOverlay: true }, '');
      }
    } catch(e){}
  }

  try {
    localStorage.setItem('ko_bag', JSON.stringify(S.bag || {}));
    if (S.myPhone) localStorage.setItem('ko_my_phone', S.myPhone);
    localStorage.setItem('ko_recent', JSON.stringify(S.recent || []));
    localStorage.setItem('ko_seen', JSON.stringify(S.seen || {}));
    localStorage.setItem('ko_theme', S.theme || 'night');
    localStorage.setItem('ko_region', S.region || 'Qarshi shahri');
    localStorage.setItem('ko_my_orders', JSON.stringify(S.myOrders || []));
    localStorage.setItem('ko_addr_list', JSON.stringify(S.addrList || []));
    localStorage.setItem('ko_addr_sel', S.addrSel || 'a1');
  } catch(e){}
  render();
}

if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('popstate', ()=>{
    _pushingState = true;
    try {
      if (S.sel) { set({ sel: null, spinning: false }); return; }
      if (S.story !== null) { _clearStoryTimer(); set({ story: null }); return; }
      if (S.ph) { set({ ph: null }); return; }
      if (S.bagOpen) { set({ bagOpen: false }); return; }
      if (S.regionOpen) { set({ regionOpen: false }); return; }
      if (S.filters) { set({ filters: false }); return; }
      if (S.profPage) { set({ profPage: '' }); return; }
      if (S.added) { set({ added: null }); return; }
      if (S.ok) { set({ ok: null }); return; }
      if (S.tab !== 'home') { set({ tab: 'home' }); return; }
    } finally {
      _pushingState = false;
    }
  });
}
function flash(t){ S.toast=t; clearTimeout(_t); _t=setTimeout(()=>{S.toast=null;render();},2200); render(); }
function addBag(sku){ set(st=>({ bag: { ...st.bag, [sku]: (st.bag[sku]||0)+1 }, added: sku })); }
window.addBag = addBag;
function promoStyle(k){ return ({HIT:{fg:'#2a1a00',bg:'#ffb020',border:'#ffb020'},CHEGIRMA:{fg:'#ffffff',bg:'#ff4d3d',border:'#ff4d3d'},YANGI:{fg:'#06231d',bg:'#2fe0b6',border:'#2fe0b6'}})[k]||{fg:'var(--dim2)',bg:'var(--fill)',border:'var(--line3)'}; }

function prodSvg(p, w=48, h=48){
  const sku = (p && p.sku) || '';
  const cat = (p && p.cat) || '';
  const acc = 'var(--acc, #2fe0b6)';
  const dim = 'var(--dim3, #9fb0ad)';
  const bg = 'var(--tile, #14181a)';

  if (cat === 'Tashqi' || sku.startsWith('IPC')) {
    return `<svg width="${w}" height="${h}" viewBox="0 0 64 64" fill="none"><rect x="8" y="24" width="34" height="16" rx="4" fill="${bg}" stroke="${dim}" stroke-width="2"/><path d="M42 27L54 20V44L42 37V27Z" fill="${bg}" stroke="${dim}" stroke-width="2"/><circle cx="20" cy="32" r="5" fill="${acc}" fill-opacity="0.3" stroke="${acc}" stroke-width="2"/><circle cx="20" cy="32" r="2" fill="${acc}"/><path d="M16 40V50H28" stroke="${dim}" stroke-width="2" stroke-linecap="round"/><circle cx="34" cy="28" r="1.5" fill="#ff4d3d"/></svg>`;
  }
  if (cat === 'Aylanuvchi' || sku.startsWith('PTZ')) {
    return `<svg width="${w}" height="${h}" viewBox="0 0 64 64" fill="none"><path d="M12 24C12 16 20 12 32 12C44 12 52 16 52 24V28H12V24Z" fill="${bg}" stroke="${dim}" stroke-width="2"/><circle cx="32" cy="36" r="16" fill="${bg}" stroke="${dim}" stroke-width="2"/><circle cx="32" cy="36" r="8" fill="${acc}" fill-opacity="0.25" stroke="${acc}" stroke-width="2"/><circle cx="32" cy="36" r="3.5" fill="${acc}"/><path d="M22 28H42" stroke="${dim}" stroke-width="2"/></svg>`;
  }
  if (cat === 'Yozuvchi' || sku.startsWith('NVR') || sku.startsWith('DVR')) {
    return `<svg width="${w}" height="${h}" viewBox="0 0 64 64" fill="none"><rect x="8" y="22" width="48" height="20" rx="3" fill="${bg}" stroke="${dim}" stroke-width="2"/><line x1="14" y1="28" x2="30" y2="28" stroke="${dim}" stroke-width="1.5" stroke-linecap="round"/><line x1="14" y1="34" x2="24" y2="34" stroke="${dim}" stroke-width="1.5" stroke-linecap="round"/><circle cx="42" cy="32" r="2" fill="${acc}"/><circle cx="48" cy="32" r="2" fill="#ffb020"/><rect x="36" y="26" width="16" height="12" rx="2" stroke="${dim}" stroke-width="1" stroke-dasharray="2 2"/></svg>`;
  }
  if (cat === 'Ichki' || sku.startsWith('WIFI')) {
    return `<svg width="${w}" height="${h}" viewBox="0 0 64 64" fill="none"><path d="M22 48H42V52H22V48Z" fill="${dim}"/><path d="M30 42V48H34V42" fill="${dim}"/><circle cx="32" cy="26" r="14" fill="${bg}" stroke="${dim}" stroke-width="2"/><circle cx="32" cy="26" r="7" fill="${acc}" fill-opacity="0.3" stroke="${acc}" stroke-width="2"/><circle cx="32" cy="26" r="2.5" fill="${acc}"/><path d="M42 16C45 19 47 22 47 26" stroke="${acc}" stroke-width="1.5" stroke-linecap="round"/><path d="M46 12C50 16 52 21 52 26" stroke="${acc}" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/></svg>`;
  }
  if (cat === 'Domofon' || sku.startsWith('DOMO')) {
    return `<svg width="${w}" height="${h}" viewBox="0 0 64 64" fill="none"><rect x="14" y="10" width="36" height="44" rx="4" fill="${bg}" stroke="${dim}" stroke-width="2"/><rect x="18" y="14" width="28" height="20" rx="2" fill="rgba(47,224,182,0.12)" stroke="${acc}" stroke-width="1.5"/><circle cx="32" cy="24" r="4" fill="${acc}"/><circle cx="32" cy="42" r="5" fill="${bg}" stroke="${dim}" stroke-width="2"/><path d="M30 42H34" stroke="${dim}" stroke-width="1.5"/></svg>`;
  }
  if (cat === 'Xotira' || sku.startsWith('SD') || sku.startsWith('HDD')) {
    if (sku.startsWith('HDD')) {
      return `<svg width="${w}" height="${h}" viewBox="0 0 64 64" fill="none"><rect x="12" y="14" width="40" height="36" rx="4" fill="${bg}" stroke="${dim}" stroke-width="2"/><circle cx="32" cy="32" r="11" stroke="${dim}" stroke-width="1.5"/><circle cx="32" cy="32" r="4" fill="${acc}"/><path d="M32 32L40 24" stroke="${acc}" stroke-width="1.5" stroke-linecap="round"/></svg>`;
    }
    return `<svg width="${w}" height="${h}" viewBox="0 0 64 64" fill="none"><path d="M18 16H40L46 22V48H18V16Z" fill="${bg}" stroke="${dim}" stroke-width="2"/><line x1="22" y1="20" x2="22" y2="26" stroke="${acc}" stroke-width="2" stroke-linecap="round"/><line x1="26" y1="20" x2="26" y2="26" stroke="${acc}" stroke-width="2" stroke-linecap="round"/><line x1="30" y1="20" x2="30" y2="26" stroke="${acc}" stroke-width="2" stroke-linecap="round"/><rect x="22" y="34" width="20" height="8" rx="1.5" fill="rgba(47,224,182,0.15)"/></svg>`;
  }
  if (cat === 'Komplekt' || sku.startsWith('KIT')) {
    return `<svg width="${w}" height="${h}" viewBox="0 0 64 64" fill="none"><rect x="14" y="28" width="36" height="18" rx="3" fill="${bg}" stroke="${dim}" stroke-width="2"/><circle cx="42" cy="37" r="2" fill="${acc}"/><path d="M10 16L22 16L28 22L16 22Z" fill="${bg}" stroke="${acc}" stroke-width="1.5"/><path d="M36 16L48 16L54 22L42 22Z" fill="${bg}" stroke="${acc}" stroke-width="1.5"/><circle cx="16" cy="19" r="1.5" fill="${acc}"/><circle cx="42" cy="19" r="1.5" fill="${acc}"/></svg>`;
  }

}

function normText(str){

const LOTIN_TO_KIRILL = {
  "yo'": "йў", "yo": "ё", "yu": "ю", "ya": "я", "ye": "е", "sh": "ш", "ch": "ч", "o'": "ў", "g'": "ғ",
  "a": "а", "b": "б", "d": "д", "e": "е", "f": "ф", "g": "г", "h": "ҳ", "i": "и", "j": "ж", "k": "к",
  "l": "л", "m": "м", "n": "н", "o": "о", "p": "п", "q": "қ", "r": "р", "s": "с", "t": "т", "u": "у",
  "v": "в", "x": "х", "y": "й", "z": "з", "'": "ъ"
};

const KIRILL_TO_LOTIN = {
  "ё": "yo", "ю": "yu", "я": "ya", "ш": "sh", "ч": "ch", "ў": "o'", "ғ": "g'", "қ": "q", "ҳ": "h", "ж": "j",
  "а": "a", "б": "b", "в": "v", "г": "g", "д": "d", "е": "e", "з": "z", "и": "i", "й": "y", "к": "k",
  "л": "l", "m": "m", "н": "n", "о": "o", "п": "p", "р": "r", "с": "s", "т": "t", "у": "u", "ф": "f",
  "х": "x", "ц": "ts", "ъ": "'", "ь": "", "э": "e"
};

function toLotin(str){
  let s = normText(str);
  for (const [k, v] of Object.entries(KIRILL_TO_LOTIN)) s = s.replaceAll(k, v);
  return s;
}

function toKirill(str){
  let s = normText(str);
  for (const [k, v] of Object.entries(LOTIN_TO_KIRILL)) s = s.replaceAll(k, v);
  return s;
}

function matchSearch(text, query){
  if (!query) return true;
  const nQuery = normText(query);
  const nText = normText(text);
  if (nText.includes(nQuery)) return true;
  const lotQuery = toLotin(nQuery), lotText = toLotin(nText);
  if (lotText.includes(lotQuery)) return true;
  const kirQuery = toKirill(nQuery), kirText = toKirill(nText);
  return kirText.includes(kirQuery);
}

  <div onclick="${h(v.profBack)}" style="flex:none;width:32px;height:32px;border-radius:10px;border:1px solid var(--line3);display:flex;align-items:center;justify-content:center;font:600 14px 'IBM Plex Mono',monospace;color:var(--fg);cursor:pointer">←</div>
  <div style="flex:1;min-width:0">
    <div style="font:600 14px 'Space Grotesk',sans-serif">${title}</div>
    <div style="font:400 10px 'IBM Plex Mono',monospace;color:var(--dim2);margin-top:2px">${sub}</div>
  </div>
</div>`;}

function mPastOrders(v){
  if (v.pastEmpty) {
    if (!v.hasPhone) {
      return `
      <div style="border:1px dashed var(--line4);border-radius:14px;padding:30px 18px;text-align:center">
        <div style="font:600 13.5px 'Space Grotesk',sans-serif">Buyurtmalaringizni ko'rish uchun telefon raqamingizni kiriting</div>
        <div style="font:400 11px/1.4 'Space Grotesk',sans-serif;color:var(--dim);margin-top:6px">Raqamingiz orqali buyurtmalar tarixi va holati yuklanadi</div>
        <div onclick="${h(v.openPhoneSheet)}" style="display:inline-block;margin-top:14px;background:var(--acc);color:#06231d;border-radius:10px;padding:11px 16px;font:600 12px 'Space Grotesk',sans-serif;cursor:pointer">Telefon raqamni kiritish</div>
      </div>`;
    }
    return `
    <div style="border:1px dashed var(--line4);border-radius:14px;padding:30px 18px;text-align:center">
      <div style="font:600 13.5px 'Space Grotesk',sans-serif">Hozircha buyurtma yo'q</div>
      <div style="font:400 11px/1.4 'Space Grotesk',sans-serif;color:var(--dim);margin-top:6px">Katalogdan kamera yoki komplekt tanlab buyurtma bering</div>
      <div onclick="${h(v.goCatalogFromOrders)}" style="display:inline-block;margin-top:14px;background:var(--acc);color:#06231d;border-radius:10px;padding:11px 16px;font:600 12px 'Space Grotesk',sans-serif;cursor:pointer">Katalogga o'tish</div>
    </div>`;
  }
  return `
  <div style="display:flex;flex-direction:column;gap:9px">
    ${v.past.map(o=>`
      <div style="background:${o.cardBg};border:1px solid ${o.cardBorder};border-radius:13px">
        <div onclick="${h(o.toggle)}" style="display:flex;align-items:center;gap:10px;padding:12px 13px;cursor:pointer">
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font:600 10.5px 'IBM Plex Mono',monospace;color:var(--dim)">${o.id}</span>
              <span style="font:600 9px 'IBM Plex Mono',monospace;color:${o.fg};background:${o.bg};padding:3px 6px;border-radius:5px">${o.status}</span>
            </div>
            <div style="font:600 12.5px/1.3 'Space Grotesk',sans-serif;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${o.name}</div>
            <div style="font:400 10px 'IBM Plex Mono',monospace;color:var(--dim2);margin-top:4px">${o.meta}</div>
          </div>
          <div style="flex:none;font:600 11px 'IBM Plex Mono',monospace;color:var(--dim3)">${o.chev}</div>
        </div>
        ${o.open?`
        <div style="padding:0 13px 13px">
          <div style="display:flex;gap:7px;overflow:auto">
            ${o.items.map(it=>`
              <div onclick="${h(it.go)}" style="flex:none;width:62px;cursor:pointer">
                <div style="position:relative;width:62px;height:62px;border-radius:9px;overflow:hidden;border:1px solid var(--line2);background:repeating-linear-gradient(135deg,var(--hatchA) 0 8px,var(--hatchB) 8px 16px);display:flex;align-items:center;justify-content:center">
                  <span style="font:500 7px 'IBM Plex Mono',monospace;color:var(--dim5)">RASM</span>
                  <span style="position:absolute;top:4px;left:4px;font:600 7px 'IBM Plex Mono',monospace;color:var(--bg);background:var(--acc);padding:2px 3px;border-radius:3px">${it.badge}</span>
                  <span style="position:absolute;bottom:4px;right:4px;font:700 7.5px 'IBM Plex Mono',monospace;color:#eef2f1;background:rgba(0,0,0,.6);padding:2px 4px;border-radius:3px">${it.qty}</span>
                </div>
                <div style="font:400 8px/1.25 'IBM Plex Mono',monospace;color:var(--dim2);margin-top:5px;text-align:center">${it.short}</div>
              </div>`).join('')}
          </div>
          ${o.noteOn?`<div style="display:flex;gap:10px;margin-top:10px;padding:11px 12px;border-radius:11px;border:1px solid rgba(47,224,182,.3);background:rgba(47,224,182,.07)">
            <div style="flex:none;width:24px;height:24px;border-radius:50%;background:var(--acc);color:#06231d;display:flex;align-items:center;justify-content:center;font:600 11px 'IBM Plex Mono',monospace">✉</div>
            <div style="flex:1;min-width:0">
              <div style="font:600 9.5px 'IBM Plex Mono',monospace;color:var(--acc)">MENEJERDAN XABAR</div>
              <div style="font:400 11.5px/1.45 'Space Grotesk',sans-serif;color:var(--fg2);margin-top:4px;text-wrap:pretty">${o.note}</div>
              <div style="font:400 9px 'IBM Plex Mono',monospace;color:var(--dim2);margin-top:5px">${o.noteTime}</div>
            </div>
          </div>`:''}
          ${o.addrOn?`<div style="margin-top:10px;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--tile)">
            <div style="font:400 9px 'IBM Plex Mono',monospace;color:var(--dim2)">MANZIL</div>
            <div style="font:400 11px/1.4 'Space Grotesk',sans-serif;color:var(--fg2);margin-top:4px">${o.addr}</div>
            <div style="font:400 9px 'IBM Plex Mono',monospace;color:var(--dim2);margin-top:7px">QABUL QILUVCHI</div>
            <div style="font:400 11px 'IBM Plex Mono',monospace;color:var(--fg2);margin-top:4px">${o.rcp}</div>
          </div>`:''}
          <div style="display:flex;gap:8px;margin-top:11px">
            <div onclick="${h(o.again)}" style="flex:1;text-align:center;padding:10px;border-radius:9px;border:1px solid rgba(47,224,182,.4);color:var(--acc);font:600 11.5px 'Space Grotesk',sans-serif;cursor:pointer">Qayta buyurtma</div>
            <div onclick="${h(o.addMore)}" style="flex:none;padding:10px 12px;border-radius:9px;background:var(--acc);color:#06231d;font:600 11px 'Space Grotesk',sans-serif;cursor:pointer">＋ Yana</div>
            <div onclick="${h(o.receipt)}" style="flex:none;padding:10px 11px;border-radius:9px;border:1px solid var(--line3);color:var(--dim3);font:500 11px 'IBM Plex Mono',monospace;cursor:pointer">Chek</div>
          </div>
        </div>`:''}
      </div>`).join('')}
  </div>
  <div onclick="${h(v.addMoreOpen)}" style="margin-top:11px;display:flex;align-items:center;gap:11px;padding:13px;border-radius:13px;border:1px dashed rgba(47,224,182,.4);background:rgba(47,224,182,.05);cursor:pointer">
    <div style="flex:none;width:30px;height:30px;border-radius:9px;background:var(--acc);color:#06231d;display:flex;align-items:center;justify-content:center;font:700 15px 'IBM Plex Mono',monospace">＋</div>
    <div style="flex:1;min-width:0">
      <div style="font:600 12.5px 'Space Grotesk',sans-serif;color:var(--acc)">Yana xarid qo'shish</div>
      <div style="font:400 10px 'IBM Plex Mono',monospace;color:var(--dim2);margin-top:3px">Mavjud tizimga kamera, xotira yoki registrator</div>
    </div>
    <div style="flex:none;font:600 11px 'IBM Plex Mono',monospace;color:var(--acc)">→</div>
  </div>`;
}

function mProfile(v){return `
<div style="padding:0 16px 24px;display:flex;flex-direction:column;gap:16px">
  <div style="display:flex;align-items:center;gap:13px">
    <div style="width:52px;height:52px;border-radius:16px;background:var(--hatchC);display:flex;align-items:center;justify-content:center;font:600 17px 'IBM Plex Mono',monospace;color:var(--acc)">AB</div>
    <div>
      <div style="font:600 15px 'Space Grotesk',sans-serif">Aziz Bekmurodov</div>
      <div style="font:400 11px 'IBM Plex Mono',monospace;color:var(--dim);margin-top:3px">${v.myPhoneLabel}</div>
    </div>
  </div>

  ${v.profMenuOn?`
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
    ${v.profStats.map(st=>`<div style="border:1px solid var(--line);border-radius:12px;background:var(--card);padding:12px 11px"><div style="font:600 17px 'Space Grotesk',sans-serif;color:${st.fg}">${st.v}</div><div style="font:400 9px 'IBM Plex Mono',monospace;color:var(--dim2);margin-top:4px">${st.k}</div></div>`).join('')}
  </div>
  <div style="display:flex;flex-direction:column;gap:7px">
    ${v.profMenu.map(m=>`
      <div onclick="${h(m.go)}" style="display:flex;align-items:center;gap:12px;padding:13px;border-radius:13px;border:1px solid var(--line);background:var(--card);cursor:pointer">
        <div style="flex:none;width:32px;height:32px;border-radius:10px;background:var(--fill);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font:600 13px 'IBM Plex Mono',monospace;color:${m.markFg}">${m.mark}</div>
        <div style="flex:1;min-width:0">
          <div style="font:600 12.5px 'Space Grotesk',sans-serif">${m.name}</div>
          <div style="font:400 9.5px 'IBM Plex Mono',monospace;color:var(--dim2);margin-top:3px">${m.note}</div>
        </div>
        ${m.tagOn?`<div style="flex:none;font:600 9px 'IBM Plex Mono',monospace;color:${m.tagFg};background:${m.tagBg};padding:4px 7px;border-radius:5px">${m.tag}</div>`:''}
        <div style="flex:none;font:600 12px 'IBM Plex Mono',monospace;color:var(--dim4)">›</div>
      </div>`).join('')}
  </div>
  <div onclick="${h(v.signOut)}" style="text-align:center;padding:13px;border-radius:12px;border:1px solid var(--line3);color:var(--dim2);font:500 11.5px 'IBM Plex Mono',monospace;cursor:pointer">Hisobdan chiqish</div>`:''}

  ${v.profOrdersOn?`
  <div>
    ${mProfHead(v,'Buyurtmalarim',v.pastLabel)}
    ${mPastOrders(v)}
  </div>`:''}

  ${v.profNotifOn?`
  <div>
    ${mProfHead(v,'Bildirishnomalar',v.notifLabel)}
    ${v.notifEmpty?`<div style="border:1px dashed var(--line3);border-radius:13px;padding:22px 16px;text-align:center">
      <div style="font:600 12.5px 'Space Grotesk',sans-serif;color:var(--dim)">Hozircha xabar yo'q</div>
      <div style="font:400 10px/1.5 'IBM Plex Mono',monospace;color:var(--dim2);margin-top:6px">Buyurtma holati o'zgarganda menejer xabari shu yerda ko'rinadi</div>
    </div>`:''}
    <div style="display:flex;flex-direction:column;gap:8px">
      ${v.notifList.map(n=>`
        <div onclick="${h(n.go)}" style="display:flex;gap:11px;padding:12px;border-radius:13px;border:1px solid rgba(47,224,182,.3);background:rgba(47,224,182,.06);cursor:pointer">
          <div style="flex:none;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#06231d;display:flex;align-items:center;justify-content:center;font:600 11px 'IBM Plex Mono',monospace">✉</div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
              <span style="font:600 9.5px 'IBM Plex Mono',monospace;color:var(--acc)">${n.id}</span>
              <span style="font:400 9px 'IBM Plex Mono',monospace;color:var(--dim2)">${n.time}</span>
            </div>
            <div style="font:400 11.5px/1.45 'Space Grotesk',sans-serif;color:var(--fg2);margin-top:5px;text-wrap:pretty">${n.text}</div>
          </div>
        </div>`).join('')}
    </div>
  </div>`:''}

  ${v.profAddrOn?`
  <div>
    ${mProfHead(v,'Manzil va yetkazish',v.addrEta)}
    <div style="display:flex;flex-direction:column;gap:7px;margin-bottom:9px">
      ${v.addrItems.map(ad=>`
        <div style="display:flex;align-items:flex-start;gap:11px;padding:12px;border-radius:12px;border:1px solid ${ad.border};background:${ad.bg}">
          <div onclick="${h(ad.pick)}" style="flex:none;margin-top:2px;width:17px;height:17px;border-radius:50%;border:1.5px solid ${ad.mark};display:flex;align-items:center;justify-content:center;cursor:pointer">
            <div style="width:9px;height:9px;border-radius:50%;background:${ad.fill}"></div>
          </div>
          <div onclick="${h(ad.pick)}" style="flex:1;min-width:0;cursor:pointer">
            <div style="font:600 11.5px 'IBM Plex Mono',monospace;color:${ad.labelFg}">${ad.label}</div>
            <div style="font:400 11.5px/1.4 'Space Grotesk',sans-serif;color:var(--fg2);margin-top:4px;text-wrap:pretty">${ad.text}</div>
            <div style="font:400 9.5px 'IBM Plex Mono',monospace;color:var(--dim2);margin-top:4px">${ad.note}</div>
          </div>
          ${ad.delOn?`<div onclick="${h(ad.del)}" style="flex:none;width:26px;height:26px;border-radius:8px;border:1px solid var(--line3);display:flex;align-items:center;justify-content:center;font:600 11px 'IBM Plex Mono',monospace;color:var(--dim2);cursor:pointer">✕</div>`:''}
        </div>`).join('')}
    </div>
    ${v.addrFormOn?mAddrForm(v,false):`<div onclick="${h(v.openAddrForm)}" style="text-align:center;padding:12px;border-radius:12px;border:1px dashed rgba(47,224,182,.45);color:var(--acc);font:600 11.5px 'IBM Plex Mono',monospace;cursor:pointer;margin-bottom:9px">＋ YANGI MANZIL QO'SHISH</div>`}
    <div style="border:1px solid var(--line);border-radius:13px;background:var(--card);padding:14px">
      <div style="font:600 9.5px 'IBM Plex Mono',monospace;color:var(--dim2)">TANLANGAN HUDUD</div>
      <div style="font:600 14px 'Space Grotesk',sans-serif;margin-top:6px">${v.addrRegion}</div>
      <div style="font:400 10.5px 'IBM Plex Mono',monospace;color:var(--dim2);margin-top:5px">${v.addrPrice}</div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <div onclick="${h(v.openRegion)}" style="flex:1;text-align:center;padding:11px;border-radius:10px;background:var(--acc);color:#06231d;font:600 11.5px 'Space Grotesk',sans-serif;cursor:pointer">Hududni o'zgartirish</div>
        <div onclick="${h(v.gps)}" style="flex:none;padding:11px 13px;border-radius:10px;border:1px solid rgba(47,224,182,.4);color:var(--acc);font:600 11.5px 'Space Grotesk',sans-serif;cursor:pointer">◎ GPS</div>
      </div>
    </div>
  </div>`:''}

  ${v.profSetOn?`
  <div>
    ${mProfHead(v,'Ilova sozlamalari',v.setSub)}
    <div style="border:1px solid var(--line);border-radius:13px;background:var(--card);padding:14px">
      <div style="font:600 9.5px 'IBM Plex Mono',monospace;color:var(--dim2);letter-spacing:.06em">TIL</div>
      <div style="display:flex;flex-direction:column;gap:7px;margin-top:11px">
        ${v.langs.map(l=>`
          <div onclick="${h(l.go)}" style="display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;border:1px solid ${l.border};background:${l.bg};cursor:pointer">
            <div style="flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid ${l.mark};display:flex;align-items:center;justify-content:center">
              <div style="width:9px;height:9px;border-radius:50%;background:${l.fill}"></div>
            </div>
            <div style="flex:1;min-width:0">
              <div style="font:600 12.5px 'Space Grotesk',sans-serif">${l.name}</div>
              <div style="font:400 9.5px 'IBM Plex Mono',monospace;color:var(--dim2);margin-top:2px">${l.note}</div>
            </div>
          </div>`).join('')}
      </div>
    </div>
    <div style="margin-top:9px;border:1px solid var(--line);border-radius:13px;background:var(--card);padding:14px">
      <div style="font:600 9.5px 'IBM Plex Mono',monospace;color:var(--dim2);letter-spacing:.06em">MAVZU</div>
      <div style="display:flex;gap:8px;margin-top:11px">
        ${v.themes.map(t=>`
          <div onclick="${h(t.go)}" style="flex:1;padding:13px 11px;border-radius:11px;border:1px solid ${t.border};background:${t.bg};cursor:pointer;text-align:center">
            <div style="font:600 16px 'IBM Plex Mono',monospace;color:${t.iconFg}">${t.mark}</div>
            <div style="font:600 11.5px 'Space Grotesk',sans-serif;margin-top:7px">${t.name}</div>
            <div style="font:400 9px 'IBM Plex Mono',monospace;color:var(--dim2);margin-top:3px">${t.note}</div>
          </div>`).join('')}
      </div>
    </div>
    <div style="margin-top:9px;border:1px solid var(--line);border-radius:13px;background:var(--card);padding:14px">
      <div style="font:600 9.5px 'IBM Plex Mono',monospace;color:var(--dim2);letter-spacing:.06em">BILDIRISHNOMA</div>
      <div style="display:flex;flex-direction:column;gap:9px;margin-top:11px">
        ${v.pushRows.map(p=>`
          <div style="display:flex;align-items:center;gap:12px">
            <div style="flex:1;min-width:0">
              <div style="font:600 12px 'Space Grotesk',sans-serif">${p.name}</div>
              <div style="font:400 9.5px 'IBM Plex Mono',monospace;color:var(--dim2);margin-top:3px">${p.note}</div>
            </div>
            <div onclick="${h(p.go)}" style="flex:none;cursor:pointer;width:42px;height:24px;border-radius:13px;background:${p.track};padding:3px;display:flex;justify-content:${p.knob};transition:background .18s ease">
              <div style="width:18px;height:18px;border-radius:50%;background:${p.knobBg}"></div>
            </div>
          </div>`).join('')}
      </div>
    </div>
    <div style="margin-top:11px;font:400 9.5px/1.5 'IBM Plex Mono',monospace;color:var(--dim2);text-align:center">Ilova versiyasi 1.4.0 · KAMERA OPTOM QARSHI</div>
  </div>`:''}

  ${v.profPaymentOn?mProfPayment(v):''}
  ${v.profWarrantyOn?mProfWarranty(v):''}
  ${v.profAboutOn?mProfAbout(v):''}
</div>`;}

function mProfWarranty(v){return `
<div>
  ${mProfHead(v, "Kafolat va servis", "24 oygacha rasmiy kafolat")}
  <div style="display:flex;flex-direction:column;gap:10px">
    <div style="background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px">
      <div style="font:600 13px 'Space Grotesk',sans-serif;color:var(--acc)">Rasmiy kafolat shartlari</div>
      <div style="font:400 11.5px/1.5 'Space Grotesk',sans-serif;color:var(--dim3);margin-top:8px">Barcha videokameralar va NVR registratorlar uchun 24 oylik, xotira kartalari uchun 12 oylik to'liq servis kafolati beriladi.</div>
    </div>

  const fs=fk?act.selectionStart:null, fe=fk?act.selectionEnd:null;

  H=[];
  if (!DATA.ready && DATA.error) {
    DEV.setAttribute('data-theme', S.theme==='day'?'day':'night');
    document.documentElement.setAttribute('data-theme', S.theme==='day'?'day':'night');
    APP.innerHTML = `
<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:var(--bg);color:var(--fg);text-align:center;font-family:'Space Grotesk',sans-serif">
  <div style="width:64px;height:64px;border-radius:18px;background:rgba(255,77,61,.12);border:1px solid rgba(255,77,61,.35);display:flex;align-items:center;justify-content:center;font:700 24px 'IBM Plex Mono',monospace;color:#ff4d3d">!</div>
  <div style="font:700 18px 'Space Grotesk',sans-serif;margin-top:18px">Aloqa uzildi</div>
  <div style="font:400 12.5px/1.5 'Space Grotesk',sans-serif;color:var(--dim3);margin-top:8px;max-width:260px">${esc(DATA.error)}</div>
  <div onclick="${h(bootstrap)}" style="margin-top:20px;padding:12px 24px;border-radius:11px;background:var(--acc);color:#06231d;font:600 13px 'Space Grotesk',sans-serif;cursor:pointer">Qayta urinish</div>
</div>`;
    return;
  }

  const v=vals();
  DEV.setAttribute('data-theme', v.day?'day':'night');
  document.documentElement.setAttribute('data-theme', v.day?'day':'night');

  APP.innerHTML=`
<div style="height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font-family:'Space Grotesk',sans-serif;position:relative;overflow:hidden">
  ${mHeader(v)}
  <div style="flex:1;overflow:auto" id="scroller">
    ${v.homeOn?mHome(v):''}
    ${v.catOn?mCatalog(v):''}
    ${v.kitOn?mKit(v):''}
    ${v.expOn?mExpert(v):''}
    ${v.profOn?mProfile(v):''}
  </div>
  ${mNav(v)}
  ${v.detailOn?mDetail(v):''}
  ${v.cartOn?mCart(v):''}
  ${v.regionOn?mRegion(v):''}
  ${v.filtersOn?mFilters(v):''}
  ${v.storyOn?mStory(v):''}
  ${v.phoneOn?mPhone(v):''}
  ${v.okOn?mOk(v):''}
  ${v.addedOn?mAdded(v):''}
  ${v.toastOn?`<div style="position:absolute;left:16px;right:16px;bottom:82px;z-index:9;background:var(--fg);color:var(--bg);border-radius:12px;padding:13px 15px;font:600 12.5px 'Space Grotesk',sans-serif;box-shadow:0 12px 30px rgba(0,0,0,.5)">${v.toast}</div>`:''}
</div>`;

  const sc=document.getElementById('scroller'); if(sc) sc.scrollTop=_scroll;
  if(fk){ const el=APP.querySelector('[data-k="'+fk+'"]'); if(el){ el.focus(); try{el.setSelectionRange(fs,fe);}catch(e){} } }
}

let _scroll=0;
APP.addEventListener('scroll',e=>{ if(e.target.id==='scroller') _scroll=e.target.scrollTop; },true);

/* tab almashganda tepaga qaytish */
const _origSet=set;
window.set=function(o){ const t=S.tab, p=S.profPage, sl=S.sel; _origSet(o); if(S.tab!==t||S.profPage!==p||S.sel!==sl){ _scroll=0; const sc=document.getElementById('scroller'); if(sc) sc.scrollTop=0; } };

/* soat */
function tick(){ const d=new Date(); document.getElementById('clk').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); }
tick(); setInterval(tick,15000);
setInterval(()=>{ if(!S.ph&&!S.ok&&S.story===null){ S.bannerIdx=(S.bannerIdx+1)%3; if(S.tab==='home') render(); } },5000);
render();
bootstrap();
</script>
</body>
</html>
