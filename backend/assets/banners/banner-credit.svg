<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <pattern id="hatch2" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="24" height="24" fill="#0f1416"/>
      <rect width="12" height="24" fill="#12181a"/>
    </pattern>
    <linearGradient id="fade2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="30%" stop-color="#000" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".72"/>
    </linearGradient>
    <radialGradient id="glow2" cx="75%" cy="40%" r="48%">
      <stop offset="0%" stop-color="#2fe0b6" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#2fe0b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2224"/>
      <stop offset="100%" stop-color="#101618"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#hatch2)"/>
  <rect width="1200" height="600" fill="url(#glow2)"/>
  <!-- To'lov jadvali kartalari: 3 oy -->
  <g transform="translate(660 120) rotate(-8)">
    <rect width="200" height="240" rx="18" fill="url(#card)" stroke="rgba(255,255,255,.12)" stroke-width="2"/>
    <rect x="22" y="26" width="70" height="30" rx="8" fill="rgba(47,224,182,.15)" stroke="#2fe0b6" stroke-width="2"/>
    <rect x="22" y="86" width="156" height="10" rx="5" fill="rgba(255,255,255,.16)"/>
    <rect x="22" y="112" width="120" height="10" rx="5" fill="rgba(255,255,255,.1)"/>
    <rect x="22" y="176" width="156" height="34" rx="9" fill="#2fe0b6" opacity=".85"/>
  </g>
  <g transform="translate(840 90) rotate(4)">
    <rect width="200" height="240" rx="18" fill="url(#card)" stroke="#2fe0b6" stroke-width="2.5"/>
    <rect x="22" y="26" width="70" height="30" rx="8" fill="#2fe0b6"/>
    <rect x="22" y="86" width="156" height="10" rx="5" fill="rgba(255,255,255,.2)"/>
    <rect x="22" y="112" width="120" height="10" rx="5" fill="rgba(255,255,255,.12)"/>
    <circle cx="100" cy="180" r="34" fill="none" stroke="#2fe0b6" stroke-width="3"/>
    <path d="M84 180 l11 11 l21 -22" fill="none" stroke="#2fe0b6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(1020 130) rotate(12)" opacity=".55">
    <rect width="180" height="220" rx="18" fill="url(#card)" stroke="rgba(255,255,255,.1)" stroke-width="2"/>
    <rect x="20" y="24" width="62" height="28" rx="8" fill="rgba(47,224,182,.2)"/>
    <rect x="20" y="80" width="140" height="9" rx="4" fill="rgba(255,255,255,.12)"/>
  </g>
  <!-- 0% belgisi doirasi -->
  <g transform="translate(590 330)">
    <circle cx="60" cy="60" r="56" fill="rgba(47,224,182,.1)" stroke="#2fe0b6" stroke-width="3" stroke-dasharray="10 7"/>
    <circle cx="60" cy="60" r="30" fill="none" stroke="#2fe0b6" stroke-width="4"/>
    <line x1="38" y1="86" x2="84" y2="34" stroke="#2fe0b6" stroke-width="4" stroke-linecap="round"/>
  </g>
  <rect width="1200" height="600" fill="url(#fade2)"/>
</svg>
