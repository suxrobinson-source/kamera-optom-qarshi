<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <pattern id="hatch" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="24" height="24" fill="#0f1416"/>
      <rect width="12" height="24" fill="#12181a"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="30%" stop-color="#000" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".72"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#2fe0b6" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#2fe0b6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#hatch)"/>
  <rect width="1200" height="600" fill="url(#glow)"/>
  <!-- 4 kamera + NVR kompozitsiyasi (o'ng tomonda) -->
  <g transform="translate(700 90)" opacity=".95">
    <g transform="rotate(-14 120 120)">
      <rect x="30" y="80" width="190" height="95" rx="34" fill="#1b2224" stroke="#2fe0b6" stroke-width="3"/>
      <circle cx="248" cy="127" r="48" fill="#1b2224" stroke="#2fe0b6" stroke-width="3"/>
      <circle cx="248" cy="127" r="18" fill="#2fe0b6"/>
      <rect x="118" y="172" width="26" height="66" rx="12" fill="#1b2224" stroke="#2fe0b6" stroke-width="3"/>
      <rect x="76" y="232" width="112" height="26" rx="12" fill="#1b2224" stroke="#2fe0b6" stroke-width="3"/>
    </g>
    <g transform="translate(230 40) rotate(-14 90 90) scale(.62)" opacity=".55">
      <rect x="30" y="80" width="190" height="95" rx="34" fill="#161c1e" stroke="#2fe0b6" stroke-width="3"/>
      <circle cx="248" cy="127" r="48" fill="#161c1e" stroke="#2fe0b6" stroke-width="3"/>
      <circle cx="248" cy="127" r="18" fill="#2fe0b6" opacity=".6"/>
    </g>
    <g transform="translate(330 150) rotate(-14 70 70) scale(.4)" opacity=".3">
      <rect x="30" y="80" width="190" height="95" rx="34" fill="#161c1e" stroke="#2fe0b6" stroke-width="4"/>
      <circle cx="248" cy="127" r="48" fill="#161c1e" stroke="#2fe0b6" stroke-width="4"/>
    </g>
  </g>
  <!-- NVR qutisi -->
  <g transform="translate(760 400)">
    <rect width="330" height="86" rx="14" fill="#101618" stroke="rgba(255,255,255,.15)" stroke-width="2"/>
    <circle cx="42" cy="43" r="9" fill="#ff4d3d">
      <animate attributeName="opacity" values="1;.15;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <rect x="70" y="34" width="150" height="6" rx="3" fill="rgba(255,255,255,.18)"/>
    <rect x="70" y="48" width="100" height="6" rx="3" fill="rgba(47,224,182,.5)"/>
    <rect x="250" y="26" width="56" height="34" rx="7" fill="none" stroke="#2fe0b6" stroke-width="2"/>
  </g>
  <rect width="1200" height="600" fill="url(#fade)"/>
</svg>
